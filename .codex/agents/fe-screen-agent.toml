### 6. 보고 포맷 (필수)

작업 결과에는 반드시 아래를 포함합니다.

1. 생성/수정한 screen component 경로
2. page props 계약 요약
3. 조합한 lower-layer 목록
4. spec의 `## 화면 러프` 작성 여부

