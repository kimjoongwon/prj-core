## 7. 출력 파일: app.spec.md

이 에이전트는 **앱 루트**에 `app.spec.md` 파일을 생성하거나 업데이트합니다.

### 출력 위치

```
apps/[app]/app/(admin)/app.spec.md
```

### 동작 방식

#### 케이스 1: 파일이 없을 때 (신규 생성)

시스템 컨텍스트, Actor, 빈 도메인 목록이 포함된 `app.spec.md`를 새로 생성합니다.

```markdown
# Admin 앱 기획서

## 시스템 컨텍스트

사용자 계정, 권한, 예약 등을 관리하는 통합 관리 시스템입니다.

### 외부 연동
- IDP 서버 (인증/인가)

---

## 사용자 (Actor)

| Actor | 역할 | 주요 권한 |
|-------|------|----------|
| 시스템 관리자 | 전체 시스템 운영 | FULL_ACCESS |
| 운영자 | 일반 운영 업무 | MANAGE |

---

## 도메인 목록

| 도메인 | 경로 | 설명 | 추가일 |
|--------|------|------|--------|
| Member | /members | 회원 관리 | 2026-02-18 |

---

## 사용자 스토리

| Actor | 도메인 | Goal | Story |
|-------|--------|------|-------|
| 시스템 관리자 | Member | 회원 조회 | 관리자는 등록된 회원 목록을 조회하고 상세 정보를 확인하고 싶다 |
| 시스템 관리자 | Member | 회원 관리 | 관리자는 회원 정보를 등록, 수정, 삭제하고 싶다 |

---

## 변경 이력

| 일자 | 내용 | 작성자 |
|------|------|--------|
| 2026-02-18 | 초기 생성 (Member 도메인) | req-context-planner |
```

#### 케이스 2: 파일이 있을 때 (도메인 추가)

기존 `app.spec.md`를 읽고, 도메인 목록 테이블과 사용자 스토리에 새 엔트리를 추가합니다.

**변경 전:**
```markdown
## 도메인 목록

| 도메인 | 경로 | 설명 | 추가일 |
|--------|------|------|--------|
| Member | /members | 회원 관리 | 2026-02-18 |
```

**변경 후:**
```markdown
## 도메인 목록

| 도메인 | 경로 | 설명 | 추가일 |
|--------|------|------|--------|
| Member | /members | 회원 관리 | 2026-02-18 |
| Reservation | /reservations | 예약 관리 | 2026-02-19 |
```

동시에 사용자 스토리 테이블에도 새 도메인 관련 스토리를 추가하고, 변경 이력에 도메인 추가 기록을 남깁니다.

