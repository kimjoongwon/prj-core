- [연동 시스템 2]

---

## 사용자 (Actor)

| Actor | 역할 | 주요 권한 |
|-------|------|----------|
| 시스템 관리자 | 전체 시스템 운영 | FULL_ACCESS |
| 운영자 | 일반 운영 업무 | MANAGE |

---

## 도메인 목록

| 도메인 | 경로 | 설명 | 추가일 |
|--------|------|------|--------|
| [도메인명] | /[경로] | [설명] | YYYY-MM-DD |

---

## 사용자 스토리

| Actor | 도메인 | Goal | Story |
|-------|--------|------|-------|
| [Actor명] | [도메인명] | [목표명] | [스토리 설명] |

---

## 변경 이력

| 일자 | 내용 | 작성자 |
|------|------|--------|
| YYYY-MM-DD | 초기 생성 | req-context-planner |
```

