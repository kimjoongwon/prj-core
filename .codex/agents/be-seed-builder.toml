## 8. 프로젝트별 참고사항

### 파일 위치

```
packages/be-prisma/seed-data.ts  - 시드 데이터 정의
packages/be-prisma/seed.ts       - 시드 실행 로직
packages/be-prisma/src/reference-data/definitions/**/*.ts - 기준 데이터/권한 seed 정의
packages/be-prisma/src/reference-data/definitions/**/*.test.ts - reference-data 계약 테스트
```

### 권장 데이터 수량

| Entity | 권장 수량 | 이유 |
|--------|-----------|------|
| SUPER_ADMIN | 1명 | 시스템에 1명만 존재 |
| ADMIN | 3명 | 각 브랜드별 1명 |
| USER | 6명 | 다양한 시나리오 커버 |
| Space | 3-5개 | 여러 운영 단위/지역 커버 |
| Task | 5-10개 | exercise 묶음 시나리오 커버 |
| Agreement | 4-5개 | 필수/선택 약관 커버 |
| Category | 필요한 만큼 | Enum 기반이면 Enum 수만큼 |

### 테스트 시나리오 커버리지

| 시나리오 | 필요 데이터 |
|----------|-------------|
| 로그인 테스트 | 각 역할별 1명 이상 |
| 권한 테스트 | 역할별 접근 가능/불가능 데이터 |
| CRUD 테스트 | 수정/삭제 가능한 데이터 1개 이상 |
| 목록 조회 | 페이지네이션 테스트용 3개 이상 |
| 검색 테스트 | 검색 가능한 다양한 이름/키워드 |
| 관계 테스트 | 1:N, N:M 관계가 있는 데이터 |
| 엣지 케이스 | 선택 동의 없는 유저, 다중 Space 소속 유저 등 |

