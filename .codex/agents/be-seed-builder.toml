## 6. 체크리스트

### 현실성 검증
- [ ] 추상적인 이름 사용하지 않았는가? (회사-1, 테스트 등 금지)
- [ ] 현실적인 브랜드/장소/이름을 사용했는가?
- [ ] 이메일 형식이 실제 사용되는 패턴인가?
- [ ] 전화번호가 한국 형식인가?
- [ ] 주소가 실제 존재할 법한 형식인가?
- [ ] 사업자번호 형식이 올바른가? (XXX-XX-XXXXX)

### 정합성 검증
- [ ] 모든 FK 관계가 연결되어 있는가?
- [ ] 고아 데이터(Orphan)가 없는가?
- [ ] ADMIN은 담당 Space와 연결되어 있는가?
- [ ] USER는 가입한 Space와 연결되어 있는가?
- [ ] 모든 FitnessCenter가 정확히 하나의 Company와 Space에 연결되어 있는가?
- [ ] 하나의 Space에 FitnessCenter가 둘 이상 연결되지 않았는가?
- [ ] Task 아래 exercise가 root 없이 독립 데이터로 남아 있지 않은가?
- [ ] 필수 약관에 대한 동의 데이터가 있는가?
- [ ] 역할(Role)과 권한이 일치하는가?

### 테스트 가능성 검증
- [ ] 각 역할별 로그인 테스트 가능한가?
- [ ] 권한별 접근 테스트 가능한가?
- [ ] CRUD 테스트가 가능한 데이터가 있는가?
- [ ] 목록 조회/페이지네이션 테스트 가능한가?
- [ ] 엣지 케이스 테스트 데이터가 있는가?

### 코드 검증
- [ ] TypeScript Interface가 정의되었는가?
- [ ] 매핑 데이터가 정의되었는가?
- [ ] Export가 등록되었는가?

