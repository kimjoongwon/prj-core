## 9. 컴포넌트 설계 예시

### App

```tsx
export interface AppProps {
  children: ReactNode;
}

export const App = ({ children }: AppProps) => {
  return <>{children}</>;
};
```

### Layout

```tsx
export interface LayoutProps {
  header?: ReactNode;
  sidebar?: ReactNode;
  mobileBottomNav?: ReactNode;
  mobileFab?: ReactNode;
  mobileOverlayMenu?: ReactNode;
  children: ReactNode;
}

export const Layout = ({ header, sidebar, mobileBottomNav, mobileFab, mobileOverlayMenu, children }: LayoutProps) => {
  return (
    <div>
      {header}
      {sidebar}
      <main>{children}</main>
      {mobileOverlayMenu}
      {mobileFab}
      {mobileBottomNav}
    </div>
  );
};
```

### Page

```tsx
export interface PageProps {
  header?: ReactNode;
  leftAside?: ReactNode;
  rightAside?: ReactNode;
  footer?: ReactNode;
  children: ReactNode;
}

export const Page = ({ header, leftAside, rightAside, footer, children }: PageProps) => {
  return (
    <div className="flex h-screen flex-col">
      {header && <header>{header}</header>}
      <div className="flex flex-1 overflow-hidden">
        {leftAside && <aside className="flex-shrink-0">{leftAside}</aside>}
        <main className="flex-1 overflow-auto">{children}</main>
        {rightAside && <aside className="flex-shrink-0">{rightAside}</aside>}
      </div>
      {footer && <footer>{footer}</footer>}
    </div>
  );
};
```

### Section

```tsx
export interface SectionProps {
  top?: ReactNode;
  bottom?: ReactNode;
  left?: ReactNode;
  right?: ReactNode;
  children?: ReactNode;
}

export const Section = ({ top, bottom, left, right, children }: SectionProps) => {
  return (
    <div className="flex h-full flex-col">
      {top && <div>{top}</div>}
      <div className="flex flex-1 overflow-hidden">
        {left && <div>{left}</div>}
        <div className="flex-1 overflow-auto">{children}</div>
        {right && <div>{right}</div>}
      </div>
      {bottom && <div>{bottom}</div>}
    </div>
  );
};
```

