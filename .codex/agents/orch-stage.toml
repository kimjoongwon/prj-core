## 6. Stage 계약

### Stage 1: 도메인 기획

**목표**
- L0-L4 기획
- BE contract 작성
- State Contract 작성(조건부)
- API 생성의 근간이 되는 공통 backend scope/authorization invariant 정의

**주 호출 role**
- `orch-requirement`

**위임 규칙**
- exact 분기와 child role fan-out은 반드시 `orch-requirement` 문서를 따릅니다.
- 새 도메인 / 기존 도메인 화면 추가 구분도 `orch-requirement`를 source of truth로 사용합니다.
- 목록/검색 계열 API의 공통 scope 규칙은 Stage 1에서 `req-api-planner`와 `req-logic-planner`가 owner contract에 기록합니다.
- 예: `FULL_ACCESS`면 전체 조회, 아니면 현재 `x-space-id`가 해석한 tenant/space 범위만 허용하는 규칙

**핵심 산출물**
- `apps/[app]/web/src/app/(admin)/app.context.md`
- 각 `page.spec.md`
- backend/app/service/repository 구현 계약 handoff
- backend/store 구현 계약 메모(금지 계층 spec 생성 없음)

**완료 gate**
- domain / page / BE / State Contract 확인

### Stage 2: 스키마 구현

**목표**
- Prisma / 공용 schema / Entity / DTO / Query DTO 구현
- BE unit test 전략/기획/구현/실행

**주 호출 role**
- `be-prisma-builder`
- `common-schema-builder` (필요 시)
- `be-entity-builder`
- `be-dto-builder`
- `be-query-dto-builder`
- `be-seed-maker` (필요 시)
- join: `be-unit-test-builder → req-be-test-planner → qa-be-testing`

**fan-out 단위**
- `targets`

**자동 판단 소스**
- Entity 구현 계약 메모
- `## 구현 대상` 섹션 우선, 없으면 도메인 spec과 구조로 보정

**완료 gate**
- schema / entity / dto 생성
- 관련 contract 반영
- backend-unit 통과

### Stage 3: 백엔드 구현

**목표**
- Repository / Service / ApplicationService / Facade(조건부) / Integration Facade(조건부) / Controller / Module 구현
- Create/Update form bootstrap 계약 포함
- Stage 1에서 정의한 공통 backend scope/authorization invariant를 실제 쿼리/서비스/앱 계층에 강제

**주 호출 role**
- `be-repository-builder`
- `be-service-builder`
- `be-app-builder`
- `be-facade-builder` (조건부)
- `be-integration-builder` (조건부)
- `be-controller-builder`
- join: `be-unit-test-builder → req-be-test-planner → qa-be-testing`

**fan-out 단위**
- `targets`

**자동 판단 소스**
- API/Controller 구현 계약 메모
- 관련 App / Service / Repository spec

**특수 규칙**
- Stage 3 완료 후 Stage 4 진입 전 Orval 실행
- 목록 조회의 공통 scope 규칙은 Stage 1 spec을 source of truth로 구현하며, 화면 단위(Stage 4-6)에서 별도 규칙으로 재정의하지 않습니다.

**완료 gate**
- 서버 기동 가능
- backend-unit 통과

### Stage 4: 화면 기획

**목표**
- L5-L12 화면 기획
- route layout skeleton / slot topology / surface ownership 결정
- 목록/테이블 화면의 columns/cell 계약 확정
- route page, fe-ui Page/Feature spec의 테스트 관점 authoring

**주 호출 role**
- `orch-screen-planner`
- `req-route-layout-planner`
- `req-spec-tracker`

**위임 규칙**
- exact child planner fan-out은 반드시 `orch-screen-planner` 문서를 따릅니다.
- `display`, `control`, `cell`, `columns`, `widget`, `layout`, `feature`, `state`, `collection/detail/form`, `pure page`, `thin container`, `API integration`, `test` 기획 규칙은 `orch-screen-planner`가 관련 구현 role 문서를 읽고 반영해야 합니다.

**fan-out 단위**
- `pages`

**완료 gate**
- `page.spec.md` 업데이트
- 관련 fe-ui Page/Feature/Widget owner spec 생성/갱신
- route page.spec.md 또는 관련 Page/Feature/Widget spec의 테스트 케이스 반영
- `spec-checklist.md`의 Spec exists 반영

### Stage 5: 컴포넌트 구현

**목표**
- Display / Columns / Control / Cell / Widget / 재사용 Layout / Feature / `collection-detail-form` 전용 계층 구현
- FE unit test 전략/기획/구현/실행

**주 호출 role**
- `fe-display-component-builder`
- `fe-columns-builder` (목록/테이블 화면일 때)
- `fe-control-component-builder`
- `fe-cell-builder`
- `fe-widget-builder`
- `fe-layout-builder`
- `fe-feature-builder`
- `fe-data-grid-builder` / `fe-detail-builder` / `fe-form-builder`
- `fe-state-builder` (page-local state class/hook 이 필요할 때)
- `fe-store-builder`
- `fe-menu-builder` (조건부)
- join: `fe-unit-test-builder → req-fe-test-planner → qa-fe-testing`

**fan-out 단위**
- `pages`

**위임 규칙**
- columns/cell 경계는 `fe-columns-builder`를 source of truth로 사용합니다.
- `page role`별 구현 경계는 `fe-data-grid-builder`, `fe-detail-builder`, `fe-form-builder`를 source of truth로 사용하고, collection/list 또는 collection/grid 성격의 순수 UI 조합은 `fe-widget-builder` 기준을 따릅니다.
- 단일 page / route 전용 상태는 `fe-state-builder`, 여러 page / domain 에서 재사용되는 상태는 `fe-store-builder`를 source of truth로 사용합니다.
- route/page 시각 소유권 세부 규칙은 Stage 6 builder 문서를 재복제하지 않습니다.

**완료 gate**
- Stage 4 contract 반영
- FE component 산출물 및 허용 owner spec 반영
- frontend-unit 통과

### Stage 6: 페이지 통합

**목표**
- route `layout.tsx`
- `@slot/default.tsx`
- pure page
- thin container
- API integration
- route/page contract 검증

**주 호출 role**
- `fe-route-layout-builder`
- `fe-ui-page-builder`
- `fe-page-builder`
- `fe-api-integrator`
- `fe-state-builder` (thin container 에서 page-local state wiring 이 필요할 때)
- review: `/fe-review`
- join: `fe-unit-test-builder → req-fe-test-planner → qa-fe-testing → req-spec-tracker`

**fan-out 단위**
- `pages`

**위임 규칙**
- route skeleton / slot ownership은 `fe-route-layout-builder`를 source of truth로 사용합니다.
- pure page 경계는 `fe-ui-page-builder`를 source of truth로 사용합니다.
- thin container / `page role` / `reusable target` 검증은 `fe-page-builder`를 source of truth로 사용합니다.
- URL query state / React Query server state / MobX page-local state 경계는 `fe-state-builder`와 `fe-page-builder` 문서를 함께 기준으로 따릅니다.
- Create/Update의 `AiForm` 통합 규칙도 `fe-page-builder`와 관련 page spec을 기준으로 따릅니다.

**완료 gate**
- route/page contract 검증 통과
- `spec-checklist.md`의 Code paired 반영
- frontend-unit 통과

### Stage 7: E2E 검증

**목표**
- BE/FE E2E 구현 및 실행
- Stage 4/2/3에서 기록된 E2E 케이스와 테스트 파일 sync
- checklist Verified 반영

**주 호출 role**
- `be-e2e-builder`
- `req-be-test-planner`
- `qa-be-e2e-testing`
- `fe-e2e-builder`
- `req-fe-test-planner`
- `qa-fe-e2e-testing`
- `req-spec-tracker`

**실행 규칙**
- 기본 순서는 BE E2E 안정화 후 FE E2E입니다.
- 이 Stage는 사용자 요청 시에만 실행합니다.

**완료 gate**
- e2e 통과
- `spec-checklist.md` Verified 반영

---

## 7. 병렬 실행 엔진

### 7.1 파라미터

| 파라미터 | 기본값 | 설명 |
|---------|--------|------|
| `parallel` | `auto` | `off`, `auto`, `force` |
| `maxConcurrency` | `3` | 동시 실행 agent 상한 |
| `targets` | - | Stage 2-3 fan-out 대상 |
| `pages` | - | Stage 4-6 fan-out 대상 |
| `failPolicy` | `fail-fast` | `fail-fast`, `continue` |

### 7.2 우선순위

1. 명시된 `targets`
2. 명시된 `pages`
3. spec의 `## 구현 대상` 섹션
4. 폴더 구조 / page 키워드 기반 보정

### 7.3 Stage별 fan-out 단위

| Stage | fan-out 단위 | join 시점 |
|-------|--------------|-----------|
| 2 | `targets` | seed / test chain |
| 3 | `targets` | test chain |
| 4 | `pages` | route layout / checklist 반영 완료 시점 |
| 5 | `pages` | FE unit test chain |
| 6 | `pages` | FE unit test chain + checklist 반영 |

### 7.4 DAG 처리 규칙

- 의존성이 없는 같은 레벨은 병렬 실행 가능합니다.
- 부모-자식 의존이 있으면 위상 정렬 후 레벨별로 실행합니다.
- `parallel=force`라도 lock 대상 충돌과 명시된 의존성은 무시하지 않습니다.

### 7.5 자동 판단 규칙

| Stage | 1차 분석 위치 | 보조 판단 |
|-------|---------------|-----------|
| 2 | Entity 구현 계약 메모 | Entity 의존성 |
| 3 | API/Service/App 구현 계약 메모 | target별 API/Service/App 계약 |
| 4 | `apps/[app]/web/src/app/(admin)/[domain]/**/page.spec.md` | page 목록 / route 구조 |
| 5 | `apps/[app]/web/src/app/(admin)/[domain]/**/page.spec.md` | `page role`, `reusable target` |
| 6 | `apps/[app]/web/src/app/(admin)/[domain]/**/page.spec.md` | page 목록 / slot 구조 |

### 7.6 lock / merge

- fan-out 중 공유 파일은 수정 예약만 하고, 최종 반영은 join 단계의 단일 writer가 수행합니다.
- `admin-menu.ts`, package barrel, `app.context.md`는 가장 흔한 충돌 지점으로 간주합니다.

### 7.7 failPolicy

- `fail-fast`: 첫 실패 시 나머지 fan-out을 중단하고 Stage 실패로 보고
- `continue`: 실패 항목을 분리 기록하고 가능한 항목만 계속 진행

### 7.8 진행 로그 최소 형식

```text
🚀 Stage N 시작
📋 Domain/App/Page/Targets 요약
⚙️ Parallel / maxConcurrency / failPolicy
📊 실행 계획: Level 또는 page fan-out 요약
▶️ fan-out 실행 중
▶️ join 실행 중
✅ Stage N 완료 또는 ❌ Stage N 실패
```

