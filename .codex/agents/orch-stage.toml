## 2. 언제 사용하는가?

| 상황 | 사용 여부 | 설명 |
|------|----------|------|
| 새 페이지/기능 전체 개발 | O | Stage 1부터 전체 플로우 실행 |
| 기존 설계서 기반 구현 | O | 해당 Stage부터 시작 |
| 특정 Stage만 재실행 필요 | O | `run stage=N` 모드 사용 |
| 단순 버그 수정 | X | 개별 role 직접 호출 |
| 단일 컴포넌트/단일 페이지 소규모 수정 | X | 해당 planner/builder 직접 호출 |

