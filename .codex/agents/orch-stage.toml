## 5. 공통 규칙

### 5.1 필수 규칙

- 각 Stage 완료 후 반드시 사용자 리뷰를 기다립니다.
- 현재 호출에서는 요청된 `stage` 하나만 수행합니다.
- Stage 완료 또는 실패 메시지를 출력한 뒤 추가 Task/agent 호출을 시작하지 않고 종료합니다.
- 다음 Stage는 사용자가 명시적으로 `continue`, `next`, `stage=N` 등으로 승인한 경우에만 실행합니다.
- Stage 완료 전 child agent finding을 해결하기 위한 follow-up은 현재 Stage 실행의 일부로 간주합니다.
- 각 Stage 완료 메시지에 `핵심 의도:` 1줄을 포함합니다.
- Stage 실행 전 관련 child role 문서를 반드시 읽습니다.
- Stage 3 완료 후 Stage 4 진입 전 Orval을 실행합니다.
- 변경이 발생하면 영향받는 최초 Stage부터 재시작합니다.
- `parallel=auto`를 기본으로 사용합니다.
- 병렬 fan-out 후 join 단계에서 테스트/검증을 1회 수행합니다.
- Stage 시작 전 `stage-ledger.json`을 생성/갱신하고, Stage 완료 전 ledger verifier를 통과해야 합니다.
- child agent의 `Feedback: none`은 완료 조건이 아니라 ledger verifier의 입력일 뿐입니다.
- 허용 대상(route page, fe-ui Page, fe-ui Feature)의 코드/spec 변경 시 대응 owner spec과 `## 변경 이력`을 함께 반영합니다.
- Widget/leaf 계층 변경 계약은 신규 sidecar를 만들지 않고 nearest route page 또는 Page/Feature owner spec에 기록합니다.
- 허용 대상 밖의 코드에는 신규 sidecar spec을 만들지 않습니다.

### 5.2 금지 규칙

- 사용자 승인 없이 다음 Stage로 진행 금지
- 단일 호출에서 여러 Stage를 연속 실행하는 행위 금지
- deprecated / fallback / 하위호환 코드 작성 금지
- Stage 순서 건너뛰기 금지
- lock 대상 공유 파일 동시 수정 금지
- `parallel=force`로 의존 관계 무시 금지
- 신규 도메인 admin/web 작업에서 backend/API/Orval 계약이 없는데 mock 또는 scaffold 화면만으로 완료 보고 금지

### 5.3 공유 파일 lock 규칙

다음 파일은 fan-out 중 단일 writer만 최종 머지합니다.

- `apps/*/web/src/app/(admin)/app.context.md`
- `packages/*/src/index.ts`
- `packages/common-constant/src/routing/admin-menu.ts`
- 메뉴/라우팅 변경 메모
- `**/PROGRESS.md`

### 5.4 테스트 컨텍스트 분리 규칙

| Stage | 컨텍스트 | 체인 |
|-------|----------|------|
| 2, 3 | `backend-unit` | `be-unit-test-builder → req-be-test-planner → qa-be-testing` |
| 5, 6 | `frontend-unit` | `fe-unit-test-builder → req-fe-test-planner → qa-fe-testing` |
| 7 | `e2e` | `be-e2e-builder → req-be-test-planner → qa-be-e2e-testing → fe-e2e-builder → req-fe-test-planner → qa-fe-e2e-testing → req-spec-tracker` |

- 서로 다른 테스트 컨텍스트를 같은 agent 흐름에서 섞지 않습니다.
- builder는 전략 결정자이고, `req-*`는 spec authoring/sync, `qa-*`는 최종 테스트 작성/실행 마무리를 담당합니다.

### 5.5 리뷰 체크포인트

- Stage 완료 보고의 마지막 줄에는 반드시 `📌 리뷰 요청: Stage N 결과 검토 후 다음 단계 진행 여부를 지정해 주세요.`를 포함합니다.
- Stage N+1 제안은 가능하지만 자동 실행하지 않습니다.
- 사용자가 수정 의견을 주면 영향받는 최초 Stage부터 재시작 범위를 다시 판단합니다.

### 5.6 Feedback Router / Re-entry 규칙 (Critical)

orch-stage는 child agent들이 서로 직접 지시하거나 다른 child agent의 파일을 임의 수정하게 두지 않습니다.
모든 finding은 orch-stage가 받아 영향 범위를 분류하고, 필요한 follow-up 또는 re-entry를 결정합니다.

#### 5.6.1 child agent 위임 프롬프트 필수 항목

child agent를 생성하거나 follow-up을 보낼 때는 최종 응답에 아래 feedback packet을 포함하도록 지시합니다.
대부분 child role 문서에도 packet 필수 보고 형식이 내장되어 있으나, orch-stage는 위임 프롬프트에서도 다시 요구합니다.

```text
Feedback:
- status: resolved | blocked | needs-contract | needs-implementation | needs-test | needs-reentry
- feedback_type: none | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | 5 | 6 | 7 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

#### 5.6.2 packet 누락 처리

- child agent 결과에 `Feedback:` packet이 없으면 같은 agent에 `send_input`으로 1회 보완 요청합니다.
- 보완 요청에는 원래 결과 요약과 필요한 packet field를 함께 전달합니다.
- 두 번째 결과에도 packet이 없으면 현재 Stage 내부 전제 누락은 `dependency-missing`, 실행 불가 상태는 `implementation-blocker`로 간주하고 Stage를 실패 또는 review pending으로 종료합니다.
- `feedback=off`이면 follow-up을 실행하지 않고 packet 내용을 Stage 완료 보고의 review 항목으로만 남깁니다.

#### 5.6.3 분류 규칙

| feedback_type | 기본 처리 |
|---------------|-----------|
| `none` | join 후보로 수집 |
| `contract-gap` | 도메인/API/BE contract는 `orch-requirement` 또는 `req-api-planner`, 화면/page/feature contract는 `orch-screen-planner feedback_mode=reentry`로 분류 |
| `api-integration-gap` | API contract 불일치면 `req-api-planner`, wiring 문제면 `req-api-integration-planner` 또는 `fe-api-integrator` follow-up |
| `ui-composition-gap` | `orch-screen-planner feedback_mode=reentry`로 보내 affected `req-*` planner만 최소 재진입 |
| `implementation-blocker` | 같은 agent가 해결 가능하면 `send_input`, role 경계 밖이면 해당 builder `agent_type` 생성 |
| `test-failure` | 제품 contract 문제와 테스트 기대값 문제를 분리한 뒤 affected builder 또는 `req-*-test-planner`로 재진입 |
| `spec-drift` | owner spec을 먼저 갱신한 뒤 구현/테스트 follow-up |
| `shared-file-conflict` | fan-out 쓰기를 중단하고 join 단계 single writer를 지정 |
| `dependency-missing` | 현재 Stage 전제조건이면 Stage 실패, 현재 Stage 내부 누락이면 해당 role follow-up |

#### 5.6.4 re-entry 판단

- `affected_stage`가 현재 Stage와 같으면 현재 Stage 내부 feedback loop로 처리합니다.
- `affected_stage`가 현재 Stage보다 뒤면 현재 Stage 산출물에 downstream handoff로 기록하고 다음 Stage 자동 실행은 하지 않습니다.
- `affected_stage`가 현재 Stage보다 앞이고 `reentry=review`이면 현재 Stage를 실패 또는 review pending으로 종료하고, 재시작 범위와 필요한 `stage=N`을 보고합니다.
- `affected_stage`가 현재 Stage보다 앞이고 사용자가 `reentry=auto`를 명시했으면 영향받은 최초 Stage의 owner role만 최소 범위로 실행하고, 이후 현재 Stage를 다시 검증합니다.
- Stage 경계를 넘는 re-entry에서도 다음 Stage 자동 진행 금지 규칙은 유지합니다.

#### 5.6.5 re-entry 호출 payload

| finding | 호출 payload |
|---------|-------------|
| 도메인/API/BE contract gap | `orch-requirement feedback_mode=reentry feedback_type=contract-gap affected_files=<files> affected_roles=<roles> required_action=<action>` |
| 화면/page/feature/spec drift | `orch-screen-planner feedback_mode=reentry feedback_type=<contract-gap|spec-drift|ui-composition-gap> affected_files=<files> affected_roles=<roles> required_action=<action>` |
| API integration wiring gap | `req-api-integration-planner` 또는 `fe-api-integrator`에 affected route/page/hook과 `required_action`을 전달 |
| QA/test failure | 원인 contract owner를 먼저 판단한 뒤 `req-*-test-planner`와 affected QA role을 재실행 |

#### 5.6.6 follow-up 실행 순서

1. child agent 결과의 feedback packet을 수집합니다.
2. finding이 없으면 join으로 진행합니다.
3. finding이 있으면 contract, API integration, UI composition, implementation, test, shared-file, dependency 중 하나로 분류합니다.
4. 같은 실행 agent가 해결 가능하면 `send_input`으로 follow-up을 전달합니다.
5. 종료된 agent 또는 다른 role 책임이면 필요한 `agent_type`으로 새 agent를 생성합니다.
6. 공유 파일 변경은 join 단계 single writer가 최종 반영합니다.
7. 동일 slice에 대해 QA chain을 다시 실행해 feedback loop 종료 여부를 확인합니다.

#### 5.6.7 Stage별 대표 feedback path

| source | path |
|--------|------|
| Stage 1 domain/API contract gap | `child role → orch-stage → orch-requirement feedback_mode=reentry → affected req-* planner → downstream QA` |
| Stage 3 API 구현 중 DTO/API contract gap | `be-controller-builder → orch-stage → req-api-planner → affected BE builder → qa-be-testing` |
| Stage 4/5 component 구현 중 page/spec mismatch | `FE builder → orch-stage → orch-screen-planner feedback_mode=reentry → affected planner → affected builder → qa-fe-testing` |
| Stage 6 API integration 중 Orval hook mismatch | API/DTO contract 문제면 `req-api-planner`, route wiring 문제면 `req-api-integration-planner` 또는 `fe-api-integrator follow-up`, page data shape 문제면 `orch-screen-planner feedback_mode=reentry` |
| Stage 7 E2E regression | `qa-*-e2e-testing → orch-stage → affected planner/builder/test planner → qa-*-e2e-testing → req-spec-tracker` |

### 5.7 신규 도메인 Admin Page Contract Gate (Critical)

`admin/web`에서 새로운 도메인 또는 아직 API가 없는 도메인의 페이지를 만들 때는 프론트 화면만으로 완료 처리하지 않습니다.
`Course`, `CourseOffering`, `Enrollment`, `CoursePass`처럼 결제/수강권/운영 일정과 backend persistence/API가 함께 필요한 도메인은 Stage 1-3 backend contract가 Stage 4-6 frontend integration보다 먼저 닫혀야 합니다.

#### 5.7.1 사전 확인

- Stage 4-6 진입 전에 Prisma model 또는 기존 persistence 계약을 확인합니다.
- DTO, Entity, Repository, Service, ApplicationService, Facade, Controller 중 해당 도메인에 필요한 backend layer의 존재 또는 구현 범위를 확인합니다.
- Swagger 노출과 `@cocrepo/api` Orval 생성 hook 존재를 확인합니다.
- admin/web route는 Orval 생성 React Query hook으로 실제 API에 연결되어야 합니다.

#### 5.7.2 Hard Blocker

아래 중 하나라도 있으면 현재 Stage를 완료하지 말고 `contract-gap` 또는 `needs-contract`로 처리합니다.

- `@cocrepo/api/core/[domain]` 경로 또는 필요한 Orval hook이 없음
- Prisma model, DTO, API contract 중 필요한 계약이 없음
- child agent가 `status: needs-contract`, `status: blocked`, `feedback_type: contract-gap`, `feedback_type: api-integration-gap`을 보고함
- 백엔드 계약이 필요한 요청을 단순 `admin/web` 화면 요청으로 축소해야만 구현 가능한 상태

#### 5.7.3 처리 규칙

- hard blocker가 있으면 `orch-requirement`, `req-context-planner`, `req-entity-planner`, `req-api-planner` 또는 backend builder chain으로 재진입 범위를 보고합니다.
- backend 구현이 필요한 경우 Stage 2-3 flow(`be-prisma-builder`, `be-dto-builder`, `be-repository-builder`, `be-service-builder`, `be-app-builder`, `be-facade-builder`, `be-controller-builder`)를 먼저 열도록 보고합니다.
- API client가 없으면 Swagger 확인 후 `fe-api-integrator` 또는 Orval codegen 범위를 보고합니다.
- 사용자가 명시적으로 scaffold/prototype/mock을 요청한 경우에만 mock 화면 산출물을 허용하며, 완료 메시지에 backend/API 미완료 상태를 별도 blocker로 남깁니다.

### 5.8 Stage Work Ledger Gate (Critical)

`orch-stage`는 child agent 최종 보고만으로 Stage 완료를 선언하지 않습니다.
Stage 시작 시점에 해야 할 일을 machine-readable ledger로 고정하고, Stage 종료 직전에 실제 파일/테스트/스펙 상태를 기준으로 ledger를 검증합니다.

#### 5.8.1 ledger 위치

도메인별 ledger는 아래 파일을 사용합니다.

```text
apps/[app]/web/src/app/(admin)/[domain]/stage-ledger.json
```

기존 `spec-checklist.md`는 owner spec/code/verified 페어링 요약을 유지하고, `stage-ledger.json`은 Stage 1-7 전체의 required work item 원장으로 사용합니다.
전역 docs 집계 파일을 만들지 않습니다.

#### 5.8.2 item schema

ledger item은 최소한 아래 필드를 포함합니다.

```json
{
  "id": "S3-BE-SERVICE-001",
  "stage": 3,
  "slice": "Reservation",
  "agent_type": "be-service-builder",
  "required": true,
  "source_spec": ["apps/admin/web/src/app/(admin)/reservations/page.spec.md"],
  "expected_files": ["packages/be-service/src/reservation.service.ts"],
  "verification": ["pnpm --filter @cocrepo/service test"],
  "status": "planned",
  "blocked_reason": null
}
```

`status`는 `planned | assigned | implemented | verified | blocked`만 사용합니다.
`required=true` item은 `verified`가 아니면 Stage 완료로 닫을 수 없습니다.
단, 외부 전제조건 때문에 진행할 수 없는 item은 `blocked`로 남기고 Stage를 실패 또는 review pending으로 종료합니다.

#### 5.8.3 생성/갱신 규칙

1. Stage 실행 전 입력(`stage`, `app`, `domain`, `page/pages`, `targets`)과 기존 spec을 읽어 현재 Stage의 required item을 ledger에 기록합니다.
2. 각 child agent 위임 프롬프트에는 담당 ledger item id를 명시합니다.
3. child agent 최종 보고에 `Feedback: none`이 있어도 담당 ledger item은 자동으로 `verified`가 되지 않습니다.
4. child agent 보고에 아래 ledger result가 없으면 join 단계에서 해당 item을 `implemented`까지만 인정하고 verifier가 실제 상태를 확인합니다.

```text
Ledger:
- completed_items: <item id list or none>
- blocked_items: <item id list or none>
- changed_files: <file list or none>
- verification: <command/result list or none>
```

#### 5.8.4 완료 verifier

Stage 완료 보고 직전 `req-spec-tracker` 또는 join single writer가 ledger verifier 역할을 수행합니다.
verifier는 최소한 아래를 확인합니다.

- `expected_files`의 실제 존재 여부
- package barrel/export, route/menu, Orval hook처럼 파일 존재만으로 부족한 연결 상태
- 허용 owner spec과 `## 변경 이력` 동기화
- Stage별 필수 테스트/검증 명령 실행 결과 또는 실행 불가 사유
- `spec-checklist.md`의 `Spec exists`, `Code paired`, `Verified`와 ledger 상태의 불일치
- 가능하면 `pnpm stage-ledger:check -- apps/[app]/web/src/app/(admin)/[domain]/stage-ledger.json` 실행 결과

불일치가 있으면 `feedback_type=dependency-missing` 또는 적절한 gap type으로 분류하고 affected `agent_type`에 재할당합니다.

#### 5.8.5 Stage별 required item 기준

| Stage | required item 예시 |
|-------|--------------------|
| 1 | domain/page contract, API/Entity/App/Logic 구현 대상, scope/authorization invariant |
| 2 | Prisma model, common schema, Entity, DTO, Query DTO, seed/reference data, backend unit test |
| 3 | Repository, Service, ApplicationService, Facade/Integration, Controller, Module, Swagger/Orval readiness |
| 4 | route `page.spec.md`, fe-ui Page/Feature owner spec, route/page mapping, test contract, `spec-checklist.md` Spec exists |
| 5 | display/control/cell/columns/widget/layout/feature/form/detail/data-grid implementation, owner spec sync, frontend unit test |
| 6 | route layout/page, pure page, thin container, Orval hook integration, state wiring, `spec-checklist.md` Code paired |
| 7 | BE/FE E2E implementation, E2E execution, failed-case re-entry, `spec-checklist.md` Verified |

#### 5.8.6 완료 금지 조건

아래 중 하나라도 있으면 Stage 완료 메시지를 출력하지 않습니다.

- 현재 Stage의 `required=true` item이 `planned`, `assigned`, `implemented`에 남아 있음
- `expected_files`가 없거나 export/hook/route 연결이 끊겨 있음
- 검증 명령이 실패했는데 affected item이 `blocked` 또는 follow-up으로 분류되지 않음
- child agent가 `Feedback: none`을 보고했지만 ledger item 검증이 끝나지 않음
- backend/API/Orval이 필요한 화면이 mock/scaffold로만 구현되어 있음

