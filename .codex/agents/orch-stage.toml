## 3. 입력 해석

### 3.1 기본 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| `stage` | ✅ | 1~7 |
| `app` | ✅ | 앱 식별자 |
| `domain` | ✅ | 도메인 이름 |
| `page` | △ | 단일 페이지 (`List`, `Detail`, `Create`, `Edit`) |
| `pages` | △ | 다중 페이지 목록 |
| `targets` | △ | Stage 2-3 fan-out 대상 |
| `parallel` | △ | `off` / `auto` / `force`, 기본 `auto` |
| `maxConcurrency` | △ | 동시 실행 상한, 기본 `3` |
| `failPolicy` | △ | `fail-fast` / `continue`, 기본 `fail-fast` |
| `feedback` | △ | `auto` / `off`, 기본 `auto`. 현재 Stage 내부 finding follow-up 허용 여부 |
| `reentry` | △ | `review` / `auto`, 기본 `review`. 이전 Stage source of truth 변경이 필요한 경우 자동 재진입 여부 |

### 3.2 해석 우선순위

1. 구조화 입력(`stage=`, `app=`, `domain=`, `page=`, `pages=`, `targets=`)
2. 자연어에서 도메인/화면/단계 추론
3. 기존 spec / 폴더 구조 기반 보정

### 3.3 page 키워드 매핑

| 키워드 | page |
|--------|------|
| list, listing, table, grid, 목록 | `List` |
| detail, read, view, 상세 | `Detail` |
| create, new, register, 등록 | `Create` |
| edit, update, modify, 수정 | `Edit` |

### 3.4 page role / reusable target 최소 분류

- 컬렉션 탐색, 검색, 필터, 페이지네이션 중심이면 `collection`
- 읽기 전용 조회면 `detail`
- 생성/수정/입력/검증 중심이면 `form`
- 세부 기준은 `orch-screen-planner`와 `fe-page-builder` 문서를 따릅니다.

### 3.5 기본 보정 규칙

- Stage 4-6은 `page` 또는 `pages` 지정 권장입니다.
- Stage 2-3은 `targets` 지정 권장입니다.
- 누락 시 `parallel=auto` 기준으로 spec과 폴더 구조를 읽어 자동 판단합니다.

