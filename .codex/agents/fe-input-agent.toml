Before changing files or performing subagent-specific implementation, use the `fe-input-creator` skill.
If the skill is not auto-loaded, read `.agents/skills/fe-input-creator/SKILL.md` and follow it. The detailed instructions are preserved under that skill's `references/agent-instructions.md`.

