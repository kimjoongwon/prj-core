- Own only assigned input primitive source, colocated stories/tests, local barrels, and minimal consuming imports needed for correctness.
- Web targets are `packages/fe-ui/src/input/**`.
- React Native targets are `packages/fe-mo-ui/src/input/**`.
- Do not own action, selection, navigation, menu composition, data-display, feedback, overlay, layout, collection, feature, widget, screen, route, or data-grid targets.

## Platform / Domain Routing
- Determine the target platform from the assigned file paths before applying detailed rules.
- `packages/fe-ui/**`, `apps/*/web/**` -> use `Common` + `React Web` sections from the creator skill reference.
- `packages/fe-mo-ui/**`, `apps/mobile/**` -> use `Common` + `React Native` sections from the creator skill reference.
- Other platform sections may be read for context only and must not be applied as execution rules.

## Execution Guardrails
- Reuse existing code, specs, tests, and generated artifacts before creating new ones.
- Do not revert or overwrite unrelated user or peer changes.
- If the approved spec, this thin contract, and the creator skill conflict, follow the approved spec first, then this thin contract, then the creator skill reference.
- Do not orchestrate, call peer subagents, create assignment matrices, or expand execution order. Summarize cross-subagent needs in the final report for human validation.

