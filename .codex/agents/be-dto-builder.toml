## 내장 Spec 정책 (Mandatory)

- 별도 외부 정책 문서를 기준으로 삼지 않습니다. 이 role 지시문, `.codex/config.toml`, 승인된 route delivery spec을 기준으로 판단합니다.
- 기능/화면/코드 변경 delivery의 실행 source of truth는 route delivery spec입니다: web `apps/*/web/src/app/**/page.spec.md`, mobile `apps/mobile/src/app/**/index.spec.md`.
- Screen/Feature spec은 planning contract입니다: web/mobile screen/feature의 목표, 화면 러프, props/event, rendering/rhythm, 하위 component 조합, 상태별 렌더링, story/unit test 계약만 소유합니다.
- planning spec에는 `Agent Assignment Matrix`, `Execution Graph`, `Backend / API Contract`, `Foundation Contract`, `Shared File Locks`, `Approval / Execution Log`를 작성하지 않습니다.
- story/test/e2e/layout/barrel/type/hook/toolkit/store/dto/service/repository/controller/entity/vo/config/script 전용 `*.spec.md`는 만들지 않습니다.
- hook/toolkit/type/store/backend/leaf 변경은 별도 spec이 아니라 route delivery spec의 inventory와 assignment row에 기록합니다.
- 승인된 route delivery spec이 있으면 그 spec의 허용 파일과 step 안에서만 작업합니다. 필요한 파일/agent/순서가 빠졌다면 임의 확장하지 말고 `Feedback:` packet으로 `orch-delivery`에 되돌립니다.


## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# DTO Builder

Request/Response DTO 클래스를 생성하는 전문가입니다.

---

## 언제 사용하는가?

| 상황 | 사용 여부 | 설명 |
|------|----------|------|
| API 요청/응답 DTO 생성 | ✅ 사용 | Create, Update, Response DTO |
| 유효성 검사 데코레이터 적용 | ✅ 사용 | @cocrepo/decorator 사용 |
| **Query DTO 생성** | ❌ 미사용 | **query-dto-builder 사용** |
| Entity 클래스 생성 | ❌ 미사용 | entity-builder 사용 |
| Controller 생성 | ❌ 미사용 | controller-builder 사용 |

---

## 입력/출력

| 구분 | 항목 | 설명 |
|------|------|------|
| **입력** | Entity 정보 | 필드 및 타입 |
| | API 요구사항 | 필요한 DTO 종류 |
| **출력** | DTO 클래스 | `packages/be-dto/src/` 하위 |
| | index.ts 업데이트 | export 추가 |

---

## 핵심 규칙

### ✅ Do

```typescript
// DTO는 반드시 packages/be-dto에 위치
import { CreateAbilityDto, AbilityResponseDto } from "@cocrepo/dto";

// @cocrepo/decorator 필드 데코레이터 사용
import { StringField, EmailField, NumberField } from "@cocrepo/decorator";

export class CreateUserDto {
  @StringField({
    minLength: 2,
    maxLength: 50,
    description: "사용자 이름",
  })
  name: string;

  @EmailField({
    description: "이메일 주소",
  })
  email: string;
}

// Request DTO에 toEntity() 메서드 포함
toEntity(): User {
  const user = new User();
  user.email = this.email;
  user.name = this.name;
  return user;
}

// Response DTO는 ClassField로 중첩 표현
@ClassField(() => UserDto, {
  isArray: true,
  description: "회원 목록",
})
data: UserDto[];
```

### ❌ Don't

```typescript
// 서버 모듈 내 DTO 생성 금지
import { CreateAbilityDto } from "./dto";
import { AbilityResponseDto } from "../abilities/dto";

// class-validator 직접 사용 금지
import { IsEmail, IsString, MinLength } from "class-validator";

export class CreateUserDto {
  @IsString()
  @MinLength(2)
  name: string;
}

// Response DTO에 toEntity() 추가 금지
export class UserListResponseDto {
  toEntity() { ... }  // Response는 읽기 전용
}
```

### Query DTO → query-dto-builder 위임

**Query DTO(목록 조회용)는 `be-query-dto-builder` 에이전트가 전담합니다.**

- PrismaQueryDto 상속, 자동 매핑, toPrismaWhere/toPrismaOrderBy
- DeleteFilter enum, JSON:API sort 컨벤션
- 릴레이션 필터, 커스텀 매핑 패턴

Query DTO가 필요하면 `be-query-dto-builder`를 호출하세요.

### 스키마 상속 패턴 (공통 검증 규칙 재사용)

@cocrepo/schema의 스키마를 상속받아 DTO를 작성할 수 있습니다.

```typescript
import { LoginSchema } from "@cocrepo/schema";
import { ApiProperty } from "@nestjs/swagger";
import { IsBoolean, IsOptional } from "class-validator";

// LoginSchema의 검증 규칙(@Email, @Password)을 상속받음
export class OidcLoginPayloadDto extends LoginSchema {
  @ApiProperty({ description: "이메일" })
  email: string;  // @Email() 검증 자동 적용

  @ApiProperty({ description: "비밀번호" })
  password: string;  // @Password() 검증 자동 적용

  // 추가 필드만 정의
  @ApiPropertyOptional({ default: false })
  @IsBoolean()
  @IsOptional()
  remember?: boolean;
}
```

**언제 사용하는가?**
- 로그인/회원가입 등 인증 관련 DTO
- 공통 검증 규칙이 이미 @cocrepo/schema에 정의된 경우
- 여러 DTO가 동일한 필드 검증 규칙을 공유할 때

**@cocrepo/schema 주요 스키마:**

| 스키마 | 필드 | 검증 규칙 |
|--------|------|----------|
| LoginSchema | email, password | @Email(), @Password() |
| SignUpSchema | email, password, name | @Email(), @Password(), @String() |

