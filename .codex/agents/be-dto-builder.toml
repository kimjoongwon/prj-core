## 템플릿

### Create DTO

```typescript
import {
  StringField,
  EmailField,
  PhoneField,
  UUIDField,
  UUIDFieldOptional,
} from "@cocrepo/decorator";
import { {Entity} } from "@cocrepo/entity";

/**
 * {Entity} 생성 DTO
 */
export class Create{Entity}Dto {
  @StringField({
    minLength: 2,
    maxLength: 50,
    description: "이름",
  })
  name: string;

  @EmailField({
    description: "이메일 주소",
  })
  email: string;

  @UUIDField({
    description: "역할 ID",
  })
  roleId: string;

  @UUIDFieldOptional({
    description: "카테고리 ID",
  })
  categoryId?: string;

  /**
   * DTO → Entity 변환
   */
  toEntity(): {Entity} {
    const entity = new {Entity}();
    entity.name = this.name;
    entity.email = this.email;
    return entity;
  }
}
```

### Update DTO

```typescript
import {
  StringFieldOptional,
  EmailFieldOptional,
  UUIDFieldOptional,
} from "@cocrepo/decorator";

/**
 * {Entity} 수정 DTO
 */
export class Update{Entity}Dto {
  @StringFieldOptional({
    minLength: 2,
    maxLength: 50,
    description: "이름",
  })
  name?: string;

  @EmailFieldOptional({
    description: "이메일 주소",
  })
  email?: string;

  @UUIDFieldOptional({
    description: "카테고리 ID",
  })
  categoryId?: string;
}
```

### Response DTO (목록)

```typescript
import { ClassField, NumberField } from "@cocrepo/decorator";
import { {Entity}Dto } from "../{entity}.dto";

/**
 * 페이지네이션 메타 정보
 */
export class {Entity}PaginationMetaDto {
  @NumberField({ description: "전체 개수" })
  total: number;

  @NumberField({ description: "건너뛴 항목 수 (offset)" })
  skip: number;

  @NumberField({ description: "조회 항목 수" })
  take: number;

  @NumberField({ description: "전체 페이지 수" })
  totalPages: number;
}

/**
 * 통계 정보 (필요시)
 */
export class {Entity}StatsDto {
  @NumberField({ description: "전체 수" })
  total: number;

  @NumberField({ description: "활성 수" })
  active: number;

  @NumberField({ description: "비활성 수" })
  inactive: number;
}

/**
 * {Entity} 목록 응답 DTO
 */
export class {Entity}ListResponseDto {
  @ClassField(() => {Entity}Dto, {
    isArray: true,
    description: "{Entity} 목록",
  })
  data: {Entity}Dto[];

  @ClassField(() => {Entity}PaginationMetaDto, {
    description: "페이지네이션 메타 정보",
  })
  meta: {Entity}PaginationMetaDto;

  @ClassField(() => {Entity}StatsDto, {
    description: "통계 정보",
  })
  stats: {Entity}StatsDto;
}
```

### Response DTO (상세)

```typescript
import {
  StringField,
  EmailField,
  DateField,
  ClassField,
  UUIDField,
} from "@cocrepo/decorator";

/**
 * {Entity} 상세 응답 DTO
 */
export class {Entity}DetailResponseDto {
  @UUIDField({ description: "ID" })
  id: string;

  @StringField({ description: "이름" })
  name: string;

  @EmailField({ description: "이메일" })
  email: string;

  @DateField({ description: "생성일" })
  createdAt: Date;

  @ClassField(() => RoleDto, {
    description: "역할 정보",
  })
  role: RoleDto;

  @ClassField(() => GroupDto, {
    isArray: true,
    description: "그룹 목록",
  })
  groups: GroupDto[];
}
```

