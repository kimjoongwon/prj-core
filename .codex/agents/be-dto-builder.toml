## 프로젝트별 참고사항

### 필드 데코레이터 종류

#### Primitives (기본 타입)

| 데코레이터 | 타입 | 옵션 |
|------------|------|------|
| `StringField` | string | minLength, maxLength, pattern |
| `NumberField` | number | minimum, maximum, int |
| `BooleanField` | boolean | - |
| `DateField` | Date | nullable |

#### Specialized (특수 타입)

| 데코레이터 | 타입 | 설명 |
|------------|------|------|
| `EmailField` | string | 이메일 형식 검증 |
| `PasswordField` | string | 비밀번호 규칙 검증 |
| `PhoneField` | string | 한국 휴대폰 형식 |
| `UUIDField` | string | UUID 형식 |
| `UrlField` | string | URL 형식 |

#### Complex (복합 타입)

| 데코레이터 | 타입 | 설명 |
|------------|------|------|
| `ClassField` | class | 중첩 객체, 배열 |
| `EnumField` | enum | 열거형 값 |

#### Optional 버전

모든 데코레이터는 `{Decorator}Optional` 버전 제공:

```typescript
@StringFieldOptional({ description: "닉네임 (선택)" })
nickname?: string;

@UUIDFieldOptional({ description: "카테고리 ID" })
categoryId?: string;
```

### 파일 위치

```
packages/be-dto/src/
├── create/                    # 생성 DTO
│   └── create-{entity}.dto.ts
├── update/                    # 수정 DTO
│   └── update-{entity}.dto.ts
├── query/                     # 조회 DTO (→ query-dto-builder 전담)
│   └── query-{entity}.dto.ts
├── {domain}/                  # 도메인별 DTO
│   ├── {domain}-list-response.dto.ts
│   ├── {domain}-detail-response.dto.ts
│   └── query-{domain}s.dto.ts  # (→ query-dto-builder 전담)
└── index.ts
```

### 배열 필드 처리

```typescript
// 배열 필드는 Transform 데코레이터로 변환 처리
@StringFieldOptional({
  each: true,
  description: "그룹 ID 목록",
})
@Transform(({ value }) =>
  Array.isArray(value) ? value : value ? [value] : [],
)
groupIds?: string[];
```

### index.ts 등록

```typescript
// packages/be-dto/src/index.ts (최상위)
export * from "./{domain}";

// packages/be-dto/src/{domain}/index.ts (도메인별)
export * from "./{domain}-list-response.dto";
export * from "./{domain}-detail-response.dto";
export * from "./query-{domain}s.dto";
```

### 관련 파일

- 필드 데코레이터: `packages/be-decorator/src/field/`
- 기본 DTO: `packages/be-dto/src/abstract.dto.ts`
- Entity: `packages/be-entity/src/`
- Query DTO 관련: `be-query-dto-builder` 에이전트 참조

## Feedback Packet (Mandatory)

이 role이 `orch-delivery`의 실행 agent로 동작하거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_phase: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-contract | needs-implementation | needs-test | needs-reentry
- feedback_type: none | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_phase: planning | approval | backend | codegen | web | mobile | qa | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

