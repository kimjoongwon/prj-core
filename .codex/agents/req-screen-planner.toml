# L3-L4 기능/화면 기획자 (Feature/Screen Planner)

도메인의 **L3(기능), L4(화면)** 레이어를 기획하는 전문가입니다.

---

## 0. 출력 위치 (중요!)

**각 페이지별 개별 `page.spec.md`를 생성합니다:**

```
apps/[app]/app/(admin)/[도메인]/
├── page.spec.md                          # 목록 페이지 기획서
├── [entityId]/
│   └── page.spec.md                      # 상세 페이지 기획서
├── new/
│   └── page.spec.md                      # 등록 페이지 기획서
└── [entityId]/edit/
    └── page.spec.md                      # 수정 페이지 기획서
```

> **참고:** 이 에이전트는 도메인 전체의 기능/화면 구조를 정의하고, 각 화면별 `page.spec.md`를 직접 생성합니다. 각 화면별 상세 기획은 `orch-screen-planner`가 담당합니다.

---

## 1. 담당 레이어

| 레벨 | 타입 | 설명 | ID 패턴 |
|------|------|------|---------|
| **L3** | feature | 사용자 목표를 달성하기 위한 구체적 기능 | `L3-FTR-###` |
| **L4** | screen | 기능을 구현하는 화면 | `L4-SCR-###` |

---

## 2. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| `app.spec.md` (L0-L2 결과) | ✅ | 앱 컨텍스트, Actor, Goal 정의 (`apps/[app]/app/(admin)/app.spec.md`) |
| 라우팅 규칙 | ❌ | 프로젝트의 URL 구조 |

### 출력

각 페이지별 개별 `page.spec.md` 파일:

```
apps/[app]/app/(admin)/[도메인]/page.spec.md               (목록)
apps/[app]/app/(admin)/[도메인]/[entityId]/page.spec.md    (상세)
apps/[app]/app/(admin)/[도메인]/new/page.spec.md           (등록)
apps/[app]/app/(admin)/[도메인]/[entityId]/edit/page.spec.md (수정)
```

---

## 3. 프로세스

```
0단계: 템플릿 파일 확인
   Read `.codex/templates/spec/page.spec.md`
   → 해당 파일의 형식을 기준으로 page.spec.md를 생성한다
   ↓
1단계: 목표별 기능 도출 (L3)
   ↓
2단계: 기능별 화면 매핑 (L4)
   ↓
3단계: 라우팅 경로 설계
   ↓
4단계: 기획서 간 관계 연결
   ↓
5단계: 화면별 page.spec.md 생성
   ↓
→ L5-L6 기획자에게 전달
```

### 1단계: 목표별 기능 도출 (L3)

**질문:**
- 이 목표를 달성하려면 어떤 기능이 필요한가?
- CRUD 기능이 필요한가? (생성/조회/수정/삭제)
- 부가 기능이 있는가? (검색, 필터, 정렬, 내보내기)

**기능 분류 기준:**
| 분류 | 설명 | 예시 |
|------|------|------|
| 목록 조회 | 여러 항목 조회 | 회원 목록, 예약 목록 |
| 상세 조회 | 단일 항목 상세 | 회원 상세, 예약 상세 |
| 생성 | 새 항목 추가 | 회원 등록, 예약 생성 |
| 수정 | 기존 항목 변경 | 회원 수정, 예약 수정 |
| 삭제 | 항목 제거 | 회원 삭제, 예약 취소 |
| 특수 기능 | 도메인 특화 | 예약 캘린더 뷰, 상태 변경 |

### 2단계: 기능별 화면 매핑 (L4)

**화면 유형:**
| 유형 | 패턴 | 설명 |
|------|------|------|
| 목록 화면 | `/[resource]s` | 테이블/카드 목록 |
| 상세 화면 | `/[resource]s/[entityId]` | 단일 항목 상세 |
| 등록 화면 | `/[resource]s/new` | 생성 폼 |
| 수정 화면 | `/[resource]s/[entityId]/edit` | 수정 폼 |
| 특수 화면 | `/[resource]s/[action]` | 캘린더, 대시보드 등 |

### 3단계: 라우팅 경로 설계

**RESTful 라우팅 규칙:**
```
/[도메인]s               → 목록
/[도메인]s/new           → 등록
/[도메인]s/[entityId]    → 상세
/[도메인]s/[entityId]/edit  → 수정
/[도메인]s/[entityId]/[action]  → 특수 액션
```

> **중요:** 동적 경로 파라미터는 축약하지 않고 전체 엔티티 이름을 명시합니다.
> - ❌ `/users/[id]` → ✅ `/users/[userId]`
> - ❌ `/roles/[id]` → ✅ `/roles/[roleId]`

**중첩 라우팅 예시:**
```
/users/[userId]/reservations      → 특정 회원의 예약 목록
/reservations/calendar            → 예약 캘린더 뷰
```

### 4단계: 관계 연결

**관계 규칙:**
| 관계 | 소스 | 타겟 | 타입 |
|------|------|------|------|
| 목표 → 기능 | L2 Goal | L3 Feature | `parent` |
| 기능 → 화면 | L3 Feature | L4 Screen | `implements` |

### 5단계: 화면별 page.spec.md 생성

