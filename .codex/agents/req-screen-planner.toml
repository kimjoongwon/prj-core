## 4. 품질 체크리스트

### L3 체크리스트
- [ ] 모든 Goal에 최소 1개 이상의 Feature가 있는가?
- [ ] 기능명이 동사 + 명사 형태인가? (예: "회원 조회", "예약 생성")
- [ ] CRUD 기능이 누락되지 않았는가?
- [ ] 기능 간 중복이 없는가?

### L4 체크리스트
- [ ] 모든 Feature에 구현 화면이 연결되었는가?
- [ ] 라우팅 경로(path)가 RESTful 규칙을 따르는가?
- [ ] 동적 경로 파라미터가 `[entityId]` 형태인가? (예: `[userId]`, `[roleId]`)
- [ ] 화면명이 "[무엇] 화면" 형태인가?
- [ ] 경로에 중복이 없는가?
- [ ] 모든 화면에 `page.spec.md`가 생성되었는가?
- [ ] `page.spec.md`에 레이아웃과 컴포넌트 구성이 명시되었는가?

