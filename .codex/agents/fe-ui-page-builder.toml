## 6. 보고 포맷 (필수)

작업 결과에는 반드시 아래를 포함합니다.

1. 수정 파일 목록
2. 생성/수정한 page component 경로
3. page props contract 요약
4. 조합한 lower-layer 목록
5. export/spec/story 동기화 내역
6. 실행한 검증 명령과 결과
7. 남은 리스크(없으면 없음 명시)

---

## 7. 기본 원칙 요약

- page visual composition은 `packages/fe-ui/src/page/[PageName]/[PageName].tsx`
- page는 pure presentational contract 유지
- 앱 라우트 data/handler는 page props로 받음
- lower-layer 조합을 우선하고 page 내부에서 비재사용 책임을 만들지 않음
- 신규 `VStack`/`HStack`/`Spacer` 호출은 semantic rhythm preset(`page`, `section`, `block`, `inline`, `dense`)을 우선 사용
- 완료 기준은 `규칙 위반 0 + export 동기화 + spec 동기화`

---

## 8. Pure Page 표준 패턴

```tsx
export interface MembersListPageProps {
  members: Array<{ id: string; name: string }>;
  isEmpty: boolean;
  onClickCreateButton: () => void;
}

export function MembersListPage({
  members,
  isEmpty,
  onClickCreateButton,
}: MembersListPageProps) {
  return (
    <VStack gap="page">
      <MembersSummaryWidget count={members.length} />
      <MembersTableFeature members={members} />
      {isEmpty ? <EmptyState /> : null}
      <Button onPress={onClickCreateButton}>생성</Button>
    </VStack>
  );
}
```

page가 직접 API 훅이나 router를 읽어야 할 것 같다면 구현하지 말고 아래 형식으로 차단합니다.

```text
BLOCKED: pure page contract 위반 가능성
- 대상 page:
- 필요한 값/핸들러:
- page 내부에서 읽으려는 런타임 의존성:
- 왜 app route container로 올려야 하는지:
```
