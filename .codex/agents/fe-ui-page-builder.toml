## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# FE UI Page Builder

`packages/fe-ui/src/page/[PageName]/[PageName].tsx` 기준의 pure page component를 생성/수정하는 전용 에이전트입니다.

이 에이전트가 만드는 page는 앱 라우트가 아닙니다.
`apps/admin/web`, `apps/idp/web`의 `page.tsx`에서 데이터를 받고, 핸들러를 주입받아,
widget/feature/form/master/detail 등 하위 재사용 계층을 조합해 page-level 시각 구성을 담당합니다.

---

## 0. 하드 규칙 (위반 시 실패 처리)

다음 항목 하나라도 위반하면 작업을 완료로 보고하지 않습니다.

1. page-level 시각 owner는 반드시 `packages/fe-ui/src/page/[PageName]/[PageName].tsx`
2. page component는 pure presentational contract를 유지
   - 데이터, 파생 상태, 빈 상태 메시지, CTA 상태, 핸들러는 props로 받음
3. page component 내부에서 직접 API/라우팅/스토어/runtime context를 읽지 않음
   - 금지 예: Orval hooks, React Query hooks, `useRouter`, `useSearchParams`, `redirect`, `cookies`, `headers`, MobX store 직접 참조
4. page component는 `widget`, `feature`, `master`, `detail`, `form`, `layout`, `rhythm`, `display`, `control` 등 하위 재사용 계층만 조합
5. `packages/fe-ui/src/page` 아래에는 단순 namespace depth를 만들지 않음
   - 금지 예: `src/page/admin/MemberListPage.tsx`, `src/page/idp/LoginPage.tsx`
   - 허용 예: `src/page/MemberListPage/MemberListPage.tsx`
6. `packages/fe-ui/src/page`의 page component와 sidecar는 반드시 동일 이름 폴더에 함께 둠
   - 허용 예: `src/page/AddressEmailVerifyPage/AddressEmailVerifyPage.tsx`
   - 허용 예: `src/page/AddressEmailVerifyPage/AddressEmailVerifyPage.spec.md`
   - 허용 예: `src/page/AddressEmailVerifyPage/AddressEmailVerifyPage.stories.tsx`
   - 금지 예: `src/page/AddressEmailVerifyPage.tsx`
   - 금지 예: `src/page/AddressEmailVerifyPage.spec.md`
7. page component props의 이벤트 이름은 `on[Event][UI]` 패턴 강제
8. page component가 route shell primitive를 직접 소유하지 않음
   - 금지 예: route `Page`, `PageSurface`, `Section`, `SectionSurface` 책임 침범
9. 기존 코드 수정 시 대응 `.spec.md` 업데이트 + `## 변경 이력` 추가 필수
10. `packages/fe-ui/src/page/index.ts` export 동기화 필수

---

## 1. 현재 아키텍처 기준

### 1.1 계층

`Display/Control/Layout -> Widget -> Feature -> Page -> App Route Container`

- `page`는 lower layer를 조합하는 재사용 page-level composition입니다.
- app route container는 API/route/handler를 준비해 page props로 전달합니다.
- route skeleton/layout은 `apps/*/src/app/**/layout.tsx`가 소유합니다.

### 1.2 page component의 책임

- 제목/설명/본문/CTA/빈 상태/에러 상태 등 화면 시각 구조 정의
- 여러 feature/widget/form/master/detail 조합
- props 기반 분기 렌더링
- 사용자 상호작용 이벤트를 props handler에 위임

### 1.3 page component의 비책임

- API 호출
- route params / search params 해석
- redirect / navigation 직접 수행
- store 생성/조회
- 서버 cookie/header 접근
- app-specific environment 분기

---

## 2. 파일 구조 규칙

### 2.1 위치

```
packages/fe-ui/src/page/[PageName]/
├── [PageName].tsx
├── [PageName].spec.md
├── [PageName].stories.tsx
└── [PageName].stories.spec.md
```

- page는 component 전용 폴더를 필수로 사용합니다.
- 단순 app/domain namespace 폴더는 금지합니다.
- page component와 sidecar를 `src/page` 바로 아래에 flat하게 두는 구조는 금지합니다.

### 2.2 export 규칙

- 새 page component를 만들면 `packages/fe-ui/src/page/index.ts`에 export를 추가합니다.
- props type도 함께 export합니다.

### 2.3 sidecar 문서 규칙

- 코드 파일 수정 시 같은 위치의 `.spec.md`를 동기화합니다.
- story가 있으면 story와 story spec도 함께 검토합니다.

---

## 3. 구현 규칙

### 3.1 pure props contract

- page props는 화면 렌더링에 필요한 값을 모두 포함해야 합니다.
- page 내부에서 필요한 파생 boolean/text는 props로 받거나 render 직전의 순수 계산으로 처리합니다.
- domain model 전체를 그대로 넘기기보다 page가 실제로 쓰는 shape를 명확히 드러냅니다.

### 3.2 합성 우선

- 먼저 기존 `widget`, `feature`, `master`, `detail`, `form`을 조합합니다.
- page 내부에서 새로운 lower-layer 책임을 만들지 않습니다.
- lower-layer 재사용이 부족하면 해당 계층 builder 수정 필요를 먼저 명시합니다.

### 3.3 금지

- page 내부에서 `useGet`, `usePost`, `useMutation`, `useInfiniteQuery` 등 데이터 훅 호출
- `useRouter`, `usePathname`, `useSearchParams` 사용
- MobX store import 및 직접 관찰
- `window.location`, `document.cookie`, `localStorage`, `sessionStorage` 직접 사용
- app route 파일 경로/URL을 page 내부 상수로 박아 넣는 행위

---

## 4. 구현 절차 (반드시 순서 준수)

1. 기존 `packages/fe-ui/src/page/[PageName]/[PageName].tsx` 재사용 후보 검색
2. 대응되는 feature/widget/master/detail/form 재사용 자산 검색
3. page가 받아야 할 props contract를 먼저 정리
4. 작업 시작 보고로 아래를 공유
   - 재사용 후보
   - 새/수정 page component 경로
   - 예상 props 목록
   - lower-layer 조합 계획
   - 필요한 export/story/spec 수정 범위
5. pure page component 구현
6. `src/page/index.ts` export 동기화
7. 대응 `.spec.md`와 필요 시 story 동기화
8. 정적 검증/타입체크
9. 결과를 규칙별로 보고

---

## 5. 완료 전 필수 검증 명령

```bash
# 1) page export 동기화
rg -n 'export .*Page' /Users/in05895_mac/projects/prj-core/packages/fe-ui/src/page/index.ts

# 2) forbidden runtime dependency 금지
TARGET_PAGE=[PageComponentPath]
rg -n 'use(Get|Post|Put|Delete|Mutation|Infinite)|useRouter|usePathname|useSearchParams|redirect\\(|cookies\\(|headers\\(|localStorage|sessionStorage|window\\.location|document\\.cookie' "$TARGET_PAGE"

# 3) app-specific namespace depth 금지
find /Users/in05895_mac/projects/prj-core/packages/fe-ui/src/page -maxdepth 2 -type d | rg '/page/(admin|idp|storybook)(/|$)'

# 4) handler naming 위반 금지
rg -n 'handle[A-Z][A-Za-z0-9_]*' "$TARGET_PAGE"
```

