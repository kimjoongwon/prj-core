## 7. 연관 에이전트

### 컴포넌트 계층 구조

```
Pure UI → Widget → Feature → Page
(최소 단위)   (UI 조합)   (비즈니스 로직)   (화면)
```

### 선행 에이전트

| 에이전트 | 관계 |
|----------|------|
| req-widget-planner | route `page.spec.md` 또는 관련 fe-ui Page/Feature spec의 Widget Contract 섹션 기반 구현 |
| **fe-display-component-builder** | Widget이 사용할 Display UI 컴포넌트 생성 |
| fe-control-component-builder | Widget에서 사용할 Control 컴포넌트 생성 |

### 후행 에이전트

| 에이전트 | 관계 |
|----------|------|
| **fe-feature-builder** | Widget에 Store/API 연결하여 Feature 생성 |
| fe-page-builder | Feature와 함께 Page에서 활용 |

### 관련 에이전트

| 에이전트 | 관계 |
|----------|------|
| fe-store-builder | Feature에서 Widget에 주입할 Store 생성 |

