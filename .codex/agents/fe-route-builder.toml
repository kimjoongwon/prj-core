## 7. 보고 포맷 (필수)

작업 결과에는 반드시 아래를 포함합니다.

1. 수정 파일 목록
2. 연결한 `packages/fe-ui/src/screen/[ScreenName]/[ScreenName].tsx` screen component 경로
3. Route / Screen Mapping 반영 내역
   - `page role`
   - `reusable target`
   - `screen component path`
   - `SSR/prefetch 예외 승인 여부`
4. 규칙별 위반 해결 내역
5. 실행한 검증 명령과 결과
6. 남은 리스크(없으면 없음 명시)

