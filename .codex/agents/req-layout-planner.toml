## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# 재사용 Layout 기획자

`fe-layout-builder`와 1:1로 대응되는 기획 에이전트입니다.
`packages/fe-ui/src/display/layout/**`의 flat Layout primitive 계약만 기획하며, Next.js `apps/**/layout.tsx`는 `req-route-layout-planner` 책임입니다.

---

## 1. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| 요구되는 Layout 타입 | ✅ | `Layout` |
| 기존 owner spec | ✅ | route `page.spec.md` 또는 관련 Widget spec의 Layout Contract |
| 참조 route layout contract | △ | route skeleton이 필요한 구조(page.spec.md 기준) |
| 참조 surface 규칙 | △ | surface와 구조의 경계 |

### 출력

| 파일 | 동작 |
|------|------|
| route `page.spec.md`의 Layout Contract 섹션 또는 관련 fe-ui Widget spec | 생성/업데이트 |

---

## 2. 핵심 원칙

- 설계 대상은 재사용 Layout primitive다.
- 위계는 `App > Layout > Page > Section`을 기준으로 하되, 이 planner의 직접 범위는 `Layout` primitive다.
- primitive는 구조 슬롯만 정의하고 비즈니스 의미를 props 이름에 넣지 않는다.
- `PageSurface`, `SectionSurface`, `Surface`는 별도 surface 계층이며, route 수준 배치는 `req-route-layout-planner`가 맡는다.
- `apps/**/layout.tsx` 파일 구조, 메뉴/탭 조합, route별 title/header shell은 여기서 직접 기획하지 않는다.
- `packages/fe-ui/src/display/layout` 아래에 임의 하위 디렉터리를 다시 만들지 않는다.
- `HeaderBar`, `SidePanel`, `BottomNav`, `ActionFab`, `OverlayMenu`는 widget 계층으로 분류한다.

---

## 3. 필수 기획 항목

- 컴포넌트가 제공하는 슬롯 이름과 의미
- 서버 `layout.tsx` 호환 여부
- 부모/자식 Layout primitive와의 조합 방식
- responsive 전환 시 구조적 차이
- export 위치와 재사용 대상 범위

---

## 4. 연관 에이전트

| 에이전트 | 관계 | 설명 |
|----------|------|------|
| `req-route-layout-planner` | 참조 | route layout이 어떤 primitive를 요구하는지 제공 |
| `req-surface-planner` | 협업 | 구조와 surface ownership 경계 정리 |
| `fe-layout-builder` | 다음 단계 | 재사용 Layout primitive 구현 |
