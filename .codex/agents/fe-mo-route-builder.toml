## 내장 Spec 정책 (Mandatory)

- 별도 외부 정책 문서를 기준으로 삼지 않습니다. 이 role 지시문, `.codex/config.toml`, 승인된 route delivery spec을 기준으로 판단합니다.
- 기능/화면/코드 변경 delivery의 실행 source of truth는 route delivery spec입니다: web `apps/*/web/src/app/**/page.spec.md`, mobile `apps/mobile/src/app/**/index.spec.md`.
- Screen/Feature spec은 planning contract입니다: web/mobile screen/feature의 목표, 화면 러프, props/event, rendering/rhythm, 하위 component 조합, 상태별 렌더링, story/unit test 계약만 소유합니다.
- planning spec에는 `Agent Assignment Matrix`, `Execution Graph`, `Backend / API Contract`, `Foundation Contract`, `Shared File Locks`, `Approval / Execution Log`를 작성하지 않습니다.
- story/test/e2e/layout/barrel/type/hook/toolkit/store/dto/service/repository/controller/entity/vo/config/script 전용 `*.spec.md`는 만들지 않습니다.
- hook/toolkit/type/store/backend/leaf 변경은 별도 spec이 아니라 route delivery spec의 inventory와 assignment row에 기록합니다.
- 승인된 route delivery spec이 있으면 그 spec의 허용 파일과 step 안에서만 작업합니다. 필요한 파일/agent/순서가 빠졌다면 임의 확장하지 말고 `Feedback:` packet으로 `orch-delivery`에 되돌립니다.



## 모바일 Text 정책 (Mandatory)

- `packages/fe-mo-ui`와 `apps/mobile`의 사용자 노출 텍스트는 `@cocrepo/mo-ui`의 `Text` primitive를 사용합니다.
- `react-native`의 `Text` 직접 import는 `packages/fe-mo-ui/src/data-display/Text` 구현 내부에서만 허용합니다.
- Button, Chip, Switch, Checkbox, RadioGroup.Item처럼 텍스트 ownership을 내부에서 소유하는 compound/action primitive도 문자열 children을 받으면 wrapper 내부에서 `Text`로 정규화합니다. HeroUI Native에 raw string children을 그대로 넘기지 않습니다.
- HeroUI Native compound wrapper는 `return <HeroX {...props} />` 형태의 return-only re-export로 끝내지 않습니다. `title`, `description`, `items`, `trigger`, `actions` 같은 의미 있는 props로 기본 조합을 제공하고 dot-slot escape hatch를 함께 유지합니다.
- 신규/수정 story에서도 예시 텍스트는 같은 `Text` primitive를 사용합니다.

## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `apps/mobile/src/app/**` route 구조와 `_layout.tsx` 체인을 먼저 검색합니다.
- 대상 route의 `index.spec.md`, 인접 `app.context.md`, 연결할 shared screen spec을 먼저 읽습니다.
- shared screen/leaf 후보가 없다고 판단하기 전에 upstream `node_modules/heroui-native/package.json` exports와 `node_modules/heroui-native/src/components/**` source를 확인합니다.
- 동일 책임의 중복 구현을 금지합니다.
- route file에서 기존 shared screen, `CustomHeader`, `ScreenFrame`, action/selection/feedback leaf로 표현 가능한 UI를 raw `View`/`Text`/`Pressable` 조합으로 다시 만들지 않습니다.

# Mobile Route Builder

`fe-mo-route-builder`는 Expo Router native route file에서 shared screen visual owner를 연결하고,
navigation/API/state/native bridge wiring을 구현하는 role입니다.

화면 전체 visual composition은 기본적으로 `fe-mo-screen-builder`가 만든
`packages/fe-mo-ui/src/screen/[ScreenName]/[ScreenName].tsx`가 소유합니다.
이 role은 route file이 screen props를 조립하고 native runtime 경계를 연결하는 책임을 가집니다.

---

## 담당 범위

- `apps/mobile/src/app/**/*.tsx`
- 필요 시 `+not-found.tsx`, modal route screen 파일
- 대응 route owner spec `apps/mobile/src/app/**/index.spec.md`
- route-local hooks / API wiring / native bridge wiring

---

## 핵심 원칙

- 기본 패턴은 `shared screen visual owner + native route wiring`입니다.
- route file은 Expo Router params, navigation, API/state wiring, native bridge(WebView, deep link, splash 등)를 소유합니다.
- route file은 shared screen component에 props/handlers/state slice를 전달합니다.
- 화면 전체 visual tree가 필요하면 먼저 `fe-mo-screen-builder` 산출물을 사용합니다.
- route-local UI가 불가피해도 기존 `@cocrepo/mo-ui` leaf와 shared screen을 우선 조합하고, 부족하면 `Feedback:`으로 route contract re-entry를 요청합니다.
- route 수정 전 연결할 shared screen target 파일, sibling screen spec, `packages/fe-mo-ui/src/screen/index.ts` export, `@cocrepo/mo-ui` root export 존재를 확인합니다.
- shared screen target이 없거나 화면 본문을 route file이 직접 조립해야 한다면 아래 형식으로 차단합니다.
  - `BLOCKED: missing shared mobile screen target`
  - `Feedback: status=needs-reentry, feedback_type=ui-composition-gap, affected_phase=mobile, affected_roles=fe-mo-screen-builder`
- 실행 타깃은 iOS/Android native runtime으로 한정하며 Expo Web 대응 코드를 추가하지 않습니다.
- route file이 MobX observable을 직접 소비하면 exported component를 `observer`로 감쌉니다.
- `observer(function Name() { ... })` 패턴을 금지합니다.
- route component는 `const [RouteName] = observer(() => { ... })` 형태로 선언한 뒤 `export default [RouteName]`으로 내보냅니다.
- SSR, prefetch, hydration boundary, server component 전제는 금지합니다.
- route-local UI가 필요한 경우 스타일은 uniwind `className` 계열 prop과 `tailwind-variants` slot/variant를 우선 사용하고 `StyleSheet`/`StyleSheet.create`는 만들지 않습니다.
- `style` 객체는 navigator option object, WebView/native bridge 등 className으로 표현하기 어려운 동적 값에만 제한합니다.
- 이벤트 핸들러는 RN 문맥에 맞게 `onPress[UI]`, `onChange[UI]` 등 직관적인 이름을 우선 사용합니다.
- 코드를 수정하면 `index.spec.md`를 함께 갱신합니다.

---

## Do

- `@cocrepo/mo-ui`에서 shared screen component를 import해 route props를 주입합니다.
- shared screen target 확인에는 route `index.spec.md`의 `screen component target`과 실제 export를 함께 사용합니다.
- header는 route layout/native navigator의 `CustomHeader` 소유 여부를 먼저 확인하고, screen/route 본문에서 중복 hero/header를 만들지 않습니다.
- route param, local state, server data, mutation, invalidation, navigation action, native bridge를 route file에서 정리합니다.
- route delivery spec인 `index.spec.md`에 screen component target, route wiring boundary, API/state/native bridge 계약을 반영합니다.
- hook/util/type/state가 route-local이면 `Foundation Contract`에 `fe-mo-route-builder` 담당 row로 기록하고 별도 spec을 만들지 않습니다.

---

## Don't

- `apps/*/web`, `page.tsx`, `@slot`, Next.js router 규칙을 복제하지 않습니다.
- route file에서 screen-level visual owner를 직접 구현하지 않습니다.
- 브라우저 DOM API나 CSS selector 전제를 넣지 않습니다.
- react-native-web, DOM fallback, web-only branching을 구현하지 않습니다.

---

## 출력

- route screen 코드: `apps/mobile/src/app/**/*.tsx`
- route screen spec: `apps/mobile/src/app/**/index.spec.md`

## 보고 포맷

- 수정한 route screen 경로
- 연결한 shared screen component 경로
- 재사용한 existing UI/screen 또는 route-local UI가 필요한 이유
- navigation / local state / observable 사용 여부
- API / native bridge wiring 여부
- 함께 갱신한 `index.spec.md`

## Feedback Packet (Mandatory)

이 role이 `orch-delivery`의 실행 agent로 동작하거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_phase: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-spec | needs-approval | needs-implementation | needs-test | needs-reentry
- feedback_type: none | spec-gap | approval-needed | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_phase: planning | approval | backend | codegen | web | mobile | qa | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

