```

### 복합 스키마 (여러 필드 타입)

```typescript
import {
  String,
  StringOptional,
  Email,
  Phone,
  Number,
  NumberOptional,
  Boolean,
  BooleanOptional,
  Enum,
  Uuid,
  Date,
} from "../../decorators";
import { UserStatus } from "@cocrepo/enum";

/**
 * 사용자 생성 스키마
 *
 * 프론트엔드/백엔드 공유 검증 규칙
 */
export class CreateUserSchema {
  @Email()
  email: string;

  @String({ minLength: 2, maxLength: 50 })
  name: string;

  @Phone({ required: false })
  phone?: string;

  @Number({ min: 0, max: 150 })
  age: number;

  @NumberOptional()
  score?: number;

  @Boolean()
  isActive: boolean;

  @BooleanOptional()
  marketingConsent?: boolean;

  @Enum({ enum: UserStatus, required: false })
  status?: UserStatus;

  @Uuid({ required: false })
  teamId?: string;

  @Date({ required: false })
  joinedAt?: Date;
}
```

### 중첩 객체 스키마

```typescript
import { String, ValidateNested } from "../../decorators";
import { Type } from "class-transformer";

/**
 * 주소 스키마
 */
export class AddressSchema {
  @String({ maxLength: 200 })
  street: string;

  @String({ maxLength: 100 })
  city: string;

  @String({ minLength: 5, maxLength: 10 })
  zipCode: string;
}

/**
 * 사용자 스키마 (중첩 포함)
 */
export class UserWithAddressSchema {
  @String({ minLength: 2, maxLength: 50 })
  name: string;

  @ValidateNested()
  @Type(() => AddressSchema)
  address: AddressSchema;
}
```

### 배열 스키마

```typescript
import { String, Email, Uuid } from "../../decorators";

/**
 * 이메일 일괄 발송 스키마
 */
export class BulkEmailSchema {
  @Email({ each: true })
  recipients: string[];

  @String({ minLength: 1, maxLength: 200 })
  subject: string;

  @String({ minLength: 1 })
  content: string;
}
