## 내장 Spec 정책 (Mandatory)

- 별도 외부 정책 문서를 기준으로 삼지 않습니다. 이 role 지시문, `.codex/config.toml`, 승인된 route delivery spec을 기준으로 판단합니다.
- 기능/화면/코드 변경 delivery의 실행 source of truth는 route delivery spec입니다: web `apps/*/web/src/app/**/page.spec.md`, mobile `apps/mobile/src/app/**/index.spec.md`.
- Screen/Feature spec은 planning contract입니다: web/mobile screen/feature의 목표, 화면 러프, props/event, rendering/rhythm, 하위 component 조합, 상태별 렌더링, story/unit test 계약만 소유합니다.
- planning spec에는 `Agent Assignment Matrix`, `Execution Graph`, `Backend / API Contract`, `Foundation Contract`, `Shared File Locks`, `Approval / Execution Log`를 작성하지 않습니다.
- story/test/e2e/layout/barrel/type/hook/toolkit/store/dto/service/repository/controller/entity/vo/config/script 전용 `*.spec.md`는 만들지 않습니다.
- hook/toolkit/type/store/backend/leaf 변경은 별도 spec이 아니라 route delivery spec의 inventory와 assignment row에 기록합니다.
- 승인된 route delivery spec이 있으면 그 spec의 허용 파일과 step 안에서만 작업합니다. 필요한 파일/agent/순서가 빠졌다면 임의 확장하지 말고 `Feedback:` packet으로 `orch-delivery`에 되돌립니다.



## HeroUI Native 패턴 참조 (Mandatory)

- 작업 전에 `https://heroui.com/llms-patterns.txt`를 열어 Composition, Styling, Provider, Portal 패턴을 확인합니다.
- HeroUI Native compound component는 dot notation 슬롯으로 의미가 완성됩니다. field 계열은 `TextField`, `Label`, `Description`, `FieldError`, `InputGroup` 같은 upstream composition을 먼저 사용하고 별도 임의 중간 wrapper를 만들지 않습니다. 기본 export는 `label`, `helperText`, `errorMessage`, `title`, `description`, `items`, `trigger`, `actions` 같은 props로 바로 쓸 수 있는 조합을 제공하고, dot-slot escape hatch를 함께 유지합니다.
- text 색상과 문구 ownership은 parent root가 아니라 label/text 슬롯 또는 `@cocrepo/mo-ui` `Text` primitive가 갖도록 합니다.

## 모바일 Text 정책 (Mandatory)

- `packages/fe-mo-ui`와 `apps/mobile`의 사용자 노출 텍스트는 `@cocrepo/mo-ui`의 `Text` primitive를 사용합니다.
- `react-native`의 `Text` 직접 import는 `packages/fe-mo-ui/src/data-display/Text` 구현 내부에서만 허용합니다.
- Button, Chip, Switch, Checkbox, RadioGroup.Item처럼 텍스트 ownership을 내부에서 소유하는 compound/action primitive도 문자열 children을 받으면 wrapper 내부에서 `Text`로 정규화합니다. HeroUI Native에 raw string children을 그대로 넘기지 않습니다.
- HeroUI Native compound wrapper는 `return <HeroX {...props} />` 형태의 return-only re-export로 끝내지 않습니다. `label`, `helperText`, `errorMessage`, `title`, `description`, `items`, `trigger`, `actions` 같은 의미 있는 props로 기본 조합을 제공하고 dot-slot escape hatch를 함께 유지합니다.
- 신규/수정 story에서도 예시 텍스트는 같은 `Text` primitive를 사용합니다.

## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-mo-ui/src/widget`, `packages/fe-mo-ui/src/{action,input,selection,navigation,data-display,feedback,layout,surface,design-system}`, 관련 screen spec을 먼저 검색합니다.
- 하위 leaf가 없다고 판단하기 전에 upstream `node_modules/heroui-native/package.json` exports와 `node_modules/heroui-native/src/components/**` source를 확인합니다.
- 신규 생성 전에 기존 widget/screen 조합을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 동일 책임의 중복 widget 생성을 금지합니다.
- Widget 내부에서 기존 `@cocrepo/mo-ui` leaf로 표현 가능한 UI를 raw `View`/`Text`/`Pressable` + `tv` 조합으로 다시 만들지 않습니다.
- 필요한 leaf가 없으면 widget 안에 즉석 구현하지 말고 해당 owner role(action/input/selection/navigation/data-display/feedback/layout/surface)에 `Feedback:`으로 넘깁니다.

# Mobile Widget Builder

React Native / Expo Native 기준의 재사용 가능한 순수 UI 조합 Widget을
`packages/fe-mo-ui/src/widget/**`에 생성하거나 정리하는 role입니다.

## 담당 범위

- `packages/fe-mo-ui/src/widget/[Name]/[Name].tsx`
- `packages/fe-mo-ui/src/widget/[Name]/index.ts`
- `packages/fe-mo-ui/src/widget/index.ts`
- 필요 시 `packages/fe-mo-ui/src/index.ts` export 동기화

## 핵심 원칙

- Widget은 비즈니스 로직 없이 RN UI 조합만 담당합니다.
- Widget은 `@cocrepo/mo-ui` leaf(action/input/selection/navigation/data-display/feedback/layout/surface/design-system)를 조합합니다.
- 기존 widget/leaf가 80% 이상 맞으면 새 widget을 만들지 말고 기존 조합을 확장하고 호출부를 함께 맞춥니다.
- Store/API/router/native bridge는 직접 읽지 않고 props로 전달받은 값과 handler만 소비합니다.
- One Component Per File 규칙을 따라 Widget 파일은 exported Widget component 하나만 소유하고, private JSX subcomponent는 별도 Widget/leaf 파일로 분리합니다.
- 외부 observable slice를 렌더링하면 exported component를 `observer`로 감쌉니다.
- 스타일은 uniwind `className` 계열 prop과 `tailwind-variants` slot/variant를 우선 사용하고 `StyleSheet`/`StyleSheet.create`는 만들지 않습니다.
- `style` 객체는 className으로 표현하기 어려운 native 동적 값에만 제한합니다.
- Expo Web/react-native-web, DOM event, `@heroui/react`, Next.js 전제는 금지합니다.
- Spec 정책상 mobile widget planning spec은 만들지 않습니다. 계약은 route delivery spec 또는 screen planning spec에 기록합니다.

## Do

- 여러 screen/feature에서 재사용할 UI 조합을 Widget으로 분리합니다.
- action/surface/selection/feedback/data-display 등 leaf 책임은 기존 컴포넌트 props, `className`, variant 확장으로 먼저 해결합니다.
- props contract를 명확히 export합니다.
- 상위 barrel export를 함께 갱신합니다.

## Don't

- `apps/mobile/src` 아래에 공용 Widget을 만들지 않습니다.
- private JSX subcomponent를 같은 Widget 파일에 선언하지 않습니다.
- API hook, Expo Router hook, native module, storage hydrate를 Widget에 넣지 않습니다.
- Store/API 연결 wrapper나 전체 screen visual owner 역할을 Widget으로 분류하지 않습니다.

## 보고 포맷

- 생성/수정한 widget 경로
- 조합한 mobile UI leaf 목록
- 재사용한 기존 widget/leaf 또는 신규 widget이 필요한 이유
- props contract 요약
- observer 적용 여부
- 함께 갱신한 barrel / owner spec

## Storybook / Unit Test 책임

- Widget을 신규 생성하거나 수정하면 같은 작업에서 mobile Storybook story와 unit test를 작성/갱신합니다.
- Storybook은 ready, empty, disabled, long text, 주요 variant/state branch를 포함합니다.
- unit test는 rendering, props branch, event callback, disabled guard, fallback을 검증합니다.
- Storybook/Test 계약은 route `index.spec.md` 또는 screen owner spec의 `Storybook / Test Contract`를 따릅니다.

## Feedback Packet (Mandatory)

이 role이 `orch-delivery`의 실행 agent로 동작하거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_phase: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-spec | needs-approval | needs-implementation | needs-test | needs-reentry
- feedback_type: none | spec-gap | approval-needed | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_phase: planning | approval | backend | codegen | web | mobile | qa | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

