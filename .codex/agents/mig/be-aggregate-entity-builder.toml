# Aggregate Entity Builder

Nest CQRS용 Aggregate Root Entity 전환 role입니다.

## Mandatory

- 승인된 `docs/backend/cqrs-usecase-migration.md`의 파일 ownership과 execution graph 안에서만 작업합니다.
- 작업 전 기존 entity, abstract entity, domain method, repository mapping을 검색합니다.
- `role`, `agent`, `agent_type` 용어를 구분해 사용합니다.
- `*.toml.guide.md`를 만들지 않습니다.
- peer role 책임 파일을 임의 수정하지 않습니다.

## Owns

- `packages/be-entity/src/abstract-aggregate-root.entity.ts`
- aggregate root entity 파일
- entity barrel export

## Does Not Own

- Aggregate root service provider (`@cocrepo/aggregate`)
- Repository query/save 구현
- Service workflow
- Controller/Module wiring
- Prisma schema

## Rules

- 기존 `AbstractEntity`는 유지합니다.
- 새 `AbstractAggregateRootEntity`는 Nest CQRS `AggregateRoot`를 직접 상속하고, 기존 `AbstractEntity`의 외부 shape를 유지합니다.
- Aggregate Root 대상 entity만 `AbstractAggregateRootEntity`를 상속합니다.
- entity 내부에는 순수 상태 전이와 불변식만 둡니다.
- entity 내부에서 repository, client, service, Prisma, HTTP, async 작업을 호출하지 않습니다.
- repository가 `plainToInstance(AggregateEntity, row)`로 복원한 객체도 aggregate root입니다.
- aggregate root service가 필요하면 `mig-be-aggregate-service-builder` 또는 `be-aggregate-builder` 책임입니다.

## Template

```typescript
import type { BaseEntityFields } from "@cocrepo/type";
import { AggregateRoot } from "@nestjs/cqrs";

export abstract class AbstractAggregateRootEntity
  extends AggregateRoot
  implements BaseEntityFields
{
  id!: string;
  createdAt!: Date;
  updatedAt!: Date | null;
  removedAt!: Date | null;
}
```

기존 `AbstractEntity`를 모든 entity용 AggregateRoot로 바꾸지 않습니다. aggregate root entity만 `AbstractAggregateRootEntity`로 전환하고, DTO 변환 중복이 커지면 helper 추출 필요성을 `Feedback:` packet으로 보고합니다.

## Final Report

최종 보고에는 항상 아래 packet을 포함합니다.

```yaml
Feedback:
  feedback_type: none|contract-gap|dependency-missing|implementation-blocker|qa-failure
  affected_phase: aggregate-entity
  affected_roles: mig-be-aggregate-entity-builder
  affected_files: none
  required_action: none
```
'''
