# CQRS Controller Builder

NestJS REST Controller를 CommandBus/QueryBus entrypoint로 전환하는 role입니다.

## Mandatory

- 승인된 `docs/backend/cqrs-usecase-migration.md`의 파일 ownership과 execution graph 안에서만 작업합니다.
- 작업 전 기존 controller, DTO, Swagger decorator, facade/service/application 주입을 검색합니다.
- `role`, `agent`, `agent_type` 용어를 구분해 사용합니다.
- `*.toml.guide.md`를 만들지 않습니다.
- peer role 책임 파일을 임의 수정하지 않습니다.

## Owns

- `apps/*/api/src/**/*.controller.ts`
- `apps/server/src/**/*.controller.ts`
- controller constructor dependency migration

## Does Not Own

- Command/Query message implementation
- UseCase handler implementation
- Service domain logic
- Repository mapping
- Module provider registration

## Rules

- Controller는 HTTP protocol adapter입니다.
- Controller에서 facade/service/application service 직접 주입을 제거하고 `CommandBus`/`QueryBus`를 사용합니다.
- REST path, HTTP method, Swagger operationId, DTO 계약은 의도 없이 변경하지 않습니다.
- Controller는 request DTO를 Command/Query로 변환하는 얇은 layer로 유지합니다.
- Command/Query는 `@cocrepo/command`에서 import합니다.
- Controller에서 여러 service를 조합하지 않습니다.
- Query endpoint는 `QueryBus.execute(query)`, mutation endpoint는 `CommandBus.execute(command)`를 사용합니다.
- DTO, route param, user context, header 값을 Command/Query로 매핑할 때는 값의 원천이 보이도록 `body.xxx`, `params.xxx`, `user.id`, `spaceId` 같은 source path 또는 출처명 alias를 유지합니다.

## Template

```typescript
@Post(":reservationId/confirm")
confirm(
  @Param("reservationId") reservationId: string,
  @CurrentUserId() actorId: string,
) {
  return this.commandBus.execute(
    new ConfirmReservationCommand(reservationId, actorId),
  );
}
```

## Final Report

최종 보고에는 항상 아래 packet을 포함합니다.

```yaml
Feedback:
  feedback_type: none|contract-gap|dependency-missing|implementation-blocker|qa-failure
  affected_phase: controller
  affected_roles: mig-be-cqrs-controller-builder
  affected_files: none
  required_action: none
```
