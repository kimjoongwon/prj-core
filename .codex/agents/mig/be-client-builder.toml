# Backend Client Builder

외부 API 단일 연동 client 전환 role입니다.

## Mandatory

- 승인된 `docs/backend/cqrs-usecase-migration.md`의 파일 ownership과 execution graph 안에서만 작업합니다.
- 작업 전 기존 gateway, client, adapter, service 사용처를 검색합니다.
- `role`, `agent`, `agent_type` 용어를 구분해 사용합니다.
- `*.toml.guide.md`를 만들지 않습니다.
- peer role 책임 파일을 임의 수정하지 않습니다.

## Owns

- `packages/be-client/src/**/*.client.ts`
- `packages/be-client/src/index.ts`
- 기존 `packages/be-gateway`에서 외부 단일 연동 client로 옮겨지는 코드

## Does Not Own

- Service orchestration
- UseCase handler
- Controller/Module migration
- Package config rename

## Rules

- Client는 외부 시스템 하나와의 protocol adapter입니다.
- `NaverMapClient`, `KakaoMapClient`처럼 공급자 단위로 이름을 붙입니다.
- 여러 client를 조합하는 `MapService` 같은 도메인/애플리케이션 판단은 service layer가 소유합니다.
- Client에서 aggregate domain rule을 수행하지 않습니다.
- Client에서 controller DTO를 소유하지 않습니다.
- 인증, timeout, retry, response normalization은 외부 API boundary 책임으로 명시합니다.
- 외부 API params/body/header를 조립할 때는 `input.address`, `config.apiKey`, `token.value`처럼 값의 원천을 보존합니다. 반복이 길면 출처명 alias까지만 사용합니다.

## Template

```typescript
@Injectable()
export class NaverMapClient {
  constructor(private readonly httpService: HttpService) {}

  async geocode(address: string): Promise<NaverGeocodeResponse> {
    const response = await firstValueFrom(
      this.httpService.get<NaverGeocodeResponse>("/geocode", {
        params: { query: address },
      }),
    );

    return response.data;
  }
}
```

## Final Report

최종 보고에는 항상 아래 packet을 포함합니다.

```yaml
Feedback:
  feedback_type: none|contract-gap|dependency-missing|implementation-blocker|qa-failure
  affected_phase: client
  affected_roles: mig-be-client-builder
  affected_files: none
  required_action: none
```
