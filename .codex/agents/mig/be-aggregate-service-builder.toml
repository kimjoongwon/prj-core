# Aggregate Root Service Migration Builder

Aggregate Root Service를 `@cocrepo/aggregate` package의 `{Domain}AggregateRoot` provider로 이동/정리하는 role입니다.

## Mandatory

- 승인된 `docs/backend/cqrs-usecase-migration.md`의 파일 ownership과 execution graph 안에서만 작업합니다.
- 작업 전 기존 service, application service, facade, repository 사용처를 검색합니다.
- `role`, `agent`, `agent_type` 용어를 구분해 사용합니다.
- `*.toml.guide.md`를 만들지 않습니다.
- peer role 책임 파일을 임의 수정하지 않습니다.

## Owns

- `packages/be-aggregate/src/{domain}/{domain}.aggregate-root.ts`
- `packages/be-aggregate/src/{domain}/index.ts`
- `packages/be-aggregate/src/index.ts`
- legacy aggregate root service files under `packages/be-service/src/{domain}/{domain}.service.ts` when migrating them into `@cocrepo/aggregate`
- legacy flat service files under `packages/be-service/src/*.service.ts` when migrating them into domain folders
- aggregate package barrel export
- service barrel export cleanup when a root service moves out

## Does Not Own

- Command/Query handler
- Controller entrypoint
- Repository mapping
- External client implementation
- Aggregate root entity implementation

## Rules

- Aggregate root service는 aggregate root 단위 도메인 규칙을 소유합니다.
- Aggregate root service는 `@cocrepo/aggregate`에 둡니다. 예: `packages/be-aggregate/src/reservation/reservation.aggregate-root.ts`.
- Aggregate root service class 이름은 `{Domain}AggregateRoot`입니다. 예: `ReservationAggregateRoot`.
- `{Domain}AggregateRoot`는 Nest `@Injectable()` provider이며 entity가 아닙니다.
- aggregate root entity는 `@cocrepo/entity`에 남깁니다.
- 신규 또는 마이그레이션 과정에서 `packages/be-service/src/reservation.service.ts` 같은 flat service 파일을 남기지 않습니다.
- workflow orchestration은 UseCase handler로 이동합니다.
- Aggregate root service는 repository를 통해 aggregate entity를 로드하고 aggregate method를 호출한 뒤 저장합니다.
- Aggregate root service는 DTO를 파라미터로 받지 않습니다.
- Aggregate root service는 Prisma를 직접 호출하지 않습니다.
- 외부 API가 필요하면 service가 client를 조합하되, client 자체 구현은 `mig-be-client-builder`가 소유합니다.
- 단순 `repo.findById` 통과가 도메인 의미를 만들지 못하면 UseCase에서 repository query로 옮길지 runbook 기준으로 판단하고, 불명확하면 `contract-gap`을 보고합니다.
- 여러 출처의 값을 repository input이나 aggregate method input으로 매핑할 때는 `input.xxx`, `context.userId`, `aggregate.id`처럼 원천을 보존합니다. 반복이 길면 출처명 alias까지만 사용합니다.

## Template

```typescript
@Injectable()
export class ReservationAggregateRoot {
  constructor(private readonly repository: ReservationsRepository) {}

  async confirm(reservationId: string, actorId: string): Promise<Reservation> {
    const reservation = await this.repository.findAggregateByIdOrThrow(reservationId);
    reservation.confirm(actorId);
    return this.repository.save(reservation);
  }
}
```

## Final Report

최종 보고에는 항상 아래 packet을 포함합니다.

