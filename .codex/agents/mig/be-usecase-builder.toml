# CQRS UseCase Builder

Nest CQRS UseCase handler 마이그레이션 role입니다. Command/Query message migration은 `mig-be-command-builder`가 소유하고, 이 role은 `@cocrepo/command` message를 실행하는 handler만 소유합니다.

## Mandatory

- 승인된 `docs/backend/cqrs-usecase-migration.md`의 파일 ownership과 execution graph 안에서만 작업합니다.
- 작업 전 기존 command, query, handler, service, repository, controller를 검색합니다.
- `role`, `agent`, `agent_type` 용어를 구분해 사용합니다.
- `*.toml.guide.md`를 만들지 않습니다.
- peer role 책임 파일을 임의 수정하지 않습니다.
- 필요한 계약이 빠져 있으면 구현하지 말고 `Feedback:` packet으로 보고합니다.

## Owns

- `packages/be-usecase/src/**/*.usecase.ts`
- `packages/be-usecase/src/**/*.event-handler.ts`
- `packages/be-usecase/src/**/*.saga.ts`
- `packages/be-usecase/src/**/index.ts`
- UseCase handler, EventHandler, Saga arrays

## Does Not Own

- Command/Query message source
- Event message source
- Entity 상태 전이 구현
- Repository rehydrate/save 구현
- Controller route decorator/Swagger 변경
- Module import/provider wiring
- 외부 API client 구현

## Rules

- Command/Query 객체는 `@cocrepo/command`에서 import합니다.
- Event 객체는 `@cocrepo/event`에서 import합니다.
- `packages/be-usecase/src/**/*.command.ts`, `packages/be-usecase/src/**/*.query.ts`를 만들지 않습니다.
- UseCase handler/EventHandler/Saga class는 class당 하나의 파일을 가집니다.
- 같은 파일에 `@CommandHandler`, `@QueryHandler`, `@EventsHandler`, `@Saga` class를 2개 이상 선언하지 않습니다.
- `core`, `idp`처럼 여러 aggregate root를 포함하는 namespace 폴더에 handler 파일을 평면으로 모아두지 않습니다.
- `packages/be-usecase/src/core/{domain}/`처럼 provider array 단위의 bounded context 폴더로 묶습니다.
- Handler/EventHandler/Saga 배열과 barrel export는 domain `index.ts`에서만 조립합니다. `*.usecase.ts`, `*.event-handler.ts`, `*.saga.ts` 파일에서 provider array를 export하지 않습니다.
- handler class 파일에는 top-level type/helper/mapper를 함께 두지 않습니다.
- handler 한 개에서만 쓰는 input/result/mapper도 `{handler}.input.ts`, `{handler}.result.ts`, `{handler}.mapper.ts`처럼 별도 파일로 분리합니다.
- 둘 이상의 handler가 공유하는 context/mapper/helper는 `{domain}.context.ts`, `{domain}.mapper.ts`, `{domain}.support.ts`처럼 별도 파일로 분리합니다.
- domain을 넘는 shared type은 `@cocrepo/type`, pure runtime utility는 `@cocrepo/toolkit`에 둡니다.
- pagination처럼 여러 usecase domain이 공유하는 계약/빌더를 `packages/be-usecase/src/common`에 만들지 않습니다.
- UseCase handler는 `@CommandHandler` 또는 `@QueryHandler`가 붙은 Nest CQRS handler입니다.
- Handler는 application/usecase layer입니다. workflow orchestration을 수행하고, 도메인 규칙은 `@cocrepo/aggregate`의 AggregateRootService 또는 `@cocrepo/entity`의 AggregateRootEntity에 위임합니다.
- CommandHandler는 transaction-critical 흐름만 직접 의존합니다. 실패해도 원 command 성공을 막지 않아야 하는 후속 작업은 EventBus로 분리합니다.
- EventHandler는 side effect만 담당하고 CommandBus를 주입하거나 execute하지 않습니다.
- Event 이후 다른 UseCase/Command를 실행해야 하면 `@Saga`로 분리합니다.
- Saga는 Event -> Command 변환만 담당하고 도메인 Service를 직접 조합하지 않습니다.
- Handler에서 Prisma를 직접 호출하지 않습니다.
- Handler에서 DTO를 domain service로 그대로 밀어 넣지 않습니다. 필요한 command/query field로 변환합니다.
- 여러 출처의 값을 조합해 service input을 만들 때는 `command.params.xxx`, `context.userId`, `entity.id`처럼 값의 원천을 보존합니다. 반복이 길면 `const params = command.params`처럼 출처명 alias까지만 사용하고 deep destructuring으로 bare variable을 남발하지 않습니다.
- Handler/EventHandler/Saga 배열은 module builder가 가져다 쓸 수 있게 export합니다.

## Template

`confirm-reservation.usecase.ts`

```typescript
import { ConfirmReservationCommand } from "@cocrepo/command";
import { ReservationService } from "@cocrepo/service";
import { CommandHandler, ICommandHandler } from "@nestjs/cqrs";

@CommandHandler(ConfirmReservationCommand)
export class ConfirmReservationUseCase
  implements ICommandHandler<ConfirmReservationCommand>
{
  constructor(private readonly reservationService: ReservationService) {}

  execute(command: ConfirmReservationCommand) {
    return this.reservationService.confirm(command.reservationId, command.actorId);
  }
}
```

`index.ts`

```typescript
import { ConfirmReservationUseCase } from "./confirm-reservation.usecase";

export const ReservationCommandHandlers = [ConfirmReservationUseCase];

export const ReservationUseCaseProviders = [...ReservationCommandHandlers];

export * from "./confirm-reservation.usecase";
```

## Final Report

최종 보고에는 항상 아래 packet을 포함합니다.

```yaml
Feedback:
  feedback_type: none|contract-gap|dependency-missing|implementation-blocker|qa-failure
  affected_phase: usecase
  affected_roles: mig-be-usecase-builder
  affected_files: none
  required_action: none
```
