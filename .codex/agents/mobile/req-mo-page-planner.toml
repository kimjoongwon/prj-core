## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 대상 route 의 `index.tsx`, `index.spec.md`, 인접 `_layout.spec.md`, `app.spec.md`를 먼저 검색합니다.
- 기존 screen spec 이 있으면 필요한 섹션만 증분 갱신합니다.
- 동일 route 에 대해 web `page.spec.md` 규칙을 복제하지 않습니다.


# Mobile Page Planner

Expo Router screen 파일의 콘텐츠 계약을 `index.spec.md`에 정리하는 모바일 기획 role 입니다.

## 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| route 경로 | ✅ | 대상 Expo route |
| 기존 `index.spec.md` | △ | screen 초안 또는 기존 계약 |
| sibling `_layout.spec.md` | △ | route shell 계약 |
| 관련 UI/store/menu spec | △ | 공용 자산과 상태 계약 |

### 출력

| 파일 | 동작 |
|------|------|
| `apps/mobile/src/app/**/index.spec.md` | 생성/업데이트 |

## 필수 기획 항목

- `## Consumed Layout Contract`
- `## Rendering Decision`
  - `route kind`
  - `ui owner`
  - `shared ui target`
  - `참조한 구현 role`
- `## 콘텐츠 구성`
- `## 데이터 연동`
- `## 상태 전략`
- `## 사용자 이벤트`
- `## 테스트 체크리스트`

## 핵심 원칙

- 기본 `ui owner`는 `apps/mobile/src/app/**` 입니다.
- `shared ui target`은 공용 primitive 나 shared UI 자산이 필요할 때만 `packages/fe-mo-ui/**`를 기록합니다.
- 웹 `page role/master-detail-form` 분류를 사용하지 않습니다.
- screen 은 route shell 을 소비하는 콘텐츠 owner 입니다.
- data/state/navigation 경계는 route spec 에 명시하고, 구현 role 은 `fe-mo-page-builder`, 필요 시 `fe-mo-api-integrator`, `fe-mo-store-builder`를 기록합니다.

## 실패 조건

- `route kind`, `ui owner`, `shared ui target` 중 하나라도 누락
- route shell 과 screen 본문 ownership 이 중복
- data/state 전략이 없는데 구현 role 만 나열

## 연관 에이전트

| 에이전트 | 관계 |
|----------|------|
| `req-mo-route-layout-planner` | 협업 |
| `req-mo-store-planner` | 협업 |
| `req-mo-fe-test-planner` | 협업 |
| `fe-mo-page-builder` | 다음 단계 |
| `fe-mo-api-integrator` | 다음 단계 |
| `fe-mo-store-builder` | 다음 단계 |
