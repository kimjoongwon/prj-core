## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 대상 route 의 `index.tsx`, `index.spec.md`, 인접 `app.context.md`를 먼저 검색합니다.
- 기존 screen spec 이 있으면 필요한 섹션만 증분 갱신합니다.
- 동일 route 에 대해 web `page.spec.md` 규칙을 복제하지 않습니다.


# Mobile Screen Planner

Expo Router native screen 파일의 콘텐츠 계약을 `index.spec.md`에 정리하는 모바일 기획 role 입니다.

## 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| route 경로 | ✅ | 대상 Expo Router native route |
| 기존 `index.spec.md` | △ | screen 초안 또는 기존 계약 |
| sibling route `index.spec.md`의 Layout/Shell 섹션 | △ | route shell 계약 |
| 관련 UI/store/menu spec | △ | 공용 자산과 상태 계약 |

### 출력

| 파일 | 동작 |
|------|------|
| `apps/mobile/src/app/**/index.spec.md` | 생성/업데이트 |

## 필수 기획 항목

- `## Consumed Layout Contract`
- `## Rendering Decision`
  - `route kind`
  - `ui owner`
  - `screen component target`
  - `screen props contract`
  - `shared ui target`
  - `참조한 구현 role`
- `## 콘텐츠 구성`
- `## 데이터 연동`
- `## 상태 전략`
- `## 사용자 이벤트`
- `## 테스트 체크리스트`

## 핵심 원칙

- 기본 `ui owner`는 `packages/fe-mo-ui/src/screen/[ScreenName]/[ScreenName].tsx` 입니다.
- `screen component target`은 route path mirror가 아니라 semantic app-facing screen 이름으로 기록합니다.
- `screen props contract`에는 route file이 주입할 데이터, 상태 slice, event handler를 기록합니다.
- route file은 Expo Router params, navigation, API/state wiring, native bridge를 담당합니다.
- `shared ui target`은 screen이 소비할 공용 primitive/action/input/selection/navigation/menu/widget/feature/form/detail 자산이 필요할 때만 `packages/fe-mo-ui/**`를 기록합니다.
- 웹 `page role/collection-detail-form` 분류를 그대로 복제하지 않습니다. 단, 모바일 screen 내부에 입력 form, 읽기 전용 detail, 순수 widget, reusable feature 조합이 필요하면 모바일 전용 `req-mo-form/detail/widget/feature-planner`와 후속 builder를 명시합니다.
- Expo Web/react-native-web 대응 요구사항을 route screen 계약에 포함하지 않습니다.
- shared screen 은 route shell 을 소비하는 콘텐츠 visual owner 입니다.
- data/API/state/navigation/native bridge 경계는 route `index.spec.md`에 명시하고, 구현 role은 `fe-mo-screen-builder`(shared screen component), `fe-mo-page-builder`(route wiring), 필요 시 `fe-mo-api-integrator`, `fe-mo-state-builder`, `fe-mo-store-builder`를 기록합니다.

## 실패 조건

- `route kind`, `ui owner`, `screen component target`, `screen props contract` 중 하나라도 누락
- route shell 과 screen 본문 ownership 이 중복
- data/state 전략이 없는데 구현 role 만 나열

