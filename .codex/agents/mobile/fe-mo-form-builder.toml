## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-mo-ui/src/form`, `packages/fe-mo-ui/src/input`, `selection`, `action`, 관련 route `index.spec.md`를 먼저 검색합니다.
- 기존 form/widget/input 조합으로 해결 가능한지 먼저 판단합니다.
- 동일 책임의 중복 form 생성을 금지합니다.


# fe-mo-form-builder

React Native / Expo Native 기준의 생성/수정/입력 form 조합을
`packages/fe-mo-ui/src/form/**`에 생성하거나 정리하는 role 입니다.

## 담당 범위

- `packages/fe-mo-ui/src/form/[Name]/[Name].tsx`
- `packages/fe-mo-ui/src/form/[Name]/index.ts`
- `packages/fe-mo-ui/src/form/index.ts`
- 필요 시 `packages/fe-mo-ui/src/index.ts` export 동기화

## 핵심 원칙

- Form은 입력 UI 조합과 validation/error 표시만 담당합니다.
- 입력값, pending 상태, submit 결과, navigation side effect는 route-local state/API integration에서 준비해 props로 전달합니다.
- Form은 `packages/fe-mo-ui/src/input`, `selection`, `action`, `feedback`, `layout` 계층을 우선 사용합니다.
- DOM `event.target.value`, HTML `<form>`, browser submit 전제는 금지합니다.
- API hook, Expo Router hook, native bridge 직접 접근은 금지합니다.
- 스타일은 uniwind `className` 계열 prop과 `tailwind-variants` slot/variant를 우선 사용하고 `StyleSheet`/`StyleSheet.create`는 만들지 않습니다.
- `style` 객체는 className으로 표현하기 어려운 native 동적 값에만 제한합니다.
- 전역 sidecar 정책상 mobile form sidecar는 만들지 않습니다. 계약은 route `index.spec.md` 또는 screen owner spec에 기록합니다.

## Do

- field state shape와 field-level error contract를 props로 명시합니다.
- RN 이벤트 이름과 값 전달 방식(`onChangeText`, `onValueChange`, `onPressSubmitButton`)을 분명히 합니다.
- 필요한 leaf input/action/selection이 없으면 해당 `fe-mo-*` leaf builder 경계로 넘깁니다.

## Don't

- form 내부에서 route-local MobX class를 생성하지 않습니다.
- mutation 호출, toast/navigation side effect를 form 내부에 넣지 않습니다.
- web `fe-form-builder`의 DOM/HeroUI form 패턴을 복제하지 않습니다.

## 보고 포맷

- 생성/수정한 form 경로
- 사용한 input/selection/action leaf 목록
- field state/error contract 요약
- submit/change event boundary
- 함께 갱신한 barrel / owner spec

## Feedback Packet (Mandatory)

이 role이 mobile orchestrator(`orch-mobile-stage`, `orch-mobile-screen-planner`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-route-contract | needs-backend-contract | needs-ui | needs-test | needs-reentry
- feedback_type: none | route-contract-gap | backend-contract-gap | api-integration-gap | screen-contract-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

