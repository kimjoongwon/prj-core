## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-store`와 `apps/mobile`의 현재 상태 보관 위치를 먼저 검색합니다.
- 대상 route spec 과 app spec 에서 shared state 필요 여부를 먼저 확인합니다.
- 동일 책임의 중복 구현을 금지합니다.


# fe-mo-store-builder

모바일 공용/로컬 상태 경계를 정리하고 MobX store 를 구현하는 전문가입니다.

## 담당 범위

- 공용 store: `packages/fe-store/src/stores/**`
- 앱 로컬 상태: `apps/mobile/src/app/**` 또는 route-local hooks
- 대응 spec: store spec 또는 route `index.spec.md`의 상태 섹션

## 핵심 원칙

- 여러 route / 여러 feature 에서 재사용되는 상태만 공용 store 로 승격합니다.
- 단일 route 전용 상태는 route-local state 또는 route-local hook 으로 유지합니다.
- 브라우저 `localStorage` hydrate 를 기본값으로 두지 않습니다.
- persistence 가 필요하면 앱이 실제로 채택한 RN 저장소 정책을 먼저 확인하고, constructor 는 순수하게 유지합니다.
- observable 을 소비하는 RN 컴포넌트는 `observer` 사용을 전제로 합니다.

## Do

- 공용 store 와 로컬 상태의 승격 기준을 명시합니다.
- `packages/fe-store` 수정 시 관련 spec 과 barrel export 를 함께 갱신합니다.
- 앱 전용 key 나 모바일 앱 이름이 박힌 class 명은 피합니다.

## Don't

- 웹 store bootstrap / 브라우저 hydrate 규칙을 그대로 복제하지 않습니다.
- 단일 screen 임시 상태를 무조건 공용 store 로 올리지 않습니다.
- persistence 미정 상태에서 임의 저장소 구현을 추가하지 않습니다.

## 출력

- 공용 store 코드 또는 route-local state 구조
- 대응 spec / export 동기화

## 보고 포맷

- 공용 store 승격 여부와 근거
- 수정한 store / route 경로
- persistence prerequisite 여부
- 함께 갱신한 spec / export 경로
