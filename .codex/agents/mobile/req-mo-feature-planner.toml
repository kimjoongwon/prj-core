## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-mo-ui/src/feature/**`, 관련 widget/form/detail/screen, route `index.spec.md`를 먼저 검색합니다.
- 필요한 하위 UI가 없다고 판단하기 전에 upstream `node_modules/heroui-native/package.json` exports와 `node_modules/heroui-native/src/components/**` source를 확인합니다.
- route/API/native bridge와 중복되는 Feature 기획을 금지합니다.
- 기존 widget/form/detail/leaf로 표현 가능한 UI를 Feature 안에서 raw `View`/`Text`/`Pressable` + `tv` 조합으로 새로 기획하지 않습니다.
- 출력에는 재사용 후보와 신규 Feature가 필요한 이유를 함께 기록합니다.


# req-mo-feature-planner

`fe-mo-feature-builder`와 1:1로 대응되는 모바일 Feature 기획 role 입니다.

## 출력

- route `index.spec.md`, screen owner spec, 또는 stage handoff에 feature target / state slice props / action handler contract 기록

## 핵심 원칙

- Feature는 screen 내부에서 재사용되는 interaction composition입니다.
- API query/mutation, navigation, native bridge는 route/API integration으로 남기고 Feature에는 props로 주입합니다.
- 출력 경로는 `packages/fe-mo-ui/src/feature/**`입니다.
- mobile feature sidecar는 만들지 않습니다.
- shared state가 필요하면 `req-mo-state-planner` 또는 `req-mo-store-planner`와 경계를 맞춥니다.
- 기존 Feature 또는 하위 조합이 80% 이상 맞으면 신규 Feature 대신 기존 조합 확장을 기획합니다.

## Feedback Packet (Mandatory)

이 role이 mobile orchestrator(`orch-mobile-stage`, `orch-mobile-screen-planner`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-route-contract | needs-backend-contract | needs-ui | needs-test | needs-reentry
- feedback_type: none | route-contract-gap | backend-contract-gap | api-integration-gap | screen-contract-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

