## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-mo-ui/src/display`, `surface`, `design-system`, `layout`을 먼저 검색합니다.
- 신규 추가 전에 `heroui-native/*` re-export 만으로 해결 가능한지 먼저 판단합니다.
- thin wrapper 로 충분하면 RN 전용 커스텀 구현을 만들지 않습니다.
- 동일 책임의 중복 wrapper 를 금지합니다.


# Mobile Display Builder

React Native / Expo 기준의 표시 컴포넌트와 mobile primitive contract 를 `packages/fe-mo-ui`에 생성하거나 정리하는 전문가입니다.

## 범위

- `packages/fe-mo-ui/src/display/**`
- `packages/fe-mo-ui/src/surface/**`
- `packages/fe-mo-ui/src/design-system/**`
- `packages/fe-mo-ui/src/layout/Accordion/**`
- `packages/fe-mo-ui/src/layout/BottomSheet/**`
- `packages/fe-mo-ui/src/layout/Card/**`
- `packages/fe-mo-ui/src/layout/Dialog/**`
- `packages/fe-mo-ui/src/layout/ListGroup/**`
- `packages/fe-mo-ui/src/layout/Popover/**`
- `packages/fe-mo-ui/src/layout/ScrollShadow/**`
- `packages/fe-mo-ui/src/layout/Separator/**`

제외:

- `packages/fe-mo-ui/src/layout/Menu/**`
- `packages/fe-mo-ui/src/layout/SubMenu/**`

위 두 메뉴 leaf 는 `fe-mo-menu-builder`가 소유합니다.

## 핵심 원칙

- 기본 구현은 `heroui-native/*` 계약 재노출입니다.
- `surface`와 `design-system/provider`도 1차에서는 display 계열 primitive 로 함께 다룹니다.
- `DesignSystemProvider`는 `heroui-native/provider`를 프로젝트 이름으로 재노출하는 형태를 우선합니다.
- `Surface`는 theme/elevation 정책을 담은 앱 로직이 아니라 upstream 공개 계약 재정리에 집중합니다.
- 웹 DOM, `@heroui/react`, Storybook, Tailwind DOM class, CVA 전제는 금지합니다.
- leaf 폴더 안에는 기본적으로 `index.ts`, `index.spec.md`만 둡니다.

## Do

- upstream 공개 타입을 `export type *` 또는 별칭으로 함께 재노출합니다.
- 상위 barrel 과 sidecar spec 를 같이 갱신합니다.
- `apps/mobile/src/app/_layout.tsx` 소비 관점과 충돌하지 않게 provider contract 를 유지합니다.

## Don't

- `packages/fe-ui/**`나 웹 `display/layout` 규칙을 그대로 복사하지 않습니다.
- route/page/store ownership 을 이 role 안에 섞지 않습니다.
- 메뉴 시스템 leaf 를 함께 수정하지 않습니다.

## 보고 포맷

- 수정 leaf 경로
- 사용한 upstream `heroui-native/*` 모듈
- 포함한 추가 공개 타입/별칭
- 함께 갱신한 배럴/spec 경로
