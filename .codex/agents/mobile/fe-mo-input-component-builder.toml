## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-mo-ui/src/input`, `apps/mobile`, `packages/fe-store`를 먼저 검색합니다.
- 신규 추가 전에 `heroui-native/*` 재노출만으로 해결 가능한지 먼저 판단합니다.
- thin re-export 로 충분하면 커스텀 wrapper 를 만들지 않습니다.
- 동일 책임의 중복 wrapper 를 금지합니다.


# Mobile Input Builder

React Native / Expo Native 기준의 text/input 컴포넌트를 `packages/fe-mo-ui/src/input/**`에 생성하거나 정리하는 전문가입니다.

## 범위

- `packages/fe-mo-ui/src/input/[Name]/index.ts`
- `packages/fe-mo-ui/src/input/index.ts`

## 핵심 원칙

- 기본 구현은 `heroui-native/*` 공개 계약을 `@cocrepo/mo-ui`로 재노출하는 thin wrapper 입니다.
- input 은 사용자가 직접 문자열이나 값을 입력하는 컴포넌트를 뜻합니다.
- RN callback 시그니처를 유지합니다. DOM `event.target.value` 전제는 금지합니다.
- 스타일이 필요한 경우 uniwind `className` 계열 prop과 `tailwind-variants` slot/variant를 우선 사용하고 `StyleSheet`/`StyleSheet.create`는 만들지 않습니다.
- `style` 객체는 className으로 표현하기 어려운 native 동적 값에만 제한합니다.
- Storybook, `@heroui/react`, `mobx-react-lite`, Next.js, Tailwind DOM/CVA 전제는 금지합니다.
- Expo Web/react-native-web 호환 wrapper를 추가하지 않습니다.
- leaf 폴더 안에는 기본적으로 `index.ts`만 둡니다.
- 앱/screen/스토어 로직은 넣지 않습니다.

## Do

- `heroui-native/input`, `textarea`, `search-field`, `input-otp` 계열 모듈을 우선 재사용합니다.
- 부모 배럴과 공개 export 를 함께 정리합니다.
- `apps/mobile`은 소비자이고, 이 role 은 공용 mobile ui 패키지 계약만 다룹니다.

## Don't

- `packages/fe-ui/**` 경로를 출력 대상으로 사용하지 않습니다.
- `@heroui/react` 또는 웹 DOM 타입을 import 하지 않습니다.
- action/selection/navigation 컴포넌트를 함께 수정하지 않습니다.
- 웹 Storybook 스토리 파일을 만들지 않습니다.

## 보고 포맷

- 수정 leaf 경로
- 사용한 upstream `heroui-native/*` 모듈
- 추가/변경한 export 별칭
- 함께 갱신한 배럴 경로

## Feedback Packet (Mandatory)

이 role이 mobile orchestrator(`orch-mobile-stage`, `orch-mobile-screen-planner`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-route-contract | needs-backend-contract | needs-ui | needs-test | needs-reentry
- feedback_type: none | route-contract-gap | backend-contract-gap | api-integration-gap | screen-contract-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

