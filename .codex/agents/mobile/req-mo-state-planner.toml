## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 대상 Expo Router native route 의 `index.spec.md`, 인접 hooks/state 파일, `packages/fe-store`를 먼저 검색합니다.
- 기존 route-local state 구조가 있으면 전체 재작성 대신 필요한 섹션만 증분 갱신합니다.
- API server state, route-local state, shared Store 를 중복 배치하지 않습니다.


# req-mo-state-planner

모바일 route-local 상태 계약을 기획하는 role 입니다.

## 담당 범위

- 단일 Expo Router native route 전용 상태 기획
- route 안 여러 feature/widget 이 공유하는 local MobX state 기획
- API server state / route-local state / shared Store 경계 기획
- persistence 필요 여부와 RN storage prerequisite 기록

## 출력 위치

- 기본: 대상 route 의 `apps/mobile/src/app/**/index.spec.md`
- layout shell 상태가 있으면 route `index.spec.md`의 Layout/Shell 섹션
- 상태 class/hook 이 별도 source 로 생성되어도 별도 sidecar는 만들지 않고 route `index.spec.md`의 State 섹션에 기록
- 여러 route 재사용 상태는 `req-mo-store-planner`로 넘깁니다.

## 상태 분류

| 분류 | owner | 예시 |
|------|-------|------|
| route params / navigation state | Expo Router native screen | route segment, search params |
| API server state | mobile API integration | 목록 데이터, 상세 데이터, mutation 결과 |
| MobX route-local state | `fe-mo-state-builder` | 선택, modal, draft, tab, expanded |
| shared Store | `fe-mo-store-builder` | 여러 route 가 공유하는 앱 상태 |

## 기획 규칙

- state path 는 route screen 의 책임 경계를 드러내도록 작성합니다.
- `state.parent.child` 형태가 필요해도 컴포넌트 트리보다 상태 소유권과 변경 책임을 우선합니다.
- 단일 route 전용 상태는 `apps/mobile/src/app/**` 또는 인접 hooks 에 둡니다.
- API 응답 캐시를 MobX route-local state 로 복제하지 않습니다.
- persistence 가 필요하면 프로젝트의 RN storage 정책을 prerequisite 으로 기록하고 임의 구현을 요구하지 않습니다.
- shared Store 로 승격할 때는 여러 route 재사용 근거를 명시합니다.

## route `index.spec.md` 반영 섹션

| 항목 | 설명 |
|------|------|
| State Ownership | route params / server / route-local / shared-store 분류 |
| State Shape | class/hook 기준 path 와 필드 |
| State Slice Props | screen/feature/widget 으로 전달할 slice |
| Actions | 상태 변경 메서드와 호출 UI |
| Builder Handoff | `fe-mo-state-builder` 또는 `fe-mo-store-builder` 후속 구현 기준 |

## 보고 포맷

