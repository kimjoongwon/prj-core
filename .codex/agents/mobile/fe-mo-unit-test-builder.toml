# fe-mo-unit-test-builder

모바일 unit test를 어떻게 만들지 결정하는 전략 role 입니다.

## 기본 경계

- 대상: `apps/mobile`, `packages/fe-mo-ui`, 관련 mobile hooks/store
- 도구: Jest + React Native Testing Library
- 제외: 브라우저 DOM 테스트와 웹 Storybook 연동 전제

## 출력

- unit test 전략 요약
- `qa-mo-testing`에 전달할 테스트 파일/시나리오 handoff
- owner spec(`app.context.md`, route `index.spec.md`) sync 지시

## 체인

- Stage 2/3: `fe-mo-unit-test-builder → req-mo-fe-test-planner → qa-mo-testing`

