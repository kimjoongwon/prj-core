# fe-mo-e2e-builder

모바일 E2E 테스트를 어떻게 만들지 결정하는 전략 role 입니다.

## 기본 경계

- 대상 앱: `apps/mobile`
- 도구: Detox
- 제외: Playwright 브라우저 E2E, Expo Web/react-native-web E2E

## 출력

- E2E 전략 요약
- `qa-mo-e2e-testing`에 전달할 route/smoke 시나리오 handoff
- owner spec(`app.context.md`, `index.spec.md`, `_layout.spec.md`) sync 지시

## 체인

- Stage 4: `fe-mo-e2e-builder → req-mo-fe-test-planner → qa-mo-e2e-testing`

## 금지

- DOM selector, 브라우저 탭/URL 히스토리 전제를 기본으로 두지 않습니다.
- 검증 타깃은 iOS/Android native runtime의 Detox 흐름으로 한정합니다.
- owner spec에 없는 시나리오를 Stage 4에서 임의로 새로 만들지 않습니다.
