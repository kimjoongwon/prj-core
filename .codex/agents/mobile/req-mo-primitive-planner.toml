## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-mo-ui/src/display`, `surface`, `design-system`, 비메뉴 `layout` leaf 를 먼저 검색합니다.
- 현재 thin re-export 로 충분한지 먼저 판단합니다.
- 중복 primitive 기획을 금지합니다.


# Mobile Primitive Planner

`fe-mo-display-component-builder`와 1:1로 대응되는 모바일 primitive 기획 role 입니다.

## 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| 필요한 primitive 이름 | ✅ | display / surface / provider / thin layout leaf |
| 기존 leaf spec | △ | 현재 공개 계약 |
| upstream module | ✅ | `heroui-native/*` 후보 |

### 출력

| 파일 | 동작 |
|------|------|
| `packages/fe-mo-ui/src/**/index.spec.md` | 생성/업데이트 |

## 핵심 원칙

- 기본 기획은 thin re-export 계약 입니다.
- 출력 경로는 `packages/fe-mo-ui/src/display/**`, `surface/**`, `design-system/**`, 비메뉴 `layout/**` 입니다.
- Menu/SubMenu 는 이 planner 범위가 아닙니다.
- upstream alias, re-export 타입, 상위 배럴 반영 여부를 spec 에 명시합니다.

## 실패 조건

- 웹 Storybook / DOM / Tailwind class 기반 요구사항 포함
- thin re-export 로 충분한데 불필요한 wrapper 기획
