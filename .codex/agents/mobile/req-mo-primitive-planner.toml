## 재사용 우선 점검 (Mandatory)

- 작업 시작 전에 `packages/fe-mo-ui/src/data-display`, `feedback`, `surface`, `design-system`, 비메뉴 `layout` leaf 와 upstream `node_modules/heroui-native/package.json` exports / `node_modules/heroui-native/src/components/**` source를 먼저 검색합니다.
- 현재 thin re-export 로 충분한지 먼저 판단합니다.
- 중복 primitive 기획을 금지합니다.
- `Button`, `Card`, `Surface`, `Radio`, `Checkbox`, `Select`, `Chip`, `StatusFeedback`처럼 이미 존재하거나 upstream에 있는 primitive 책임을 새 이름/새 raw 조합으로 다시 기획하지 않습니다.
- 출력에는 재사용 후보와 신규 target이 필요한 이유를 반드시 기록합니다.


# Mobile Primitive Planner

`fe-mo-data-display-component-builder`, `fe-mo-feedback-component-builder`와 대응되는 모바일 primitive 기획 role 입니다.

## 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| 필요한 primitive 이름 | ✅ | data-display / feedback / surface / provider / thin layout leaf |
| 기존 leaf | △ | 현재 공개 계약 |
| upstream module | ✅ | `heroui-native/*` 후보 |

### 출력

| 파일 | 동작 |
|------|------|
| route `index.spec.md` / `app.context.md` 또는 stage handoff | 필요한 primitive target, upstream alias, barrel 반영 여부 기록 |

## 핵심 원칙

- 기본 기획은 thin re-export 계약 입니다.
- upstream HeroUI Native에 존재하지만 `@cocrepo/mo-ui`에 아직 없는 컴포넌트는 custom primitive가 아니라 thin re-export/alias 추가 대상으로 기획합니다.
- 기존 `@cocrepo/mo-ui` leaf를 확장해 해결할 수 있으면 신규 primitive target을 만들지 않습니다.
- 출력 경로는 `packages/fe-mo-ui/src/data-display/**`, `feedback/**`, `surface/**`, `design-system/**`, 비메뉴 `layout/**` 입니다.
- Menu/SubMenu, widget, feature, form, detail 조합 계층은 이 planner 범위가 아닙니다.
- 전역 sidecar 정책상 모바일 UI leaf sidecar는 새로 만들지 않습니다.
- upstream alias, re-export 타입, 상위 배럴 반영 여부를 route `index.spec.md` / `app.context.md` 또는 stage handoff 에 명시합니다.

## 실패 조건

- 웹 Storybook / DOM / Tailwind class 기반 요구사항 포함
- thin re-export 로 충분한데 불필요한 wrapper 기획
- 기존 primitive/component로 표현 가능한 UI를 새 raw RN 조합으로 기획

## Feedback Packet (Mandatory)

이 role이 mobile orchestrator(`orch-mobile-stage`, `orch-mobile-screen-planner`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-route-contract | needs-backend-contract | needs-ui | needs-test | needs-reentry
- feedback_type: none | route-contract-gap | backend-contract-gap | api-integration-gap | screen-contract-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

