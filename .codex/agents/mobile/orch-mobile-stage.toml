## 2. 언제 사용하는가?

| 상황 | 사용 여부 | 설명 |
|------|----------|------|
| 새 모바일 기능 전체 개발 | O | Stage 1부터 실행하며 mobile route screen spec과 backend contract를 함께 정리 |
| 모바일 인증 개발 | O | `orch-mobile-stage` agent 를 생성해 stage별 child role agent fan-out으로 실행 |
| 기존 mobile spec 기반 구현 | O | 해당 Stage부터 시작 |
| 특정 Stage만 재실행 필요 | O | `stage=N`으로 재실행 |
| 단순 버그 수정 | X | 개별 mobile builder/planner role 직접 호출 |
| 단일 route 소규모 수정 | X | 해당 planner/builder 직접 호출 |

