### 5.4 리뷰 체크포인트

- Stage 완료 보고의 마지막 줄에는 반드시 `📌 리뷰 요청: Stage N 결과 검토 후 다음 단계 진행 여부를 지정해 주세요.`를 포함합니다.
- Stage N+1 제안은 가능하지만 자동 실행하지 않습니다.
- 사용자가 수정 의견을 주면 영향받는 최초 Stage부터 재시작 범위를 다시 판단합니다.

### 5.5 Feedback Router / Re-entry 규칙 (Critical)

`orch-mobile-stage`는 child agent들이 서로 직접 지시하거나 다른 child agent의 파일을 임의 수정하게 두지 않습니다.
모든 finding은 `orch-mobile-stage`가 받아 route contract, backend handoff, API integration, shared screen contract, UI composition, implementation, test contract 중 어디가 owner인지 먼저 분류합니다.

#### 5.5.1 child agent 위임 프롬프트 필수 항목

child agent를 생성하거나 follow-up을 보낼 때는 최종 응답에 아래 feedback packet을 포함하도록 지시합니다.
대부분 mobile child role 문서에도 packet 필수 보고 형식이 내장되어 있으나, `orch-mobile-stage`는 위임 프롬프트에서도 다시 요구합니다.

```text
Feedback:
- status: resolved | blocked | needs-route-contract | needs-backend-contract | needs-ui | needs-test | needs-reentry
- feedback_type: none | route-contract-gap | backend-contract-gap | api-integration-gap | screen-contract-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

#### 5.5.2 packet 누락 처리

- child agent 결과에 `Feedback:` packet이 없으면 같은 agent에 `send_input`으로 1회 보완 요청합니다.
- 보완 요청에는 원래 결과 요약과 필요한 packet field를 함께 전달합니다.
- 두 번째 결과에도 packet이 없으면 mobile Stage 내부 전제 누락은 `dependency-missing`, 실행 불가 상태는 `implementation-blocker`로 간주하고 Stage를 실패 또는 review pending으로 종료합니다.
- `feedback=off`이면 follow-up을 실행하지 않고 packet 내용을 Stage 완료 보고의 review 항목으로만 남깁니다.

#### 5.5.3 분류 규칙

| feedback_type | 기본 처리 |
|---------------|-----------|
| `none` | join 후보로 수집 |
| `route-contract-gap` | `orch-mobile-screen-planner` 또는 관련 `req-mo-*` role로 re-entry |
| `backend-contract-gap` | 공통 backend `req-*` handoff로 되돌리고, 필요하면 web `orch-stage` backend flow 재시작 범위 보고 |
| `api-integration-gap` | `req-mo-api-integration-planner`로 route API Integration 계약을 갱신하고 필요 시 `fe-mo-api-integrator` follow-up |
| `screen-contract-gap` | `orch-mobile-screen-planner`를 통해 shared screen props/spec만 최소 갱신 |
| `ui-composition-gap` | `orch-mobile-screen-planner`를 통해 affected `req-mo-widget/feature/form/detail/primitive` planner만 최소 재진입 |
| `implementation-blocker` | 같은 agent가 해결 가능하면 `send_input`, role 경계 밖이면 해당 mobile builder `agent_type` 생성 |
| `test-failure` | 제품 contract 문제와 테스트 기대값 문제를 분리한 뒤 affected builder 또는 `req-mo-fe-test-planner`로 재진입 |
| `spec-drift` | route `index.spec.md` 또는 screen owner spec을 먼저 갱신한 뒤 구현/테스트 follow-up |
| `shared-file-conflict` | fan-out 쓰기를 중단하고 join 단계 single writer를 지정 |
| `dependency-missing` | 현재 Stage 전제조건이면 Stage 실패, 현재 Stage 내부 누락이면 해당 role follow-up |

#### 5.5.4 re-entry 판단

- `affected_stage`가 현재 Stage와 같으면 현재 Stage 내부 feedback loop로 처리합니다.
- `affected_stage`가 현재 Stage보다 뒤면 현재 Stage 산출물에 downstream handoff로 기록하고 다음 Stage 자동 실행은 하지 않습니다.
- `affected_stage`가 현재 Stage보다 앞이고 `reentry=review`이면 현재 Stage를 실패 또는 review pending으로 종료하고, 재시작 범위와 필요한 `stage=N`을 보고합니다.
- `affected_stage`가 현재 Stage보다 앞이고 사용자가 `reentry=auto`를 명시했으면 영향받은 최초 Stage의 owner role만 최소 범위로 실행하고, 이후 현재 Stage를 다시 검증합니다.
- backend 구현이 필요한 finding은 mobile flow 안에서 직접 backend 코드를 구현하지 않고 공통 backend handoff와 `orch-stage` 재시작 범위로 보고합니다.

#### 5.5.5 re-entry 호출 payload

| finding | 호출 payload |
|---------|-------------|
| route/screen/UI composition gap | `orch-mobile-screen-planner feedback_mode=reentry feedback_type=<route-contract-gap|screen-contract-gap|ui-composition-gap|spec-drift> affected_files=<files> affected_roles=<roles> required_action=<action>` |
| backend contract gap | 공통 backend `orch-stage` 또는 `orch-requirement feedback_mode=reentry`로 `backend-contract-gap`의 affected files/roles/action을 handoff |
| API integration gap | `req-mo-api-integration-planner` 또는 `fe-mo-api-integrator`에 route/hook/API runtime context와 `required_action`을 전달 |
| mobile QA/test failure | 제품 contract 원인을 먼저 판단한 뒤 `req-mo-fe-test-planner`와 affected QA role을 재실행 |

#### 5.5.6 follow-up 실행 순서

1. child agent 결과의 feedback packet을 수집합니다.
2. finding이 없으면 join으로 진행합니다.
3. finding이 있으면 route contract, backend contract, API integration, screen contract, UI composition, implementation, test, shared-file, dependency 중 하나로 분류합니다.
4. 같은 실행 agent가 해결 가능하면 `send_input`으로 follow-up을 전달합니다.
5. 종료된 agent 또는 다른 role 책임이면 필요한 `agent_type`으로 새 agent를 생성합니다.
6. 공유 파일 변경은 join 단계 single writer가 최종 반영합니다.
7. 동일 route slice에 대해 mobile unit 또는 E2E QA chain을 다시 실행해 feedback loop 종료 여부를 확인합니다.

#### 5.5.7 대표 feedback path

| source | path |
|--------|------|
| Stage 2 screen 구현 중 props contract gap | `fe-mo-screen-builder → orch-mobile-stage → orch-mobile-screen-planner → affected req-mo-* planner → fe-mo-screen-builder → qa-mo-testing` |
| Stage 2 widget/form/detail/feature 경계 gap | `fe-mo-widget/form/detail/feature-builder → orch-mobile-stage → orch-mobile-screen-planner → affected req-mo-* planner → affected builder → qa-mo-testing` |
| Stage 3 route 통합 중 backend endpoint gap | `fe-mo-api-integrator → orch-mobile-stage → common backend req-* handoff → orch-stage backend flow 재시작 범위 보고` |
| Stage 3 route 통합 중 API integration gap | `fe-mo-api-integrator → orch-mobile-stage → req-mo-api-integration-planner → fe-mo-api-integrator → qa-mo-testing` |
| Stage 3 route 통합 중 shared screen target 누락 | `fe-mo-page-builder → orch-mobile-stage → Stage 2 re-entry 보고 또는 reentry=auto 시 fe-mo-screen-builder follow-up` |
| Stage 4 E2E regression | `qa-mo-e2e-testing → orch-mobile-stage → affected planner/builder/test planner → qa-mo-e2e-testing` |

### 5.6 Backend Contract Gate (Critical)

새 모바일 기능이 backend persistence, API, Orval hook 또는 공통 authorization/scope 계약을 필요로 하면 Stage 1에서 backend contract를 먼저 닫아야 합니다.
`orch-mobile-stage`는 backend 구현을 직접 수행하지 않지만, backend contract gap을 UI 진행 가능 상태로 낮추지 않습니다.

#### 5.6.1 Hard Blocker

아래 중 하나라도 있으면 현재 Stage를 완료하지 말고 `needs-backend-contract` 또는 `backend-contract-gap`으로 처리합니다.

- 모바일 route가 호출해야 할 backend API contract가 없음
- Orval 생성 hook 또는 `@cocrepo/api` 경로가 없음
- Prisma model, DTO, Controller, Swagger contract 중 필요한 backend 계약이 없음
- child agent가 `status: needs-backend-contract`, `status: blocked`, `feedback_type: backend-contract-gap`, `feedback_type: api-integration-gap`을 보고함

#### 5.6.2 처리 규칙

- hard blocker가 있으면 공통 backend `orch-stage` 또는 `orch-requirement feedback_mode=reentry`로 affected files, roles, required action을 handoff합니다.
- backend 구현이 필요한 finding은 mobile flow 안에서 직접 구현하지 않고, Stage 완료 메시지를 실패 또는 review pending으로 종료합니다.
- Stage 3 route integration은 실제 API/Orval hook 연결 전까지 완료로 보고하지 않습니다.
- 사용자가 명시적으로 mock/prototype을 요청한 경우에만 mock route 또는 UI를 허용하며, 완료 메시지에 backend/API 미완료 상태를 blocker로 남깁니다.

### 5.7 Mobile Stage Work Ledger Gate (Critical)

`orch-mobile-stage`는 child agent 최종 보고만으로 Stage 완료를 선언하지 않습니다.
Stage 시작 시점에 route/domain 단위 required work item을 ledger로 고정하고, Stage 종료 직전에 실제 mobile route, `fe-mo-ui`, 테스트, backend handoff 상태를 기준으로 검증합니다.

#### 5.7.1 ledger 위치

모바일 ledger는 app-local 파일 하나를 사용합니다.

```text
apps/mobile/src/app/stage-ledger.json
```

route별 item은 `route` 필드로 구분합니다.
route `index.spec.md`와 screen owner spec은 계약 source of truth이고, `stage-ledger.json`은 Stage 1-4 required work item 원장입니다.
전역 docs 집계 파일을 만들지 않습니다.

#### 5.7.2 item schema

ledger item은 최소한 아래 필드를 포함합니다.

```json
{
  "id": "M3-ROUTE-WIRING-001",
  "stage": 3,
  "route": "/(tabs)/reservations",
  "domain": "Reservation",
  "agent_type": "fe-mo-page-builder",
  "required": true,
  "source_spec": ["apps/mobile/src/app/(tabs)/reservations/index.spec.md"],
  "expected_files": ["apps/mobile/src/app/(tabs)/reservations.tsx"],
  "verification": ["pnpm --filter mobile-app test"],
  "status": "planned",
  "blocked_reason": null
}
```

`status`는 `planned | assigned | implemented | verified | blocked`만 사용합니다.
`required=true` item은 `verified`가 아니면 Stage 완료로 닫을 수 없습니다.
backend 구현이 필요한 item은 mobile flow 안에서 임의 구현하지 않고 `blocked`로 남긴 뒤 공통 backend `orch-stage` 재시작 범위를 보고합니다.

#### 5.7.3 생성/갱신 규칙

1. Stage 실행 전 입력(`stage`, `route/routes`, `domain/domains`, `targets`)과 기존 route `index.spec.md`, screen owner spec을 읽어 required item을 ledger에 기록합니다.
2. 각 child agent 위임 프롬프트에는 담당 ledger item id를 명시합니다.
3. child agent 최종 보고에 `Feedback: none`이 있어도 담당 ledger item은 자동으로 `verified`가 되지 않습니다.
4. child agent 보고에 아래 ledger result가 없으면 join 단계에서 해당 item을 `implemented`까지만 인정하고 verifier가 실제 상태를 확인합니다.

```text
Ledger:
- completed_items: <item id list or none>
- blocked_items: <item id list or none>
- changed_files: <file list or none>
- verification: <command/result list or none>
```

#### 5.7.4 완료 verifier

Stage 완료 보고 직전 join single writer가 ledger verifier 역할을 수행합니다.
verifier는 최소한 아래를 확인합니다.

- route `index.spec.md`에 기록된 route/screen/backend/API/state/test contract 존재 여부
- shared screen target component, sibling screen spec, `packages/fe-mo-ui/src/screen/index.ts` export, `packages/fe-mo-ui/src/index.ts` root export
- `fe-mo-ui` 하위 package barrel/export와 mobile route import 연결
- API가 필요한 route의 Orval hook, backend handoff, 실제 route integration 상태
- `pnpm mobile:screen-targets:check`, mobile package unit test, route unit test, Stage 4 검증 명령 결과 또는 실행 불가 사유
- 가능하면 `pnpm stage-ledger:check -- apps/mobile/src/app/stage-ledger.json` 실행 결과

불일치가 있으면 `route-contract-gap`, `backend-contract-gap`, `api-integration-gap`, `screen-contract-gap`, `ui-composition-gap`, `test-failure`, `dependency-missing` 중 하나로 분류하고 affected `agent_type`에 재할당합니다.

#### 5.7.5 Stage별 required item 기준

| Stage | required item 예시 |
|-------|--------------------|
| 1 | route `index.spec.md`, screen component target, screen props contract, backend/API handoff, state/test contract |
| 2 | `fe-mo-ui` primitive/action/input/selection/navigation/menu/widget/feature/form/detail/screen implementation, screen spec, barrel export, package unit test |
| 3 | Expo route/layout file, shared screen wiring, API hook integration, route-local/shared state wiring, route unit test |
| 4 | Detox E2E implementation/execution, `mo-ui` and mobile app type-check/test/doctor results, route spec Verified update |

#### 5.7.6 완료 금지 조건

아래 중 하나라도 있으면 Stage 완료 메시지를 출력하지 않습니다.

- 현재 Stage의 `required=true` item이 `planned`, `assigned`, `implemented`에 남아 있음
- route `index.spec.md`의 shared screen target이 실제 component/spec/export와 맞지 않음
- route file이 shared screen 없이 page-level visual tree를 직접 조립해 Stage 3 책임을 우회함
- API/Orval/backend contract가 필요한 route가 mock/scaffold로만 구현되어 있음
- 검증 명령이 실패했는데 affected item이 `blocked` 또는 follow-up으로 분류되지 않음
- child agent가 `Feedback: none`을 보고했지만 ledger item 검증이 끝나지 않음

---

## 6. Stage 계약

### Stage 1: 모바일 기능 기획

- owner: `orch-mobile-stage` (join)
- child roles:
  - `orch-mobile-screen-planner`
  - 공통 backend contract role chain (`req-entity-planner`, `req-api-planner`, `req-app-planner`, `req-logic-planner`)
  - `req-mo-api-integration-planner`는 route 가 서버 데이터 조회/변경을 소비할 때 조건부로 사용
  - `req-mo-widget-planner`, `req-mo-feature-planner`, `req-mo-form-planner`, `req-mo-detail-planner`는 screen 내부 조합 경계가 필요할 때 `orch-mobile-screen-planner` chain 에서 조건부로 사용
  - `req-mo-state-planner`는 route-local state 계약이 필요할 때 `orch-mobile-screen-planner` chain 에서 조건부로 사용
  - `req-mo-store-planner`는 mobile shared state 가 필요할 때 `orch-mobile-screen-planner` chain 에서 조건부로 사용
- 산출물:
  - `apps/mobile/src/app/app.context.md`
  - `apps/mobile/src/app/**/index.spec.md`
  - `screen component target` / `screen props contract` / route wiring boundary
  - 필요한 shared UI target handoff
  - backend Entity/DTO/ApplicationService/Service/Repository/API/Module contract handoff(금지 계층 spec 생성 없음)
  - route `index.spec.md`의 State Ownership / State Shape 섹션(route-local/shared state가 있을 때)

- 경계:
  - 모바일 route 의 screen/layout/API/state/test 계약은 `apps/mobile/src/app/**/index.spec.md`가 owner 입니다.
  - screen visual composition 계약은 필요 시 `packages/fe-mo-ui/src/screen/[ScreenName]/[ScreenName].spec.md`가 owner 입니다.
  - backend contract 와 공통 scope/authorization invariant 는 공통 backend role 이 route `index.spec.md` 또는 handoff에 기록합니다.
  - backend 코드 구현은 이 compact flow 범위 밖이며, Stage 1 은 허용된 route `index.spec.md`와 handoff 정리까지만 책임집니다.

**완료 gate**
- 요청된 feature 범위의 mobile route screen contract와 backend contract가 생성 또는 갱신되어야 합니다.
- route kind가 `screen`인 route는 route `index.spec.md`에 `packages/fe-mo-ui/src/screen/[ScreenName]/[ScreenName].tsx` 형식의 `screen component target`을 반드시 기록해야 합니다.
- 모바일 UI/state/unit test/E2E contract와 backend 구현 대상 정보가 route `index.spec.md` 또는 handoff에 반영되어야 합니다.
- 완료 메시지를 출력한 뒤 Stage 2 를 자동 시작하지 않고 사용자 리뷰를 기다립니다.

### Stage 2: 모바일 UI 패키지 구현

- 대상 role:
  - `fe-mo-data-display-component-builder`
  - `fe-mo-feedback-component-builder`
  - `fe-mo-action-component-builder`
  - `fe-mo-input-component-builder`
  - `fe-mo-selection-component-builder`
  - `fe-mo-navigation-component-builder`
  - `fe-mo-menu-builder`
  - `fe-mo-widget-builder`
  - `fe-mo-feature-builder`
  - `fe-mo-form-builder`
  - `fe-mo-detail-builder`
  - `fe-mo-screen-builder`
  - join: `fe-mo-unit-test-builder → req-mo-fe-test-planner → qa-mo-testing`
- 대상 경로:
  - `packages/fe-mo-ui/src/data-display/**`
  - `packages/fe-mo-ui/src/feedback/**`
  - `packages/fe-mo-ui/src/action/**`
  - `packages/fe-mo-ui/src/input/**`
  - `packages/fe-mo-ui/src/selection/**`
  - `packages/fe-mo-ui/src/navigation/**`
  - `packages/fe-mo-ui/src/layout/**`
  - `packages/fe-mo-ui/src/surface/**`
  - `packages/fe-mo-ui/src/design-system/**`
  - `packages/fe-mo-ui/src/widget/**`
  - `packages/fe-mo-ui/src/feature/**`
  - `packages/fe-mo-ui/src/form/**`
  - `packages/fe-mo-ui/src/detail/**`
  - `packages/fe-mo-ui/src/screen/**`
  - `packages/fe-mo-ui/src/screen/[ScreenName]/[ScreenName].spec.md`

**완료 gate**
- 요청된 UI target 구현과 공유 barrel/index 변경이 반영되어야 합니다.
- `fe-mo-screen-builder`가 생성/수정한 shared screen은 screen spec과 export가 함께 동기화되어야 합니다.
- route `index.spec.md`에 기록된 shared screen target은 실제 component, sibling screen spec, `packages/fe-mo-ui/src/screen/index.ts` export, `packages/fe-mo-ui/src/index.ts` root export가 모두 존재해야 합니다.
- `pnpm mobile:screen-targets:check` 또는 동등한 screen target 검증을 통과해야 합니다.
- 대상 package unit test 구현과 검증 결과가 반영되어야 합니다.
- 공유 barrel/index 파일은 join 단계의 단일 writer 로만 정리되어야 합니다.
- 완료 메시지를 출력한 뒤 Stage 3 을 자동 시작하지 않고 사용자 리뷰를 기다립니다.

### Stage 3: 모바일 route 통합

- 대상 role:
  - `fe-mo-route-layout-builder`
  - `fe-mo-page-builder`
  - `fe-mo-api-integrator` (조건부)
  - `fe-mo-state-builder` (route-local state class/hook 이 필요할 때)
  - `fe-mo-store-builder` (조건부)
  - join: `fe-mo-unit-test-builder → req-mo-fe-test-planner → qa-mo-testing`
- 대상 경로:
  - `apps/mobile/src/app/**/_layout.tsx`
  - `apps/mobile/src/app/**/*.tsx`
  - route-local hooks / shared store

**완료 gate**
- 요청된 route 의 layout/screen wiring 이 구현되어야 합니다.
- Stage 2 shared screen target 이 없으면 Stage 3에서 새 visual owner를 직접 만들지 않고 Stage 2 재시작 범위로 보고해야 합니다.
- route file이 shared screen 없이 `ScreenFrame`/`ScrollView`/`View`/`Text` 중심의 page-level visual tree를 직접 조립하면 Stage 3 완료로 보고하지 않습니다.
- 조건부 API/state/store 연동, route unit test, route `index.spec.md` 변경 이력이 반영되어야 합니다.
- 단일 route 전용 상태는 `fe-mo-state-builder`, 여러 route 재사용 상태는 `fe-mo-store-builder`를 source of truth 로 사용해야 합니다.
- 완료 메시지를 출력한 뒤 Stage 4 를 자동 시작하지 않고 사용자 리뷰를 기다립니다.

### Stage 4: 모바일 검증

- 대상 role:
  - `fe-mo-e2e-builder`
  - `req-mo-fe-test-planner`
  - `qa-mo-e2e-testing`
- 기본 검증 명령:
  - `pnpm --filter @cocrepo/mo-ui test`
  - `pnpm --filter @cocrepo/mo-ui type-check`
  - `pnpm --filter mobile-app test`
  - `pnpm --filter mobile-app type-check`
  - `pnpm --filter mobile-app test:e2e`
  - `pnpm --filter mobile-app doctor`
- 검증 결과는 route `index.spec.md` 테스트 섹션과 stage 완료 보고에 반영합니다.

**완료 gate**
- 검증 명령 결과가 수집되어 stage 완료 보고에 반영되어야 합니다.
- 필요한 route `index.spec.md` 테스트 섹션과 변경 이력이 최신이어야 합니다.
- E2E 구현/실행 결과와 `Verified` 상태가 반영되어야 합니다.
- Stage 4 완료 후에도 후속 Stage 를 가정하지 않고 사용자 리뷰를 기다립니다.

---

## 7. 실패 처리

- child role 이 없으면 즉시 `BLOCKED: missing mobile child role <name>`으로 보고합니다.
- `apps/mobile`에 필요한 runtime dependency 가 없으면 해당 Stage 에서 명시적으로 차단합니다.
- route `index.spec.md`가 없으면 Stage 1에서 생성하고 계속 진행할 수 있습니다.
- Stage 1 에서 backend contract 정리가 필요한데 `domain`/`domains` 또는 요구사항이 없으면 즉시 차단합니다.

---

## 8. Stage 완료 / 실패 형식

### 8.1 완료 메시지 최소 형식

```text
✅ Stage N 완료: <단계명>

📁 핵심 산출물:
   - ...

🧪 검증 결과:
   - ...

핵심 의도: <다음 Stage가 필요한 이유 한 문장>
📌 다음 단계: Stage N+1 (...)
📌 리뷰 요청: Stage N 결과 검토 후 다음 단계 진행 여부를 지정해 주세요.
```

### 8.2 실패 메시지 최소 형식

```text
❌ Stage N 실패: <단계명>

원인:
- ...

영향 범위:
- ...

권장 조치:
- ...
```

### 8.3 종료 규칙

- 위 완료/실패 메시지를 출력한 시점에 현재 호출을 종료합니다.
- 완료 메시지 뒤에 다음 Stage 를 위한 추가 agent 실행, 명령 실행, 파일 수정 계획을 이어서 수행하지 않습니다.
- 사용자 응답이 오기 전까지 현재 Stage 를 review pending 상태로 간주합니다.

