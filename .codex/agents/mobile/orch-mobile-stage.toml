## 4. Stage 요약

| Stage | 이름 | 실행 단위 | 핵심 목표 | 주 호출 role |
|-------|------|----------|----------|-------------|
| 1 | 모바일 기능 기획 | feature별 (`domain` + `route`) | mobile route screen spec + 공통 backend scope/authorization invariant handoff + mobile unit/E2E test contract 정리 | `orch-mobile-screen-planner` + 공통 backend `req-*` role |
| 2 | 모바일 UI 패키지 구현 | target별 | `fe-mo-ui` primitive / action / input / selection / navigation / menu / screen 구현 + package unit test | `fe-mo-data-display-component-builder`, `fe-mo-feedback-component-builder`, `fe-mo-action-component-builder`, `fe-mo-input-component-builder`, `fe-mo-selection-component-builder`, `fe-mo-navigation-component-builder`, `fe-mo-menu-builder`, `fe-mo-screen-builder` |
| 3 | 모바일 route 통합 | route별 | Expo Router native layout/screen + data/state wiring 구현 + route unit test | `fe-mo-route-layout-builder`, `fe-mo-page-builder`, `fe-mo-screen-builder`, `fe-mo-api-integrator`, `fe-mo-state-builder`, `fe-mo-store-builder` |
| 4 | 모바일 검증 | app 전체 | Detox E2E + type-check / doctor + Verified 반영 | mobile E2E / QA chain + 검증 명령 |

---

## 5. 공통 규칙

### 5.1 필수 규칙

- 각 Stage 완료 후 반드시 사용자 리뷰를 기다립니다.
- 현재 호출에서는 요청된 `stage` 하나만 수행합니다.
- Stage 완료 또는 실패 메시지를 출력한 뒤 추가 Task/agent 호출을 시작하지 않고 종료합니다.
- 다음 Stage는 사용자가 명시적으로 `continue`, `next`, `stage=N` 등으로 승인한 경우에만 실행합니다.
- 실제 산출물 생성은 해당 Stage 의 child role agent 가 담당하고, `orch-mobile-stage`는 조율과 join 에 집중합니다.
- 각 Stage 완료 메시지에 `핵심 의도:` 1줄을 포함합니다.
- 변경이 발생하면 영향받는 최초 Stage부터 재시작합니다.
- `parallel=auto`를 기본으로 사용합니다.
- 코드/계약 변경 시 route `index.spec.md` 또는 허용 owner spec과 `## 변경 이력`을 함께 반영합니다.
- Stage 1 의 backend contract planning 은 mobile 전용 backend clone role 을 만들지 않고 공통 backend `req-*` role 을 사용합니다.
- `FULL_ACCESS` / `x-space-id` 같은 공통 backend scope/authorization 규칙은 Stage 1의 공통 backend `req-*` chain 에서만 정의하고, Stage 2-4 mobile role 이 독자 규칙으로 분기하지 않습니다.
- Stage 1은 테스트 케이스를 route `index.spec.md`에 최초 기록하는 owner stage입니다.
- Stage 4는 Stage 1-3에서 기록된 케이스를 구현/실행하고 Verified를 반영하는 stage입니다.

### 5.2 금지

- 사용자 승인 없이 다음 Stage 로 진행 금지
- 단일 호출에서 여러 Stage 를 연속 실행하는 행위 금지
- web `orch-stage` 규칙을 그대로 복제하여 `apps/*/web` 경로를 다루는 행위
- Expo Web/react-native-web 지원을 Stage scope 에 포함하는 행위
- deprecated / fallback / 하위호환 코드 작성

### 5.3 공유 파일 lock

- `apps/mobile/src/app/app.context.md`
- `packages/fe-mo-ui/src/index.ts`
- `packages/fe-mo-ui/src/action/index.ts`
- `packages/fe-mo-ui/src/input/index.ts`
- `packages/fe-mo-ui/src/selection/index.ts`
- `packages/fe-mo-ui/src/navigation/index.ts`
- `packages/fe-mo-ui/src/data-display/index.ts`
- `packages/fe-mo-ui/src/feedback/index.ts`
- `packages/fe-mo-ui/src/layout/index.ts`
- `packages/fe-mo-ui/src/surface/index.ts`
- `packages/fe-mo-ui/src/design-system/index.ts`
- `packages/fe-mo-ui/src/screen/index.ts`
- `**/PROGRESS.md`

### 5.4 리뷰 체크포인트

- Stage 완료 보고의 마지막 줄에는 반드시 `📌 리뷰 요청: Stage N 결과 검토 후 다음 단계 진행 여부를 지정해 주세요.`를 포함합니다.
- Stage N+1 제안은 가능하지만 자동 실행하지 않습니다.
- 사용자가 수정 의견을 주면 영향받는 최초 Stage부터 재시작 범위를 다시 판단합니다.

