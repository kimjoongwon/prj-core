## 5. 공통 규칙

### 5.1 필수 규칙

- 각 Stage 완료 후 반드시 사용자 리뷰를 기다립니다.
- 현재 호출에서는 요청된 `stage` 하나만 수행합니다.
- Stage 완료 또는 실패 메시지를 출력한 뒤 추가 Task/agent 호출을 시작하지 않고 종료합니다.
- 다음 Stage는 사용자가 명시적으로 `continue`, `next`, `stage=N` 등으로 승인한 경우에만 실행합니다.
- 실제 산출물 생성은 해당 Stage 의 child role agent 가 담당하고, `orch-mobile-stage`는 조율과 join 에 집중합니다.
- Stage 완료 전 child agent finding을 해결하기 위한 follow-up은 현재 Stage 실행의 일부로 간주합니다.
- 각 Stage 완료 메시지에 `핵심 의도:` 1줄을 포함합니다.
- 변경이 발생하면 영향받는 최초 Stage부터 재시작합니다.
- `parallel=auto`를 기본으로 사용합니다.
- Stage 시작 전 mobile `stage-ledger.json`을 생성/갱신하고, Stage 완료 전 ledger verifier를 통과해야 합니다.
- child agent의 `Feedback: none`은 완료 조건이 아니라 ledger verifier의 입력일 뿐입니다.
- 코드/계약 변경 시 route `index.spec.md` 또는 허용 owner spec과 `## 변경 이력`을 함께 반영합니다.
- Stage 1 의 backend contract planning 은 mobile 전용 backend clone role 을 만들지 않고 공통 backend `req-*` role 을 사용합니다.
- `FULL_ACCESS` / `x-space-id` 같은 공통 backend scope/authorization 규칙은 Stage 1의 공통 backend `req-*` chain 에서만 정의하고, Stage 2-4 mobile role 이 독자 규칙으로 분기하지 않습니다.
- Stage 1은 테스트 케이스를 route `index.spec.md`에 최초 기록하는 owner stage입니다.
- Stage 4는 Stage 1-3에서 기록된 케이스를 구현/실행하고 Verified를 반영하는 stage입니다.

### 5.2 금지

- 사용자 승인 없이 다음 Stage 로 진행 금지
- 단일 호출에서 여러 Stage 를 연속 실행하는 행위 금지
- web `orch-stage` 규칙을 그대로 복제하여 `apps/*/web` 경로를 다루는 행위
- Expo Web/react-native-web 지원을 Stage scope 에 포함하는 행위
- deprecated / fallback / 하위호환 코드 작성
- backend/API/Orval 계약이 필요한 모바일 기능을 mock 또는 scaffold 화면만으로 완료 보고하는 행위

