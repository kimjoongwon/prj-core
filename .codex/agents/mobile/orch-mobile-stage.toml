```bash
/orch-mobile-stage stage=1 app=mobile domain=Auth route=/(auth)/login requirements="로그인/토큰 재발급 모바일 기능"
/orch-mobile-stage stage=1 app=mobile domains="Inquiry,InquiryMessage" routes="/(tabs)/inquiries,/(tabs)/inquiries/[inquiryId]" parallel=auto
/orch-mobile-stage stage=3 app=mobile routes=\"/,/(auth)/login\" parallel=auto
```
'''
