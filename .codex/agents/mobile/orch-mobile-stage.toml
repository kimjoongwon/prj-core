## 3. 입력 해석

### 3.1 기본 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| `stage` | ✅ | 1~4 |
| `app` | ✅ | 기본값 `mobile` |
| `domain` | △ | Stage 1에서 backend contract 정리가 필요할 때 사용할 aggregate/domain 이름 |
| `domains` | △ | Stage 1에서 다중 backend domain contract를 함께 기획할 때 사용 |
| `route` | △ | 단일 Expo Router native route |
| `routes` | △ | 다중 Expo Router native route 목록 |
| `requirements` | △ | Stage 1에서 mobile feature 와 backend contract 를 함께 설명하는 요구사항 |
| `parallel` | △ | `off` / `auto` / `force`, 기본 `auto` |
| `maxConcurrency` | △ | 동시 실행 상한, 기본 `3` |
| `failPolicy` | △ | `fail-fast` / `continue`, 기본 `fail-fast` |

### 3.2 route 해석

- route 는 Expo Router native runtime 기준 세그먼트 경로로 해석합니다.
- 예: `/`, `/(auth)`, `/(auth)/login`, `/(tabs)/home`
- `_layout.tsx`가 route shell, `index.tsx` 또는 해당 screen file 이 콘텐츠 owner 입니다.

