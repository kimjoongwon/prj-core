## 6. 품질 체크리스트

- [ ] Store가 도메인 단위로 정의되었는가?
- [ ] 2개 이상 페이지/도메인 재사용 근거가 있는가?
- [ ] 상태가 최소화되었는가? (불필요한 상태 제거)
- [ ] 액션이 상태 변경만 담당하는가? (API 호출 없음)
- [ ] 계산값이 올바르게 정의되었는가?
- [ ] Store명이 명명 규칙을 따르는가?

