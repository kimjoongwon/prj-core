### 출력 (route `page.spec.md` 또는 fe-ui Feature/Widget spec의 State Contract 섹션)

```markdown
# MemberStore 기획서

## 개요
- 도메인: Member
- Store명: MemberStore
- 생성일: 2026-02-18

## 상태 (State)

| 이름 | 타입 | 초기값 | 설명 |
|------|------|--------|------|
| members | Member[] | [] | 회원 목록 |
| selectedMemberId | string \| null | null | 선택된 회원 ID |
| searchQuery | string | '' | 검색어 |
| statusFilter | MemberStatus \| null | null | 상태 필터 |
| roleFilter | MemberRole \| null | null | 역할 필터 |
| isLoading | boolean | false | 로딩 상태 |

## 액션 (Action)

| 메서드 | 파라미터 | 설명 |
|--------|----------|------|
| setMembers | members: Member[] | 회원 목록 설정 |
| addMember | member: Member | 회원 추가 |
| updateMember | id: string, data: Partial<Member> | 회원 정보 수정 |
| removeMember | id: string | 회원 삭제 |
| setSelectedMemberId | id: string \| null | 선택 회원 설정 |
| setSearchQuery | query: string | 검색어 설정 |
| setStatusFilter | status: MemberStatus \| null | 상태 필터 설정 |
| setRoleFilter | role: MemberRole \| null | 역할 필터 설정 |
| setLoading | loading: boolean | 로딩 상태 설정 |
| resetFilters | - | 모든 필터 초기화 |

## 계산값 (Computed)

| 이름 | 타입 | 설명 |
|------|------|------|
| filteredMembers | Member[] | 필터가 적용된 회원 목록 |
| selectedMember | Member \| undefined | 선택된 회원 |
| activeMembers | Member[] | 활성 상태 회원만 |
| memberCount | number | 전체 회원 수 |
| filteredCount | number | 필터된 회원 수 |
```
