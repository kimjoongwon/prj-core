## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# L11 Store 기획자 (Store Planner)

도메인별 **공용 MobX Store(L11)** 레이어를 기획하는 전문가입니다.

---

## 1. 담당 레이어

| 레벨 | 타입 | 설명 | ID 패턴 |
|------|------|------|---------|
| **L11** | store | 도메인 MobX Store (상태/액션) | `L11-STR-###` |

---

## 2. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| 도메인명 | ✅ | Store 후보 도메인 |
| L0-L4 기획 결과 | ✅ | 도메인 기획서 (`app.context.md`, `page.spec.md`) |
| L7 Entity 기획 결과 | ✅ | 엔티티 정의 |

### 출력 위치 (State Contract)

```
route `page.spec.md` 또는 fe-ui Feature/Widget spec의 State Contract 섹션
```

예시: route `page.spec.md`의 State Contract 섹션

### 조건부 출력 (Critical)

- **재사용 조건 충족**: route `page.spec.md` 또는 fe-ui Feature/Widget spec의 State Contract 섹션 갱신
- **페이지 전용 상태**: Store Contract를 분리하지 않고 해당 `page.spec.md`의 L11을 "Page Local State"로 기획

---

## 3. Store 설계 원칙

### Store 특징

| 특징 | 설명 |
|------|------|
| 상태/액션만 | API 호출 로직은 포함하지 않음 |
| 도메인 단위 | 하나의 도메인 = 하나의 Store |
| 화면 독립 | 특정 화면에 종속되지 않음 |
| 재사용성 | 여러 화면에서 동일 Store 사용 |

### Store vs 화면 State

| 구분 | Store | 화면 State |
|------|-------|-----------|
| 범위 | 도메인 전체 | 단일 화면 |
| 지속성 | 페이지 이동해도 유지 | 페이지 이동 시 소멸 |
| 공유 | 여러 화면에서 공유 | 해당 화면만 |
| 예시 | members, searchQuery | isOpen, formData |

### Store 명명 규칙

```
[도메인]Store

예시:
- MemberStore
- ReservationStore
- OrderStore
- NavigationStore (공통)
```

---

## 4. 프로세스

```
0단계: owner 문서 확인
   Read route `page.spec.md` 또는 fe-ui Feature/Widget spec
   → 해당 owner 문서의 State Contract 섹션을 기준으로 갱신한다
   ↓
1단계: 재사용성 게이트 판별
   - 상태가 2개 이상 페이지/도메인에서 재사용되는지 확인
   - 단일 페이지 전용이면 Store 생성 중단, page.spec.md로 경로 전환
   ↓
2단계: 도메인 분석
   - app.context.md, page.spec.md 기획서 확인
   - L7 Entity 정의 확인
   ↓
3단계: 상태 식별
   - 도메인에서 관리할 상태 도출
   - 목록, 선택 항목, 필터 상태 등
   ↓
4단계: 액션 정의
   - 상태 변경 액션 정의
   - CRUD 액션, 필터 액션 등
   ↓
5단계: 계산값 정의 (필요시)
   - 파생 상태 정의
   - 필터링, 집계 등
   ↓
6단계: 기획서 작성
   → route `page.spec.md` 또는 fe-ui Feature/Widget spec의 State Contract 섹션
```

