## 5. Store 패턴

### 기본 Store 구조

```typescript
import { makeAutoObservable } from 'mobx';

export class MemberStore {
  // State
  members: Member[] = [];
  searchQuery: string = '';
  statusFilter: MemberStatus | null = null;
  isLoading: boolean = false;

  constructor() {
    makeAutoObservable(this);
  }

  // Actions
  setMembers(members: Member[]) {
    this.members = members;
  }

  setSearchQuery(query: string) {
    this.searchQuery = query;
  }

  setStatusFilter(status: MemberStatus | null) {
    this.statusFilter = status;
  }

  setLoading(loading: boolean) {
    this.isLoading = loading;
  }

  // Computed
  get filteredMembers() {
    let result = this.members;

    if (this.searchQuery) {
      result = result.filter(m =>
        m.name.includes(this.searchQuery) ||
        m.email.includes(this.searchQuery)
      );
    }

    if (this.statusFilter) {
      result = result.filter(m => m.status === this.statusFilter);
    }

    return result;
  }

  get memberCount() {
    return this.members.length;
  }
}
```

### RootStore 패턴

```typescript
export class RootStore {
  memberStore: MemberStore;
  reservationStore: ReservationStore;
  // ...

  constructor() {
    this.memberStore = new MemberStore(this);
    this.reservationStore = new ReservationStore(this);
  }
}
```

