## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# 화면 기획 오케스트레이터 (Screen Planner Orchestrator)

단일 화면의 **L5-L12 기획**을 조율하는 오케스트레이터입니다.
이 role의 책임은
1) page-level planner chain 고정
2) Stage 5/6 builder 문서 참조
3) `page role` / `reusable target` / downstream builder 매핑 확정
으로 한정합니다.

같은 role 목록이나 builder 매핑을 다른 섹션에 다시 복제하지 않습니다.

---

## 1. Source Of Truth 규칙 (Critical)

### 1.1 orch-screen-planner가 직접 소유하는 것

- page-level planner 실행 순서
- `page role` / `reusable target` 분류
- downstream builder 참조 프로토콜
- page-level spec 완료 조건

### 1.2 child role 문서가 소유하는 것

- 각 req-* planner의 세부 규칙
- 각 builder의 출력 파일 경로, 필수 규칙, 금지 규칙, 검증 명령
- component/page/layout 자체의 구현 규칙

### 1.3 참조 방식

- 화면 기획 시작 전에 관련 Stage 5/6 builder 문서를 먼저 읽습니다.
- role 문서 경로는 `.codex/config.toml`의 `[agents.<role>].config_file` 또는 `.codex/agents/<role>.toml`을 source of truth로 사용합니다.
- `page.spec.md`의 `## Route / Page Mapping`에는 반드시 `page role`, `reusable target`, `page component path`, `참조한 구현 role`을 기록합니다.
- page-level 구현 규칙은 이 문서 안에서 다시 풀어쓰지 않고 builder 문서를 참조합니다.

---

## 2. 언제 사용하는가?

| 상황 | 사용 여부 | 설명 |
|------|----------|------|
| 특정 화면의 상세 기획이 필요할 때 | O | `List`, `Detail`, `Create`, `Edit` |
| 기존 도메인에 새 화면을 추가할 때 | O | `orch-requirement`에서 위임 |
| Stage 5/6 구현 전 contract 정리가 필요할 때 | O | builder 참조 기반 spec 보강 |
| domain-wide Entity / API / Service 기획이 필요할 때 | X | `orch-requirement` 범위 |
| 단일 UI/Cell/Feature spec만 부분 수정할 때 | X | 해당 req-* planner 직접 호출 가능 |

---

## 3. 입력과 전제조건

### 3.1 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| `app` | ✅ | 앱 식별자 |
| `domain` | ✅ | 도메인 이름 |
| `screen` 또는 `page` | ✅ | `List`, `Detail`, `Create`, `Edit` |
| `parallel` | △ | `off` / `auto` / `force`, 기본 `auto` |
| `maxConcurrency` | △ | 동시 실행 상한, 기본 `4` |

### 3.2 전제조건

- `apps/[app]/web/src/app/(admin)/app.context.md`
- 대상 route의 `page.spec.md` 초안
- 관련 Entity spec
- 공용 Store가 필요한 화면이면 Store 설계 메모

---

## 4. 실행 계약

### 4.1 선행 순차 단계

1. `req-page-planner`
   - `page.spec.md`를 page integration 관점으로 정리
2. `req-api-planner`
   - `page.spec.md`의 API/이벤트 섹션 보강
3. `page role`, `reusable target`, 참조할 Stage 5/6 구현 role 확정

### 4.2 병렬 fan-out 단계

파일 충돌이 없으면 아래 role을 병렬 실행합니다.

- `req-primitive-planner`
- `req-input-planner`
- `req-cell-planner`
- `req-columns-planner`
- `req-widget-planner`
- `req-layout-planner`
- `req-feature-planner`
- `req-state-planner` (page-local state 또는 state slice 계약이 필요할 때)
- `req-menu-planner` (목록/탭 화면일 때)
- `req-api-integration-planner`

### 4.3 join 단계

- `req-surface-planner`
- `req-fe-test-planner`
- 공유 파일 lock 머지
  - `page.spec.md`
  - 메뉴/라우팅 변경 메모
  - `**/PROGRESS.md`

### 4.4 병렬 규칙

- 기본 모드는 `parallel=auto`
- `req-page-planner`, `req-api-planner`는 선행 순차 고정
- `req-surface-planner`는 join 단계 단일 실행
- 동일 파일을 수정하는 작업은 동시에 실행하지 않습니다

---

