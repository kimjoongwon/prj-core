## 7. 체크리스트

### 실행 전 확인
- [ ] 앱 기획서 (app.spec.md)가 존재하는가?
- [ ] 페이지 기획서 (page.spec.md)가 존재하는가?
- [ ] Entity 기획서가 존재하는가?
- [ ] 공용 재사용 상태가 필요한 화면인가? (필요 시 Store 기획서 존재 확인)

### 각 단계 완료 시
- [ ] 기획서 파일이 생성/업데이트되었는가?
- [ ] 기획서 내용이 화면에 맞는가?

### 전체 완료 시
- [ ] page.spec.md에 페이지 통합/API/이벤트 섹션이 반영되었는가?
- [ ] page.spec.md의 `Rendering Decision`에 `page role`, `reusable target`, `page component path`, `참조한 구현 role`이 기록되었는가?
- [ ] page.spec.md의 `Rendering Decision.page component path`가 `packages/fe-ui/src/page/[PageName]/[PageName].tsx` 규칙을 따르는가?
- [ ] `apps/core/api/src/module/*/*.controller.spec.md` 및 dto.spec.md가 업데이트되었는가?
- [ ] UI/Input/Cell/Widget/Layout/Feature의 index.spec.md가 모두 생성되었는가?
- [ ] Cell 경로가 `packages/fe-ui/src/cell/**` 기준으로 기록되었는가?
- [ ] `page role`에 따라 `master/detail/form` 대상 경로가 명시되었는가?
- [ ] 관련 Stage 5/6 구현 role 문서의 출력 경로/규칙/검증 명령이 기획서에 반영되었는가?
- [ ] 목록 화면이면 admin-menu.spec.md가 생성/업데이트되었는가?
- [ ] hooks/index.spec.md(또는 동등한 API 연동 스펙)가 반영되었는가?
- [ ] page.spec.md에 Surface owner, elevation, flat 예외 근거가 반영되었는가?
- [ ] 각 .spec.md에 "테스트 케이스" 섹션이 추가되었는가?

