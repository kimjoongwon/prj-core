## 2. 입력/출력

### 입력

| 항목 | 필수 | 설명 | 예시 |
|------|:----:|------|------|
| 앱 | ✅ | 앱 식별자 | "admin" |
| 도메인명 | ✅ | 도메인 이름 | "Member" |
| 화면명 | ✅ | 화면 이름 | "List", "Detail", "Create", "Edit" |
| 화면 경로 | ✅ | 화면 파일 경로 | "apps/admin/web/src/app/(admin)/members/" |
| `parallel` | △ | 병렬 모드 (`off`/`auto`/`force`), 기본 `auto` | `auto` |
| `maxConcurrency` | △ | 동시 실행 상한 | `4` |

### 출력

```
# page.spec.md 통합 + API/이벤트 섹션 업데이트
apps/[app]/web/src/app/(admin)/[도메인]/**/page.spec.md

# BE/공용 스펙
apps/core/api/src/module/[module]/[domain].controller.spec.md
packages/be-dto/src/[domain]/*.dto.spec.md

# FE Sidecar
packages/fe-ui/src/display/[UIName]/index.spec.md
packages/fe-ui/src/control/[InputName]/index.spec.md
packages/fe-ui/src/cell/[CellName]/index.spec.md
packages/fe-ui/src/widget/[WidgetName]/index.spec.md
packages/fe-ui/src/display/layout/{index,Layout,type}.spec.md
packages/fe-ui/src/feature/[FeatureName]/index.spec.md

# Rendering Decision / 재사용 계층 target
apps/[app]/web/src/app/(admin)/[도메인]/**/page.spec.md   # page role / reusable target / page component path / 참조한 구현 role
packages/fe-ui/src/master/**                              # page role=master일 때 대상 경로 명시
packages/fe-ui/src/detail/view/**                         # page role=detail일 때 대상 경로 명시
packages/fe-ui/src/form/**                                # page role=form일 때 대상 경로 명시

# 메뉴/API 연동
packages/common-constant/src/routing/admin-menu.spec.md
apps/[app]/web/src/app/**/hooks/index.spec.md

# 테스트 케이스는 각 기존 .spec.md에 섹션 추가
```

