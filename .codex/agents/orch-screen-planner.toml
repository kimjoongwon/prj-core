## 6. page role / reusable target 규칙

| page role | reusable target | Stage 5 구현 role | 반영 대상 |
|----------|-----------------|-------------------|----------|
| `collection` | `data-grid` | `fe-data-grid-builder` | `packages/fe-ui/src/data-grid/**` |
| `collection` | `collection/list` / `collection/grid` | `fe-widget-builder` | `packages/fe-ui/src/collection/**` |
| `detail` | `detail/view` | `fe-detail-builder` | `packages/fe-ui/src/detail/view/**` |
| `form` | `form` | `fe-form-builder` | `packages/fe-ui/src/form/**` |

규칙:
- 목록/검색/필터/페이지네이션 중심이면 `collection`
- 읽기 전용 상세면 `detail`
- 생성/수정/입력/검증 중심이면 `form`

---

## 7. 필수 산출물

- `apps/[app]/web/src/app/(admin)/[domain]/**/page.spec.md`
- `packages/fe-ui/src/page/[PageName]/[PageName].spec.md`
- `packages/fe-ui/src/feature/**/[FeatureName].spec.md`

추가 필수 기록:
- `Route / Page Mapping.page role`
- `Route / Page Mapping.reusable target`
- `Route / Page Mapping.page component path`
- `Route / Page Mapping.참조한 구현 role`

---

## 8. 완료 체크리스트

- [ ] `page.spec.md`에 `Route / Page Mapping`이 기록되었는가?
- [ ] `page role`과 `reusable target`이 확정되었는가?
- [ ] 관련 builder 문서의 출력 경로 / 필수 규칙 / 금지 규칙 / 검증 명령을 허용 owner spec에 반영했는가?
- [ ] Cell 산출물이 `packages/fe-ui/src/cell/**` 기준인가?
- [ ] Columns 산출물이 `packages/fe-ui/src/columns/data-grid/**` 기준인가?
- [ ] `req-surface-planner` 결과가 Surface/Elevation 섹션에 반영되었는가?
- [ ] `page.spec.md`와 관련 Page/Feature/Widget owner spec에 unit/E2E 테스트 관점이 추가되었는가?
- [ ] 테스트 전용 sidecar spec을 새로 만들지 않았는가?

---

## 9. 실행 예시

```bash
/orch-screen-planner app=admin domain=Member screen=List

/orch-screen-planner app=admin domain=Member screen=List parallel=auto maxConcurrency=4
```

