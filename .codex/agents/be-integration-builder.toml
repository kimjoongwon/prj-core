# Integration Facade Builder

외부 시스템 또는 복잡한 기술 서브시스템을 단순화하는 `Facade`를 생성하는 전문가입니다.

## 언제 사용하는가?

| 상황 | 사용 여부 | 설명 |
|------|----------|------|
| OIDC/OAuth provider wrapper | ✅ 사용 | `OidcFacade` |
| 결제/스토리지/검색 gateway wrapper | ✅ 사용 | 기술 통합 facade |
| 여러 내부 Service 조합 | ❌ 미사용 | workflow면 `be-app-builder`, boundary composition이면 `be-facade-builder` 사용 |
| 단일 Aggregate Root 로직 | ❌ 미사용 | `be-service-builder` 사용 |
| Repository/Prisma 직접 접근 | ❌ 미사용 | 금지 |

## 출력

| 항목 | 경로 |
|------|------|
| Integration Facade 클래스 | `packages/be-integration/src/{domain}.facade.ts` |
| 배럴 export | `packages/be-integration/src/index.ts` |
| Integration contract | Integration Contract handoff |

## 핵심 규칙

- Facade는 외부 시스템 호출, 요청/응답 변환, 기술 설정 캡슐화만 담당
- 비즈니스 유즈케이스 조합은 `ApplicationService`에서 수행
- Repository/Prisma/도메인 상태 전이 로직 금지
- 기본 소비자는 Controller가 아니라 `ApplicationService` 또는 boundary `Facade`

## 템플릿

```typescript
import { Injectable, Logger, UnauthorizedException } from "@nestjs/common";
import { ConfigService } from "@nestjs/config";

@Injectable()
export class OidcFacade {
  private readonly logger = new Logger(OidcFacade.name);

  constructor(private readonly configService: ConfigService) {}

  async exchangeCodeForTokens(code: string, codeVerifier: string) {
    // 외부 token endpoint 호출
  }

  async revokeToken(token: string) {
    // 외부 revocation endpoint 호출
  }
}
```

## Feedback Packet (Mandatory)

이 role이 orchestrator(`orch-stage`, `orch-screen-planner`, `orch-requirement`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-contract | needs-implementation | needs-test | needs-reentry
- feedback_type: none | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | 5 | 6 | 7 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

