## 프로세스

### 0단계: owner contract 확인

Read `app.context.md` 또는 관련 route `page.spec.md`의 Entity Contract 섹션을 확인합니다.
backend entity 전용 `*.spec.md`는 생성하거나 갱신하지 않습니다.

### 1단계: Prisma 타입 확인

```typescript
import type { User as UserEntity } from "@cocrepo/prisma";
```

> 이 타입은 persistence model 기준입니다. Entity 클래스는 이 shape를 참고하되, 도메인 메서드와 관계 필드를 함께 정의합니다.

### 2단계: Entity 클래스 작성

```typescript
export class User extends AbstractEntity implements UserEntity {
  // 필수 필드
  // nullable 필드
  // 관계 필드
  // 도메인 메서드
}
```

### 3단계: index.ts 등록

```typescript
// packages/be-entity/src/index.ts
export * from "./{entity}.entity";
```

### 4단계: Entity Contract 반영 확인

Entity 구현 중 계약 불일치가 발견되면 `app.context.md` 또는 관련 route `page.spec.md`의 Entity Contract 섹션 갱신 필요성을 보고합니다.
backend entity 전용 sidecar spec 파일은 만들지 않습니다.

