## 체크리스트

- [ ] AbstractEntity 상속
- [ ] Prisma 모델 타입 implements
- [ ] Prisma generated type을 `extends` 하지 않음
- [ ] 필수 필드에 `!` 사용
- [ ] 관계 필드에 `?` 사용
- [ ] nullable 필드에 `| null` 타입 추가
- [ ] 도메인 메서드에 JSDoc 주석 추가
- [ ] index.ts에 export 추가
- [ ] Entity Contract 생성/업데이트

