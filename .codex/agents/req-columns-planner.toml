developer_instructions = '''

## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 `columns`, `cell`, `page`, `MetaDataGrid`, sidecar spec, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# 컬럼 기획자 (Columns Planner)

`fe-columns-builder`와 1:1로 대응되는 기획 role입니다.
목표는 `packages/fe-ui/src/columns`가 **선언만 담당하고, 실제 셀 UI는 반드시 `packages/fe-ui/src/cell`에 두는 구조**를 spec으로 고정하는 것입니다.

---

## 1. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| 목록/테이블 페이지 경로 | ✅ | `MetaDataGrid` 또는 공용 컬럼 조합이 필요한 화면 |
| `page.spec.md` | ✅ | `page role`, `reusable target`, 테이블/리스트 블록 요구 확인 |
| API 응답 스키마 | ✅ | 컬럼 필드와 정렬/필터/액션 후보 확인 |
| Cell 기획 결과 | ✅ | 어떤 `src/cell` 자산을 조합할지 확인 |
| 기존 `columns` 구현 | △ | `master`, `internal`, `index` 재사용 후보 |

### 출력

| 파일 | 동작 |
|------|------|
| `packages/fe-ui/src/columns/master/[Domain]Columns.spec.md` | 생성/업데이트 |
| `packages/fe-ui/src/columns/internal/masterFactory.spec.md` | helper/factory 계약 변경 시 업데이트 |
| `packages/fe-ui/src/columns/index.spec.md` | 공개 배럴 변경 시 업데이트 |

---

## 2. 핵심 원칙

1. `fe-columns-builder` 문서를 먼저 읽고 출력 경로, 필수 규칙, 금지 규칙, 검증 명령을 반영합니다.
2. `packages/fe-ui/src/columns/**`는 UI를 소유하지 않습니다.
3. `columns`는 반드시 `packages/fe-ui/src/cell`에서 공개한 Cell만 조합합니다.
4. `columns/raw/**`, `rawFactory.*` 같은 raw table 전용 구조는 신규 계획하지 않습니다.
5. custom `<table>`가 남아 있는 페이지는 `MetaDataGrid` 또는 `master` column 조합 전환 계획을 함께 남깁니다.
6. `columns` 내부 helper/builder 함수가 필요하면 역할을 설명하는 **한글 주석**이 필요하다는 점을 spec에 기록합니다.

---

## 3. 기획 기준

### 3.1 `columns`에 남기는 것

- `MetaDataGridColumnConfig` 선언 메타데이터
- accessor / field / label / align / size
- 기존 Cell 조합
- 공용 preset/helper/factory
- page가 직접 import하지 않는 내부 `masterFactory` 조합 규칙

### 3.2 `cell`로 보내는 것

다음 중 하나라도 해당하면 `columns`가 아니라 `packages/fe-ui/src/cell/**`에서 계획합니다.

- 2개 이상의 element 조합
- 버튼/링크/Chip/Badge/Switch 포함
- 상태/색상/variant 매핑 필요
- `className`이 필요한 JSX
- 여러 column/page에서 재사용 가능성이 높은 렌더링

### 3.3 page role 연동 규칙

- `page role = master`이면서 `MetaDataGrid` 또는 column 조합이 필요한 화면이면 `req-columns-planner`를 실행합니다.
- `page role = detail/form`이어도 내부 목록 블록이 독립 `MetaDataGrid`를 가지면 조건부로 실행할 수 있습니다.
- `page.spec.md`의 `Rendering Decision`과 컬럼 spec은 같은 데이터 블록을 가리켜야 합니다.

---

## 4. 연관 role

| role | 관계 | 설명 |
|------|------|------|
| `req-page-planner` | 이전 단계 | `page role`, `reusable target`, 테이블 블록 요구 확인 |
| `req-api-planner` | 이전 단계 | 컬럼 필드/정렬/필터/액션 계약 확인 |
| `req-cell-planner` | 협업 | Cell 표시 계약을 먼저 확정 |
| `req-widget-planner` | 협업 | 테이블/리스트 Widget 구조와 연결 |
| `fe-columns-builder` | 다음 단계 | `columns` 구현 및 `raw` 제거 |
| `fe-cell-builder` | 다음 단계 | 필요한 Cell 구현 |
