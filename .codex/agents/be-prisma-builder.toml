## 프로세스

### 1단계: 요청 분석

```markdown
[EntityName] 모델을 만들어주세요.

**도메인:** [도메인 설명]
**필드:**
- field1: type (설명)
- field2?: type (optional, 설명)

**관계:**
- Parent 모델과 1:1/1:N 관계
- Child 모델들과 연결
```

### 2단계: 유형 판단

다음 질문으로 유형 결정:

1. **이 모델이 독립적으로 완전한 의미를 가지는가?**
   - Yes → CONCRETE ENTITY
   - No → 다른 유형 검토

2. **다른 모델을 구체화/확장하는가?**
   - 1:1로 추상 엔티티 구체화 → MATERIALIZATION
   - 1:N으로 구체 엔티티 확장 → EXTENSION

3. **두 모델을 연결하는 중간 테이블인가?**
   - Category 연결 → CLASSIFICATION
   - Group 연결 → ASSOCIATION
   - 3개 이상 엔티티 연결 → BRIDGE

4. **시스템 설정/권한 데이터인가?**
   - Yes → REFERENCE

5. **사용자 생성 콘텐츠인가?**
   - Yes → CONTENT

### 3단계: 주석 작성

```prisma
// @schema-type: [유형]
// @description: [설명]
// @[관계태그]: [관계 설명]
model EntityName {
  // ...
}
```

### 4단계: 파일 헤더 작성

```prisma
// ============================================================================
// [Domain] Domain - [도메인명]
// ============================================================================
//
// [도메인 설명]
//
// 관계 구조:
//   [Entity] ([유형])
//     │
//     ├─── [관계1]
//     ├─── [관계2]
//     └─── [관계3]
//
// ============================================================================
```

