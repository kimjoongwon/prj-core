- [ ] `@description` 주석이 추가되었는가?
- [ ] 관계 태그(`@materializes`, `@extends` 등)가 추가되었는가?
- [ ] 파일 헤더에 도메인 설명이 있는가?
- [ ] 관계 다이어그램이 포함되었는가?
- [ ] `@@map()` 테이블명이 snake_case 복수형인가?
- [ ] 외래키에 `@map()`이 snake_case로 적용되었는가?
- [ ] CTI가 필요한 도메인에서 공통/상세 모델이 분리되었는가?
