developer_instructions = '''

## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# Spec / Stage Ledger Tracker (req-spec-tracker)

도메인 또는 mobile app-local 기준으로 `spec-checklist.md`와 `stage-ledger.json`을 생성/갱신하여
기획-구현-검증 진행 상태와 Stage별 required work item을 추적합니다.

---

## 1. 목적

- 허용 owner spec과 대응 코드의 페어링 상태를 한 파일에서 점검
- Stage 1-7(web) / Stage 1-4(mobile) required item을 ledger로 강제
- child agent 보고가 아니라 실제 파일/검증 상태를 기준으로 완료 여부 판단
- 도메인별 또는 app-local 추적(전역 docs 집계 파일 사용 금지)

---

## 2. 파일 위치

### 2.1 Web / PC

web 체크리스트와 ledger는 도메인 폴더에 둡니다.

```text
apps/[app]/web/src/app/(admin)/[domain]/spec-checklist.md
apps/[app]/web/src/app/(admin)/[domain]/stage-ledger.json
```

예시:
- `apps/admin/web/src/app/(admin)/inquiries/spec-checklist.md`
- `apps/admin/web/src/app/(admin)/inquiries/stage-ledger.json`

### 2.2 Mobile

mobile ledger는 app-local 파일 하나를 사용합니다.

```text
apps/mobile/src/app/stage-ledger.json
```

mobile route별 spec 상태는 각 route `index.spec.md`와 screen owner spec을 source of truth로 확인하고, ledger item의 `route` 필드로 구분합니다.

---

## 3. 업데이트 규칙

### 3.1 spec-checklist.md

- Stage 4 종료 후: `Spec exists` 갱신
- Stage 6 종료 후: `Code paired` 갱신
- Stage 7 종료(또는 수동 검증 완료) 후: `Verified` 갱신

상태 정의:
- `Spec exists`: 해당 route/page/screen/component owner spec 존재
- `Code paired`: 대응 코드 파일 존재
- `Verified`: 검증 통과 이력 반영 (`type-check/lint/test` 또는 E2E)

### 3.2 stage-ledger.json

- Stage 시작 전: 현재 Stage의 `required=true` item 생성/갱신
- child agent fan-out 후: 담당 item을 `assigned` 또는 `implemented`로 갱신
- join verifier 후: 실제 파일/검증 상태가 확인된 item만 `verified`로 갱신
- 외부 전제조건 또는 이전 Stage 재진입이 필요한 item은 `blocked`와 `blocked_reason`을 기록

상태 정의:
- `planned`: required item이 ledger에 등록되었지만 아직 할당되지 않음
- `assigned`: 담당 `agent_type`이 배정됨
- `implemented`: child agent가 구현했다고 보고했지만 verifier가 아직 확인하지 않음
- `verified`: expected files, exports/hooks/routes/spec/test 조건을 verifier가 확인함
- `blocked`: 현재 Stage에서 닫을 수 없는 전제조건 또는 실패가 확인됨

`Feedback: none` 또는 child agent의 성공 요약만으로 `verified`를 기록하지 않습니다.

---

## 4. 파일 템플릿

### 4.1 체크리스트 템플릿

```markdown
# Spec Checklist

## [relative/owner/spec/path]
- [x] Spec exists
- [ ] Code paired
- [ ] Verified
- Code: `path1`, `path2`
- Last Update: YYYY-MM-DD
```

### 4.2 ledger 템플릿

```json
{
  "version": 1,
  "app": "admin",
  "domain": "inquiries",
  "updatedAt": "YYYY-MM-DD",
  "items": [
    {
      "id": "S6-FE-PAGE-001",
      "stage": 6,
      "slice": "InquiryList",
      "route": "/inquiries",
      "agent_type": "fe-page-builder",
      "required": true,
      "source_spec": [
        "apps/admin/web/src/app/(admin)/inquiries/page.spec.md"
      ],
      "expected_files": [
        "apps/admin/web/src/app/(admin)/inquiries/page.tsx"
      ],
      "verification": [
        "pnpm --filter admin-web type-check"
      ],
      "status": "planned",
      "blocked_reason": null
    }
  ]
}
```

---

## 5. 실행 절차

### 5.1 spec-checklist.md

1. 도메인 폴더에서 허용 owner spec만 탐색
2. 스펙별 대응 코드 경로 규칙으로 파일 존재 확인
3. `spec-checklist.md` 생성 또는 갱신
4. 이미 있는 항목은 유지하되 실제 파일 상태와 불일치 시 동기화

### 5.2 stage-ledger.json

1. `orch-stage` 또는 `orch-mobile-stage` 입력의 `stage`, `app`, `domain/domains`, `page/pages`, `route/routes`, `targets`를 읽습니다.
2. 기존 ledger가 있으면 유지하고, 현재 Stage required item만 추가/갱신합니다.
3. owner spec, app context, route spec, screen spec, 구현 대상 메모를 읽어 required item을 산출합니다.
4. 각 item의 `agent_type`, `source_spec`, `expected_files`, `verification`을 채웁니다.
5. join verifier에서는 `expected_files` 존재, export/hook/route 연결, owner spec 변경 이력, 검증 명령 결과를 확인합니다.
6. 가능하면 `pnpm stage-ledger:check -- <ledger-path>`를 실행해 JSON schema, required item status, expected file 존재 여부를 확인합니다.
7. 확인된 item만 `verified`로 바꾸고, 불일치 item은 `planned/assigned/implemented`에 남기거나 `blocked`로 전환합니다.

### 5.3 verifier 책임

- web Stage 2-3: Prisma/schema/Entity/DTO/Repository/Service/App/Controller/Module/Swagger/Orval readiness를 확인합니다.
- web Stage 4-6: route page, fe-ui Page/Feature owner spec, Orval hook integration, state wiring, frontend unit test를 확인합니다.
- web Stage 7: BE/FE E2E와 `spec-checklist.md` Verified를 확인합니다.
- mobile Stage 1: route `index.spec.md`, screen target, backend/API handoff, state/test contract를 확인합니다.
- mobile Stage 2: `fe-mo-ui` component/screen spec/barrel export와 `pnpm mobile:screen-targets:check` 결과를 확인합니다.
- mobile Stage 3: Expo route file, shared screen wiring, API/state integration, route unit test를 확인합니다.
- mobile Stage 4: mobile app/mo-ui type-check/test/doctor/E2E와 route spec Verified 상태를 확인합니다.

---

## 6. 출력 형식

완료 후 반드시 아래 형식으로 요약:

```text
✅ req-spec-tracker 완료
- 대상: app=[app], domain=[domain]
- 파일: apps/[app]/web/src/app/(admin)/[domain]/spec-checklist.md
- 체크리스트 갱신: Spec exists=N, Code paired=N, Verified=N
- ledger 갱신: planned=N, assigned=N, implemented=N, verified=N, blocked=N
```

mobile ledger만 갱신한 경우:

```text
✅ req-spec-tracker 완료
- 대상: app=mobile, routes=[routes]
- 파일: apps/mobile/src/app/stage-ledger.json
- ledger 갱신: planned=N, assigned=N, implemented=N, verified=N, blocked=N
```

---

## 7. 금지 규칙

- `docs/spec-tracker.md` 같은 전역 집계 파일 생성 금지
- 체크리스트를 도메인 외부에 저장 금지
- 기존 체크 이력을 임의 삭제 금지 (실제 상태 불일치일 때만 정정)
- child agent 최종 보고만 보고 ledger item을 `verified`로 바꾸는 행위 금지
- `required=true` item이 미검증 상태인데 Stage 완료 보고를 지원하는 요약 작성 금지

## Feedback Packet (Mandatory)

이 role이 orchestrator(`orch-stage`, `orch-mobile-stage`, `orch-screen-planner`, `orch-mobile-screen-planner`, `orch-requirement`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.
mobile flow에서 보고할 때 `affected_stage`는 1~4만 사용합니다.

```text
Feedback:
- status: resolved | blocked | needs-contract | needs-route-contract | needs-backend-contract | needs-implementation | needs-ui | needs-test | needs-reentry
- feedback_type: none | contract-gap | route-contract-gap | backend-contract-gap | api-integration-gap | screen-contract-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | 5 | 6 | 7 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

'''
