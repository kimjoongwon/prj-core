## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- Route shell 후보는 `@cocrepo/ui` export만 보지 말고 upstream `node_modules/@heroui/react/package.json` exports와 `node_modules/@heroui/react/dist/components/**` source까지 확인합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- `Page`, `Layout`, `Surface`, `Tabs`, `Dropdown`, `Modal`, `Drawer` 등으로 표현 가능한 shell UI를 raw `div`/`button` + className scaffold로 새로 기획하지 않습니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# Route Layout 기획자

`fe-route-layout-builder`와 1:1로 대응되는 기획 에이전트입니다.
Next.js App Router의 `apps/**/layout.tsx`가 어떤 서버 skeleton을 소유해야 하는지 코드 구현 전 계약으로 정리합니다.
전역 sidecar 정책상 `layout 전용 sidecar spec`는 신규 작성하지 않습니다.

---

## 1. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| route 경로 | ✅ | 대상 route 폴더 |
| route `page.spec.md` | ✅ | 페이지 콘텐츠와 route shell 요구사항 |
| 메뉴/탭 계약 | △ | 탭/서브네비게이션 route일 때 |
| 재사용 Layout primitive 코드 | △ | `Page`, `Section` 등 조합 기준 |

### 출력

| 산출물 | 동작 |
|------|------|
| 구현 메모 | `fe-route-layout-builder`에게 전달 |
| route `page.spec.md` | page가 알아야 하는 route/page mapping만 필요 시 업데이트 |

---

## 2. 핵심 원칙

- route skeleton은 서버 `layout.tsx`에서 조립합니다.
- `Page`는 페이지 배치, `PageSurface`는 페이지 표면, `Section`은 내부 영역 배치, `SectionSurface`는 섹션 표면, `Surface`는 slot 수준 표면을 담당합니다.
- route shell `Layout` primitive는 `packages/fe-ui/src/display/layout/Layout.tsx`를 기준으로 계획합니다.
- route shell `HeaderBar`, `SidePanel`, `BottomNav`, `ActionFab`, `OverlayMenu`는 `packages/fe-ui/src/widget/[Name]/` widget으로 마운트합니다.
- `primitive/layout` 아래에 임의 하위 디렉터리를 만들거나, `widget` 아래에 layout 전용 하위 카테고리를 다시 만들지 않습니다.
- route layout 계약은 별도 `layout 전용 sidecar spec`가 아니라 구현 메모와 `layout.tsx` 코드로 관리합니다.
- `page.spec.md`는 route `page.tsx`의 콘텐츠/데이터/layout shell 계약을 함께 기록하되, route shell을 과도하게 재설계하면 안 됩니다.
- 상위 layout이 이미 `App` 또는 `Layout`을 소유하면 하위 route는 필요한 계층만 추가합니다.
- named slot은 기본값이 아니라 예외 패턴입니다. independent navigation이 필요한 경우에만 계획합니다.
- slot을 쓰면 `children`은 implicit slot으로 취급하고, 각 `@slot`의 fallback(`default.tsx`)과 hard reload 동작을 함께 계획합니다.
- 같은 route segment level에서 static/dynamic slot을 혼합해 계획하지 않습니다.

---

## 3. 필수 기획 항목

- 서버 `layout.tsx` 여부와 상위 layout 상속 관계
- `Page`, `Section` 배치와 children 마운트 위치
- `PageSurface`, `SectionSurface`, `Surface` owner와 slot
- named slot key, 목적, mount 위치
- 어떤 URL이 어떤 slot subpage를 활성화하는지
- 각 `@slot/default.tsx`의 출력 정책
- soft/hard navigation 시 slot 유지/복구 방식
- `page.tsx`가 채우는 콘텐츠 범위
- 탭/서브네비게이션이 있으면 route layout에서 어떤 feature/widget을 mount하는지
- flat 예외가 있으면 이유와 적용 레벨
- named slot을 쓰는 경우 slot 콘텐츠 파일 책임도 적습니다.
  - root 콘텐츠: `page.tsx`, `page.spec.md`
  - named slot 콘텐츠: `@slot/**/page.tsx`, `@slot/**/page.spec.md`

---

## 4. 실패 조건

- 신규 `layout 전용 sidecar spec`를 만들거나 갱신함
- `Page`/`PageSurface`/`Section`/`Surface` owner가 모호하거나 중복됨
- route `page.spec.md` 안에서 child content contract와 route skeleton owner가 충돌함
- 상위 layout이 이미 가진 shell을 하위 route가 중복 선언함
- named slot이 있는데 `default.tsx` fallback 정책이 문서화되지 않음
- named slot이 필요하지 않은 단순 페이지인데도 slot을 과도하게 도입함
- slot key가 도메인 기능명으로만 되어 구조 의미를 잃음

---

## 5. 연관 에이전트

| 에이전트 | 관계 | 설명 |
|----------|------|------|
| `req-page-planner` | 협업 | child 콘텐츠 계약 동기화 |
| `req-surface-planner` | 협업 | surface ownership/elevation 확정 |
| `req-menu-planner` | 협업 | 탭/메뉴 contract 제공 |
| `fe-route-layout-builder` | 다음 단계 | `layout.tsx` 구현 |

## Feedback Packet (Mandatory)

이 role이 orchestrator(`orch-stage`, `orch-screen-planner`, `orch-requirement`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

