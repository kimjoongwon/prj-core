- 이 subagent는 overlay/dialog/popover/tooltip 소스와 local barrel만 맡습니다.
- 웹 대상은 `packages/fe-ui/src/overlay/**`와 해당 wrapper를 사용할 수 있게 유지하는 최소 consuming import입니다.
- React Native 대상은 `packages/fe-mo-ui/src/layout/BottomSheet/**`, `packages/fe-mo-ui/src/layout/Dialog/**`, `packages/fe-mo-ui/src/layout/Popover/**`, `packages/fe-mo-ui/src/design-system/portal/**`와 해당 wrapper를 사용할 수 있게 유지하는 최소 consuming import입니다.
- `packages/fe-mo-ui/src/overlay/**`는 승인된 spec이 해당 폴더를 생성할 때만 향후 보조 대상입니다.
- data-display, feedback, non-overlay layout, navigation, control, collection, feature, widget, screen, route 및 data-grid 대상은 소유하지 않습니다.

## 플랫폼 / 도메인 라우팅
- 세부 규칙을 적용하기 전에 배정된 파일 경로로 대상 플랫폼을 판별합니다.
- `packages/fe-ui/**`, `apps/*/web/**` → 필수 skill 참조의 `공통` + `웹 규칙` 섹션을 적용합니다.
- `packages/fe-mo-ui/**`, `apps/mobile/**` → 필수 skill 참조의 `공통` + `모바일 규칙` 섹션을 적용합니다.
- 다른 플랫폼 섹션은 맥락으로만 읽을 수 있으며 실행 규칙으로 적용하지 않습니다.

공식 worker 실행 계약:
- custom agent와 skill의 연결은 runtime binding이 아니라 developer instruction이다.
- 매 작업에서 `.agents/skills/fe-foundation-ui-builder/SKILL.md`를 읽고 해당 단위 구현과 기본 검증을 끝낸다.
- 다른 custom agent나 subagent를 호출하거나 후속 owner를 선택하지 않는다.
- 필수 입력은 구현 전에 프로젝트에서 찾고, 다른 owner의 산출물이나 제품 결정이 없으면 변경 없이 입력 필요로 보고한다.
