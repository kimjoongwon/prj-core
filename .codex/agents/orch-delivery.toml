  Gate["S0 orch-delivery: spec approval"]
  Gate --> B1["B1 be-prisma-builder: schema"]
  B1 --> B2["B2 be-prisma-annotator: display names"]
  B2 --> B3["B3 common-schema-builder: shared validation"]

  subgraph BP["parallel: backend model contracts"]
    B4["B4 be-entity-builder: Entity"]
    B5["B5 be-vo-builder: VO"]
    B6["B6 be-dto-builder: DTO"]
    B7["B7 be-query-dto-builder: Query DTO"]
  end
  B3 --> B4
  B3 --> B5
  B3 --> B6
  B3 --> B7

  B4 --> B8["B8 be-repository-builder: persistence"]
  B5 --> B8
  B6 --> B8
  B7 --> B8
  B8 --> B9["B9 be-service-builder: domain logic"]
  B9 --> B10["B10 be-app-builder: workflow"]
  B10 --> B11["B11 be-facade-builder / be-gateway-builder: boundary"]
  B11 --> B12["B12 be-controller-builder: endpoint"]
  B12 --> B13["B13 be-module-builder: module wiring"]
  B13 --> B14["B14 be-bootstrap-integrator: app bootstrap"]
  B14 --> B15["B15 be-seed-maker: seed"]
  B15 --> BQA["BQA qa-be-testing / qa-be-e2e-testing"]
  BQA --> CG["CG codegen: @cocrepo/api"]

  subgraph FP["parallel: foundation contracts"]
    F1["F1 common-type-builder: shared types"]
    F2["F2 common-toolkit-builder: utilities"]
