#### Parallel Group Table

| 그룹 | 병렬 step | 병렬 가능 사유 | 공유 파일 lock | 합류 step |
|------|-----------|----------------|----------------|-----------|
| P1 | `B4`, `B5`, `B6`, `B7` | 서로 다른 package/file owner | `packages/*/src/index.ts`는 합류 step에서만 수정 | `B8` |

#### Step Order Table

`Step Order Table`은 그래프의 보조 설명이 아니라 실행자가 실제로 따라갈 순서표입니다. backend를 `backend builder chain`, `B1-B13`, `be-prisma-builder -> be-controller-builder` 같은 통합 row로 뭉치지 않습니다. backend 변경이 하나라도 있으면 아래 backend 순서를 필요한 step 단위로 펼쳐 씁니다. 생략하는 step은 row를 지우거나 `완료 조건`에 `생략 사유`를 적습니다.

| 순서 | step id | phase | `agent_type` | 직렬/병렬 | 의존 step | 산출물 | 완료 조건 |
|------|---------|-------|--------------|-----------|-----------|--------|-----------|
| 1 | `S0` | approval | `orch-delivery` | serial | none | 승인 기록 | 승인/중단 결정 |
| 2 | `B1` | Prisma model | `be-prisma-builder` | serial | `S0` | Prisma schema/model/enum | Prisma 변경 시 |
| 3 | `B2` | Prisma annotation | `be-prisma-annotator` | serial | `B1` | 한글 표시명/주석 | Prisma 변경 시 |
| 4 | `B3` | Common schema | `common-schema-builder` | serial | `B1` | shared schema/message | 검증/API schema 변경 시 |
| 5 | `B4` | Entity / VO | `be-entity-builder` / `be-vo-builder` | serial | `B1` | entity/vo source | 도메인 객체 변경 시 |
| 6 | `B5` | DTO / Query DTO | `be-dto-builder` / `be-query-dto-builder` | serial | `B3`, `B4` | DTO/query DTO | API 요청/응답 변경 시 |
| 7 | `B6` | Repository | `be-repository-builder` | serial | `B1`, `B4` | repository source | 영속성 변경 시 |
| 8 | `B7` | Service | `be-service-builder` | serial | `B5`, `B6` | service source | 도메인 로직 변경 시 |
| 9 | `B8` | ApplicationService | `be-app-builder` | serial | `B7` | application service | workflow 변경 시 |
| 10 | `B9` | Facade / Gateway | `be-facade-builder` / `be-gateway-builder` | serial | `B7`, `B8` | facade/gateway source | controller boundary 또는 외부 연동 변경 시 |
| 11 | `B10` | Controller | `be-controller-builder` | serial | `B5`, `B9` | controller source | endpoint/Swagger 변경 시 |
| 12 | `B11` | Module | `be-module-builder` | serial | `B10` | Nest module | provider/controller wiring 변경 시 |
| 13 | `B12` | Bootstrap | `be-bootstrap-integrator` | serial | `B11` | AppModule/router wiring | app bootstrap 변경 시 |
| 14 | `B13` | Seed | `be-seed-maker` | serial | `B12` | seed data | seed 변경 시 |
| 15 | `BQA` | Backend QA | `qa-be-testing` / `qa-be-e2e-testing` | serial | `B10-B13` | test result/patch | backend 변경 시 |
| 16 | `F1` | Shared type | `common-type-builder` | serial/parallel | `BQA` 또는 `CG` | shared type contract | shared type 변경 시 |
| 17 | `F2` | Toolkit utility | `common-toolkit-builder` | serial/parallel | `F1` 또는 `CG` | shared utility | shared utility 변경 시 |
| 18 | `F3` | Reusable hook | `fe-hook-builder` | serial/parallel | `F1`, `F2` | reusable hook | reusable hook 변경 시 |
| 19 | `F4` | Shared store | `fe-store-builder` | serial/parallel | `F1`, `F2` | shared MobX Store | shared store 변경 시 |

#### Canonical Phase Order

아래 순서를 기본값으로 삼되, 실제 spec에는 필요한 step만 남기고 생략 사유를 기록합니다.

```text
orch-delivery spec gate

→ be-prisma-builder, 필요한 경우
→ be-prisma-annotator, Prisma 변경 시
→ common-schema-builder, 검증/폼/API schema 변경 시
→ be-entity-builder / be-vo-builder / be-dto-builder / be-query-dto-builder, 필요한 경우
→ be-repository-builder, 영속성 변경 시
→ be-service-builder, 도메인 로직 변경 시
→ be-app-builder, workflow orchestration 필요 시
→ be-facade-builder / be-gateway-builder, 경계 조합 또는 외부 연동 필요 시
→ be-controller-builder, endpoint 변경 시
→ be-module-builder, module/router wiring 변경 시
→ be-bootstrap-integrator, AppModule bootstrap 변경 시
→ be-seed-maker, seed 변경 시
→ qa-be-testing / qa-be-e2e-testing, backend 변경 시
→ pnpm --filter=@cocrepo/api codegen, API 변경 시
→ common-type-builder, shared type 필요 시
→ common-toolkit-builder, shared utility 필요 시
→ fe-hook-builder, reusable React hook 필요 시
→ web leaf builders, 필요한 경우
→ fe-store-builder, shared store 필요 시
→ fe-screen-builder
→ fe-route-layout-builder, 필요한 경우
→ fe-route-builder
→ qa-fe-testing / qa-fe-e2e-testing, web 변경 시
→ mobile leaf builders, 필요한 경우
→ fe-mo-screen-builder
→ fe-mo-route-layout-builder, 필요한 경우
→ fe-mo-route-builder
→ qa-mo-testing / qa-mo-e2e-testing, mobile 변경 시
→ qa-type-checker, 타입 오류 또는 cross-package contract 변경 시
```

---

## 5. Approval Gate

route delivery spec 작성/갱신 후 builder/QA agent를 호출하기 전에 반드시 승인 gate를 엽니다.
승인 전에는 backend/web/mobile/QA builder agent를 호출하지 않습니다.
사용자가 spec 수정을 요청하면 같은 route delivery spec을 보강한 뒤 다시 승인 gate를 엽니다.

Codex 질문 도구 문구:

```text
작성한 spec 기준으로 개발을 시작할까요?

선택지:
- 진행: 승인된 spec 범위에서 구현 시작
- spec 수정: 수정 요청을 반영하고 다시 확인
- 중단: 구현하지 않고 멈춤
```

---

## 6. 실행 원칙

- route delivery spec의 `Agent Assignment Matrix`와 `Execution Graph`만 실행합니다.
- route delivery spec에 없는 `agent_type`은 호출하지 않습니다.
- route delivery spec에 없는 파일은 수정하지 않습니다.
- `parallel=auto`여도 spec row의 `parallel: true`이고 파일 ownership이 겹치지 않는 step만 병렬 실행합니다.
- shared file lock은 spec의 `Shared File Locks`를 따릅니다.
- backend/API 변경 후 spec에 codegen step이 있으면 web/mobile wiring 전에 codegen을 실행합니다.
- 완료 보고에는 실행한 step id, agent_type, 변경 파일, 검증 결과, re-entry 여부를 포함합니다.

---

## 7. Feedback Router

- `spec-gap`: spec을 보강하고 승인 gate 재진입
- `contract-gap`: spec의 affected step과 관련 contract 보강
- `api-integration-gap`: API contract 문제면 spec 보강, wiring 문제면 해당 route builder follow-up
- `ui-composition-gap`: spec의 Required Elements와 Agent Assignment Matrix 보강 후 담당 builder follow-up
- `implementation-blocker`: 같은 agent가 해결 가능하면 follow-up, role 경계 밖이면 spec re-entry
- `test-failure`: 제품 contract 문제와 테스트 기대값 문제를 분리해 spec re-entry 또는 QA follow-up
- `spec-drift`: spec을 먼저 갱신한 뒤 구현/테스트 follow-up
- `shared-file-conflict`: 병렬 쓰기를 중단하고 single writer 지정
- `dependency-missing`: 현재 phase 전제조건이면 blocked, downstream 전제면 spec의 downstream step에 required input 기록

---

## 8. 완료 조건

- spec의 required step이 완료되거나 명시적으로 blocked 처리되어야 합니다.
- 승인 gate 결과가 spec의 `Approval / Execution Log`에 기록되어야 합니다.
- required QA/Acceptance 검증이 통과해야 합니다.
- spec이 변경되면 `## 변경 이력` 또는 `Approval / Execution Log`에 남겨야 합니다.
- stale agent_type, spec에 없는 파일 변경, shared lock 위반이 없어야 합니다.

---

## 9. 금지

- 별도 planning role을 호출하지 않습니다.
- `.codex/plans/**/*.delivery-plan.md` 같은 별도 Delivery Plan 파일을 만들지 않습니다.
- domain/web/mobile별 별도 실행 기획서를 만들지 않습니다.
- Screen/Feature planning spec에 `Agent Assignment Matrix`, `Execution Graph`, backend build order, foundation 세부 실행표, approval gate를 넣지 않습니다.
- builder가 결정해야 할 세부 구현 규칙을 spec에 복제하지 않습니다.
- 승인 gate 전에는 builder/QA agent를 호출하지 않습니다.
- 하위호환 wrapper, deprecated 경로, 임시 fallback API를 계획하지 않습니다.

## Feedback Packet (Mandatory)

이 role이 실행 agent로 동작하거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_phase: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-spec | needs-approval | needs-implementation | needs-test | needs-reentry
- feedback_type: none | spec-gap | approval-needed | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_phase: planning | approval | backend | codegen | web | mobile | qa | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

