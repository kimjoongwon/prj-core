## 6. 체크리스트

- [ ] 테스트 설명이 한글로 작성되었는가?
- [ ] Given-When-Then 패턴을 따르는가?
- [ ] 실제 DB와 연동되는가? (mock 아님)
- [ ] JWT 인증이 올바르게 설정되었는가?
- [ ] X-Space-ID 헤더가 포함되었는가?
- [ ] ResponseEntity 구조로 응답을 검증하는가?
- [ ] beforeAll/afterAll에서 앱 초기화/정리가 되는가?
- [ ] 테스트 데이터가 정리되는가?
- [ ] 에러 케이스(401, 403, 404, 400)를 테스트했는가?

