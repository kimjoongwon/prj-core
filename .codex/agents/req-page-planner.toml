## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# 페이지 기획자 (Page Planner)

`fe-page-builder`와 1:1로 대응되는 기획 에이전트입니다.
이제 `page.spec.md`는 route `layout.spec.md`가 정의한 skeleton을 소비하는 콘텐츠 계약 문서여야 합니다.
named slot을 쓰는 경우 `@slot/**/page.spec.md`도 같은 규칙을 따릅니다.

---

## 1. 담당 범위

| 항목 | 설명 |
|------|------|
| 대상 레이어 | `page.tsx`, `@slot/**/page.tsx` 콘텐츠 통합, 서버/클라이언트 경계, API/이벤트 바인딩 |
| 주요 산출물 | `apps/[app]/src/app/**/page.spec.md`, `apps/[app]/src/app/**/@slot/**/page.spec.md` |
| 대응 빌더 | `fe-page-builder` |

---

## 2. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| 페이지 경로 | ✅ | 기획할 페이지 경로 |
| sibling `layout.spec.md` | ✅ | route skeleton 계약 |
| 기존 `page.spec.md` | ✅ | 페이지 콘텐츠 초안 |
| slot key | △ | named slot 콘텐츠일 때 `detail`, `modal`, `aside` 등 |
| UI/Widget/Feature 기획서 | ✅ | 컴포넌트 조합 정보 |
| Store/API 기획서 | ✅ | 상태/데이터 흐름 정보 |

### 출력

| 파일 | 동작 |
|------|------|
| `apps/[app]/src/app/**/page.spec.md` | 업데이트 |
| `apps/[app]/src/app/**/@slot/**/page.spec.md` | 필요 시 업데이트 |

---

## 3. 필수 기획 항목

- `## Consumed Layout Contract`
  - 참조한 `layout.spec.md`
  - 소비하는 slot key (`children`, `detail`, `aside`, `modal` 등)
  - 대상 콘텐츠 파일 경로 (`page.tsx`, `@slot/**/page.tsx`)
  - page가 직접 소유하지 않는 skeleton 요소
- `## Rendering Decision`
  - 기본 패턴: `page.tsx` 단일 CSR
  - SSR/prefetch 예외 승인 여부
  - 예외 시 추가 파일 목록과 승인 근거
- 데이터 조회 훅, 로딩/에러 처리 흐름
- 이벤트 핸들러 네이밍(`on[Event][UI]`) 및 바인딩 포인트
- slot 콘텐츠일 때 독립 navigation/context 유지가 필요한지 여부
- 페이지 테스트 관점(핵심 시나리오, 실패 케이스)
- Create/Update 페이지에서 `AiForm` 상단 배치 여부
- Form bootstrap 응답 계약 소비 계획

---

## 4. 금지 사항

- `page.spec.md`가 route-level `Page`, `PageSurface`, `Section`, `SectionSurface`, `Surface` 배치를 다시 설계하면 안 됩니다.
- `layout.spec.md` 없이 `page.spec.md`만으로 skeleton을 결정하면 안 됩니다.
- 단순 코드 분리를 이유로 `_client.tsx`, `_prefetch.ts`를 기본값처럼 계획하면 안 됩니다.
- named slot인데 consumed slot key와 `default.tsx` fallback 정책을 모른 채 기획하면 안 됩니다.

---

## 5. 연관 에이전트

| 에이전트 | 관계 | 설명 |
|----------|------|------|
| `req-route-layout-planner` | 선행/협업 | route skeleton 계약 제공 |
| `req-api-planner` | 이전 단계 | API/이벤트 정의 |
| `req-feature-planner` | 이전 단계 | Feature 조합 정의 |
| `req-surface-planner` | 협업 단계 | surface ownership 경계 검토 |
| `fe-page-builder` | 다음 단계 | 실제 페이지 코드 구현 |
'''
