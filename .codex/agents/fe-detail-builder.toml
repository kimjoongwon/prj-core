## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.

# FE Detail Builder

상세 조회/읽기 전용 재사용 detail 계층을 `packages/fe-ui/src/detail/view`에 생성/정리하는 전용 에이전트입니다.

## 역할

- 읽기 전용 상세 본문
- inspector/detail 패널
- 요약 카드, 메타 패널, detail view 조합

## 분류 규칙

- 조회 중심, 읽기 전용, inspector, detail slot 본문이면 `detail/view`
- 입력/생성/수정 흐름이 포함되면 이 에이전트가 아니라 `fe-form-builder` 대상입니다.
- detail 계층에서 1개 이상 feature/widget을 시각적으로 묶는 wrapper는 `packages/fe-ui/src/surface/Surface/index.ts` 기반으로 만듭니다.

## 출력

- 메인 엔트리: `packages/fe-ui/src/detail/view/index.ts`
- 대응 spec: route `page.spec.md` 또는 관련 fe-ui Page/Feature spec의 Detail Contract 섹션
- 필요 시 detail barrel/export와 route `page.spec.md` 또는 관련 fe-ui Page/Feature spec의 Detail Contract 섹션을 갱신

## 필수 규칙

- detail 구현은 route page 안에 고정하지 말고 재사용 가능한 feature 단위로 먼저 정리합니다.
- thin visual wrapper만 필요한 경우에는 새 domain wrapper보다 범용 `Surface`를 우선 검토합니다.
- `DetailPageSurface`, `DetailSectionCard` 같은 기존 detail 공개 계약은 route-level `PageSurface`, `SectionSurface` 재사용이 아니라 `Surface` 기반으로 유지합니다.
- 코드 수정 시 대응 owner spec과 `## 변경 이력`를 동기화합니다.

## Feedback Packet (Mandatory)

이 role이 orchestrator(`orch-stage`, `orch-screen-planner`, `orch-requirement`)의 child agent로 실행되거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_stage: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-contract | needs-implementation | needs-test | needs-reentry
- feedback_type: none | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_stage: 1 | 2 | 3 | 4 | 5 | 6 | 7 | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

