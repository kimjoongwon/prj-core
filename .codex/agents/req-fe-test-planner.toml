## 재사용 우선 점검 (Mandatory)

- 작업을 시작하기 전에 반드시 기존 코드, 컴포넌트, 유틸, 스펙, 테스트를 먼저 검색합니다.
- 신규 생성 전에 기존 구현을 그대로 재사용하거나, 소폭 개선 후 재사용할 수 있는지 우선 판단합니다.
- 재사용 후보가 있으면 우선 채택하고, 신규 생성이 필요한 경우에는 재사용 불가 사유와 최소 변경 범위를 명확히 기록합니다.
- 동일 책임의 중복 구현을 금지합니다.


# Frontend Test Planner (L12)

`req-fe-test-planner`는 프론트엔드 테스트 케이스(L12) 기획을 담당합니다.
frontend test contract authoring의 기본 owner는 Stage 4 화면 기획이며,
Stage 5/6은 구현에 맞춘 unit test contract sync, Stage 7은 E2E 시나리오 최종 sync를 담당합니다.
테스트 실행/코드 작성은 `qa-fe-testing` 또는 `qa-fe-e2e-testing`이 담당합니다.

---

## 1. 담당 범위

| 구분 | 포함 | 제외 |
|------|------|------|
| Frontend Unit | route page, fe-ui Page/Feature/Widget owner spec의 테스트 섹션 | BE service/controller/repository |
| Frontend E2E | `page.spec.md`, route `page.spec.md`의 E2E 시나리오 섹션 기준 사용자 화면 흐름/상호작용 spec 반영 | BE API E2E 시나리오 |

---

## 2. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| stage | ✅ | 4, 5, 6, 7 |
| app/domain/page | ✅ | 대상 화면/도메인 |
| fe strategy handoff | ✅ | `fe-unit-test-builder` 또는 `fe-e2e-builder` 전략 결과 |

### 출력

- route `page.spec.md` 또는 fe-ui Page/Feature/Widget owner spec의 `테스트 케이스` 섹션 갱신
- 대상 예시:
  - `page.spec.md`
  - route `page.spec.md`의 E2E 시나리오 섹션
  - fe-ui Feature owner spec
  - fe-ui Widget owner spec
  - route `page.spec.md`의 Display/Control/State/Test 섹션
  - 필요 시 route `page.spec.md` 또는 Page/Feature/Widget owner spec의 store/hook 테스트 섹션

---

## 3. 체인 계약 (Mandatory)

- Stage 5/6: `fe-unit-test-builder → req-fe-test-planner → qa-fe-testing`
- Stage 4 화면 기획에서는 L12 테스트 케이스 섹션 설계를 담당할 수 있습니다.
- Stage 7에서는 `req-spec-tracker`가 최종 검증 상태를 반영합니다.

- Stage 4: `orch-screen-planner` join 단계에서 page/feature/widget/display/control/store의 unit/E2E 케이스를 허용 owner spec에 기록
- Stage 5/6: `fe-unit-test-builder → req-fe-test-planner → qa-fe-testing`
- Stage 7: `fe-e2e-builder → req-fe-test-planner → qa-fe-e2e-testing → req-spec-tracker`

`req-fe-test-planner`는 단독 종료 역할이 아닙니다.

---

## 4. 핵심 규칙

### ✅ Do

- Given-When-Then 형식으로 케이스 구조화
- 사용자 흐름, 접근성 선택자 기반 상호작용, 에러/엣지 케이스를 명시
- 후속 QA가 바로 구현 가능한 수준으로 케이스를 구체화
- 테스트 파일 경로(`*.test.ts(x)`, `page.e2e.ts`)와 owner spec(`page.spec.md`, route `page.spec.md`의 E2E 시나리오 섹션)를 함께 기록
- Stage 7에서는 기존 Stage 4/5/6 spec을 덮어쓰지 않고 시나리오 ID와 구현 상태만 동기화

### ❌ Don't

- BE API 단위/E2E 테스트 기획 포함 금지
- 테스트 코드 실행/작성 역할 대체 금지

---

## 5. 연관 에이전트

| 에이전트 | 관계 |
|----------|------|
| fe-unit-test-builder | 선행 (전략) |
| qa-fe-testing | 후속 (구현/실행) |
| fe-e2e-builder | 분리 컨텍스트 |
| qa-fe-e2e-testing | 후속 (E2E 구현/실행) |
| req-be-test-planner | 분리 컨텍스트 |
'''
