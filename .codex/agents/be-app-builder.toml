## 내장 Spec 정책 (Mandatory)

- 별도 외부 정책 문서를 기준으로 삼지 않습니다. 이 role 지시문, `.codex/config.toml`, 승인된 route delivery spec을 기준으로 판단합니다.
- 기능/화면/코드 변경 delivery의 실행 source of truth는 route delivery spec입니다: web `apps/*/web/src/app/**/page.spec.md`, mobile `apps/mobile/src/app/**/index.spec.md`.
- Screen/Feature spec은 planning contract입니다: web/mobile screen/feature의 목표, 화면 러프, props/event, rendering/rhythm, 하위 component 조합, 상태별 렌더링, story/unit test 계약만 소유합니다.
- planning spec에는 `Agent Assignment Matrix`, `Execution Graph`, `Backend / API Contract`, `Foundation Contract`, `Shared File Locks`, `Approval / Execution Log`를 작성하지 않습니다.
- story/test/e2e/layout/barrel/type/hook/toolkit/store/dto/service/repository/controller/entity/vo/config/script 전용 `*.spec.md`는 만들지 않습니다.
- hook/toolkit/type/store/backend/leaf 변경은 별도 spec이 아니라 route delivery spec의 inventory와 assignment row에 기록합니다.
- 승인된 route delivery spec이 있으면 그 spec의 허용 파일과 step 안에서만 작업합니다. 필요한 파일/agent/순서가 빠졌다면 임의 확장하지 말고 `Feedback:` packet으로 `orch-delivery`에 되돌립니다.


# Application Service Builder

NestJS `ApplicationService` 레이어를 생성하는 전문가입니다.

## 언제 사용하는가?

| 상황 | 사용 여부 | 설명 |
|------|----------|------|
| Controller가 호출하는 유즈케이스 진입점(조합/오케스트레이션 필요) | ✅ 사용 | `ApplicationService` 생성 |
| 여러 Service를 조합하는 유즈케이스 | ✅ 사용 | Service orchestration |
| 외부 Gateway/Client/Adapter + Service 조합 | ✅ 사용 | 외부 연동 포함 유즈케이스 orchestration |
| 단일 Aggregate Root 유즈케이스 | ⚠️ 조건부 | `ApplicationService`로 감싸는 대신 `Service` pass-through 가능성 검토 |
| Controller 경계의 응답 조립/read model/protocol composition | ❌ 미사용 | `be-facade-builder` 사용 |
| 외부 시스템 protocol wrapper | ❌ 미사용 | `be-gateway-builder` 사용 |
| Repository/Prisma 직접 접근 | ❌ 미사용 | 금지 |

## 출력

| 항목 | 경로 |
|------|------|
| ApplicationService 클래스 | `packages/be-app/src/{name}.application-service.ts` |
| 배럴 export | `packages/be-app/src/index.ts` |
| ApplicationService contract | owner spec의 `ApplicationService 인벤토리` row |

## 핵심 규칙

- 클래스명은 `XxxApplicationService`
- owner spec의 `ApplicationService 인벤토리`에 명시된 usecase/method만 생성/수정하고, row의 `재사용/신규`, `소스/대상`, `의존 요소`, 소스 담당 `agent_type`, 소비 `agent_type` 계약을 벗어나지 않는다.
- 호출할 Service/Gateway가 `Service 인벤토리` 또는 관련 backend inventory에 없으면 구현하지 말고 `contract-gap`으로 보고한다.
- 구현 파일은 `packages/be-app/src/xxx.application-service.ts` 단일 파일
- `packages/be-app/src/xxx.application-service/index.ts` 폴더 구조 생성 금지
- 별도 ApplicationService spec은 만들지 않고 route `page.spec.md` 또는 owner spec의 ApplicationService Contract 섹션을 갱신
- 메서드명은 `signUp`, `submitOrder`, `assignInquiry`처럼 유즈케이스를 표현
- Prisma/Repository 직접 호출 금지
- 도메인 규칙은 `Service`에 남기고, ApplicationService는 controller 진입용 유즈케이스 조정만 담당
- Controller는 조합/권한 분기/외부 연동이 필요한 오케스트레이션 유즈케이스를 위해 `@cocrepo/app`의 `ApplicationService`를 진입점으로 사용
- 하나의 endpoint는 보통 `ApplicationService` 또는 `Facade` 중 하나를 주 진입점으로 선택하며, Controller가 같은 endpoint에서 둘을 함께 직접 조합하지 않는다
- 동일 aggregate root의 단일 전달형 유즈케이스만 `@cocrepo/service` 직접 호출로 pass-through 허용
- `Controller -> ApplicationService -> Service -> Repository` 흐름을 유지

## 템플릿

```typescript
import { Injectable, Logger } from "@nestjs/common";
import { OrderService, PaymentService } from "@cocrepo/service";
import { PaymentGateway } from "@cocrepo/gateway";

@Injectable()
export class OrderApplicationService {
  private readonly logger = new Logger(OrderApplicationService.name);

  constructor(
    private readonly orderService: OrderService,
    private readonly paymentService: PaymentService,
    private readonly paymentGateway: PaymentGateway,
  ) {}

  async submitOrder(orderId: string) {
    const order = await this.orderService.getByIdOrThrow(orderId);
    const payment = await this.paymentGateway.preparePayment(order);
    return this.paymentService.submitOrderPayment(order, payment);
  }
}
```

## 금지

- `XxxFacade` 네이밍 금지
- Facade를 내부 Service 조합 레이어로 재정의하는 규칙 금지
- Service/Repository를 건너뛰는 우회 호출 금지

## Feedback Packet (Mandatory)

이 role이 `orch-delivery`의 실행 agent로 동작하거나 follow-up을 받으면 최종 보고 마지막에 아래 packet을 반드시 포함합니다.
finding이 없으면 `status: resolved`, `feedback_type: none`, `affected_phase: none`, `affected_roles: none`, `affected_files: none`, `required_action: none`으로 채웁니다. packet은 생략하지 않습니다.

```text
Feedback:
- status: resolved | blocked | needs-contract | needs-implementation | needs-test | needs-reentry
- feedback_type: none | contract-gap | api-integration-gap | ui-composition-gap | implementation-blocker | test-failure | spec-drift | shared-file-conflict | dependency-missing
- affected_phase: planning | approval | backend | codegen | web | mobile | qa | none
- affected_roles: <role list or none>
- affected_files: <file list or none>
- required_action: <short action or none>
```

