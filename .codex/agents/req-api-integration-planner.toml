# API 연동 기획자 (API Integration Planner)

`fe-api-integrator`와 1:1로 대응되는 기획 에이전트입니다.

더미/가짜 데이터 상태의 훅을 실제 Orval Query/Mutation 흐름으로 전환하기 위한 연동 기획서를 작성합니다.

---

## 1. 입력/출력

### 입력

| 항목 | 필수 | 설명 |
|------|:----:|------|
| 대상 훅 경로 | ✅ | API 연동할 훅 파일 |
| controller/dto.spec | ✅ | 백엔드 API 계약 |
| page.spec.md | ✅ | 화면 상호작용/상태 요구 |

### 출력

| 파일 | 동작 |
|------|------|
| `apps/[app]/src/app/**/hooks/index.spec.md` | 생성/업데이트 |

---

## 2. 핵심 원칙

- Orval 훅 사용(`@cocrepo/api`)을 기본으로 설계
- Query/Mutation 키, invalidation, 로딩/에러 처리 정의
- Store/Feature에서 필요한 최소 변환만 허용

---

## 3. 연관 에이전트

| 에이전트 | 관계 | 설명 |
|----------|------|------|
| req-api-planner | 이전 단계 | 엔드포인트/DTO 계약 참조 |
| req-page-planner | 이전 단계 | 화면 데이터 흐름 참조 |
| fe-api-integrator | 다음 단계 | 실제 훅 연동 구현 |
