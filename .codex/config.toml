[features]
multi_agent = true

[agents]
max_threads = 8
max_depth = 99

[project]
multilingual = true

[rules]
repository_scope = "schema-owner"
repository_generation = "one repository per @schema-owner true model"
service_scope = "support/domain helper service"
command_scope = "Nest CQRS Command/Query message contract"
event_scope = "Nest CQRS Event message contract"
usecase_scope = "Nest CQRS Command/Query handler 기반 application/usecase workflow orchestration"
client_scope = "외부 시스템 단일 연동 client"

[rules.agent_model_tiering]
available_models = [
  "gpt-5.5",
  "gpt-5.4",
  "gpt-5.3-codex-spark",
]
frontier_model = "gpt-5.5"
balanced_model = "gpt-5.4"
spark_model = "gpt-5.3-codex-spark"
strategy = "서비스 설계, 데이터 모델, workflow orchestration, 실패 원인 분석은 gpt-5.5에 남기고, cross-layer 구현은 gpt-5.4로 낮추며, leaf 구현과 반복 생성 작업은 gpt-5.3-codex-spark로 보내 병렬 실행 속도를 높인다"
frontier_model_roles = [
  "orch-delivery",
  "be-prisma-builder",
  "be-database-expert",
  "be-usecase-builder",
  "common-schema-builder",
  "qa-type-checker",
]
balanced_model_roles = [
  "be-aggregate-builder",
  "be-bootstrap-integrator",
  "be-client-builder",
  "be-controller-builder",
  "be-module-builder",
  "be-repository-builder",
  "be-service-builder",
  "common-toolkit-builder",
  "common-type-builder",
  "fe-data-grid-agent",
  "fe-feature-agent",
  "fe-form-agent",
  "fe-menu-agent",
  "fe-route-layout-agent",
  "fe-screen-agent",
  "fe-store-agent",
  "qa-be-e2e-testing",
  "qa-fe-e2e-testing",
  "qa-mo-e2e-testing",
]
spark_model_roles = [
  "be-command-builder",
  "be-dmmf-parser-builder",
  "be-dto-builder",
  "be-entity-builder",
  "be-event-builder",
  "be-query-dto-builder",
  "be-vo-builder",
  "etc-jenkinsfile-builder",
  "fe-control-agent",
  "fe-display-agent",
  "fe-hook-agent",
  "fe-layout-agent",
  "fe-route-agent",
  "fe-widget-agent",
  "qa-be-testing",
  "qa-fe-testing",
  "qa-mo-testing",
  "be-prisma-annotator",
  "be-seed-maker",
  "dev-service-starter",
  "fe-cell-agent",
  "fe-columns-agent",
]
xhigh_roles = [
  "orch-delivery",
  "be-prisma-builder",
  "be-database-expert",
  "be-usecase-builder",
  "common-schema-builder",
  "qa-type-checker",
]
high_roles = [
  "be-aggregate-builder",
  "be-bootstrap-integrator",
  "be-client-builder",
  "be-controller-builder",
  "be-module-builder",
  "be-repository-builder",
  "be-service-builder",
  "common-toolkit-builder",
  "common-type-builder",
  "fe-data-grid-agent",
  "fe-feature-agent",
  "fe-form-agent",
  "fe-menu-agent",
  "fe-route-layout-agent",
  "fe-screen-agent",
  "fe-store-agent",
  "qa-be-e2e-testing",
  "qa-fe-e2e-testing",
  "qa-mo-e2e-testing",
]
medium_roles = [
  "be-command-builder",
  "be-dmmf-parser-builder",
  "be-dto-builder",
  "be-entity-builder",
  "be-event-builder",
  "be-query-dto-builder",
  "be-vo-builder",
  "etc-jenkinsfile-builder",
  "fe-control-agent",
  "fe-display-agent",
  "fe-hook-agent",
  "fe-layout-agent",
  "fe-route-agent",
  "fe-widget-agent",
  "qa-be-testing",
  "qa-fe-testing",
  "qa-mo-testing",
]
low_roles = [
  "be-prisma-annotator",
  "be-seed-maker",
  "dev-service-starter",
  "fe-cell-agent",
  "fe-columns-agent",
]
guard = "gpt-5.5는 되돌림 비용이 큰 판단 작업에만 사용한다. gpt-5.4는 cross-layer 구현과 E2E 검증에 사용한다. gpt-5.3-codex-spark는 leaf 구현, 계약 파일 생성, 단위 테스트, 주석/시드/서비스 시작/셀/컬럼 같은 반복 작업에 사용한다. Spark role도 승인된 spec과 ownership 경계를 벗어나면 작업을 확장하지 않고 최종 보고에 남긴다"

[rules.backend_code_style]
value_source_provenance_required = true
guard = "Backend input mapping은 값의 원천을 보존한다. 여러 출처가 섞이는 Controller/UseCase/Service/Repository/Client 코드에서는 command.params.timelineId, context.userId, entity.id처럼 source path를 유지하거나 params/context 같은 출처명 alias까지만 사용하고, deep destructuring으로 bare variable을 남발하지 않는다."

[rules.source_file]
single_responsibility = true
one_exported_element_per_file = true
class_file_top_level_type_or_helper_allowed = false
exceptions = ["barrel export files", "*.stories.tsx", "*.test.tsx", "generated files", "Prisma schema files"]
guard = "source file 하나는 하나의 책임 요소만 소유한다. 하나의 파일에는 하나의 exported class/function/type/interface/enum만 두고, class 파일에는 top-level helper/mapper 함수나 props/interface/type 선언을 함께 두지 않는다. Props/Params/Input/Result/Options/helper/mapper/parser/normalizer/constant는 가까운 별도 파일로 분리한다. barrel 파일은 export 구문만 소유한다."

[rules.repository]
owner_required = true
aggregate_root_optional = true
guard = "No repository should be missing for a @schema-owner model"

[rules.service]
scope = "aggregate root service가 아닌 support/domain helper service"
child_mutation = "child entity 수정은 반드시 @cocrepo/aggregate의 root aggregate service 경유"
prisma_direct_call = false
file_layout = "packages/be-service/src/{domain}/{domain}.service.ts"
code_file = "packages/be-service/src/{domain}/{domain}.service.ts"
barrel_export_file = "packages/be-service/src/index.ts"
guard = "be-service는 aggregate root service가 아닌 support/domain helper service를 둔다. aggregate root service provider는 @cocrepo/aggregate의 {Domain}AggregateRoot로 만든다. 신규 Service는 packages/be-service/src 루트에 flat file로 만들지 않고 domain 폴더 아래 {domain}.service.ts로 만든다."

[rules.aggregate]
package = "@cocrepo/aggregate"
scope = "aggregate root service provider"
file_layout = "packages/be-aggregate/src/{domain}/{domain}.aggregate-root.ts"
class_name = "{Domain}AggregateRoot"
barrel_export_file = "packages/be-aggregate/src/index.ts"
guard = "Aggregate root service는 @cocrepo/aggregate에만 둔다. class는 {Domain}AggregateRoot로 명명하지만 Nest provider/service 역할이며, aggregate root entity는 계속 @cocrepo/entity에 둔다."

[rules.usecase]
required_for_orchestration = true
required_for_multi_step = true
required_for_role_or_permission_or_external_integration = true
file_layout = "packages/be-usecase/src/{domain}/{name}.usecase.ts or packages/be-usecase/src/{namespace}/{domain}/{name}.usecase.ts"
event_handler_file_layout = "packages/be-usecase/src/{domain}/{name}.event-handler.ts or packages/be-usecase/src/{namespace}/{domain}/{name}.event-handler.ts"
saga_file_layout = "packages/be-usecase/src/{domain}/{name}.saga.ts or packages/be-usecase/src/{namespace}/{domain}/{name}.saga.ts"
domain_barrel_export_file = "packages/be-usecase/src/{domain}/index.ts or packages/be-usecase/src/{namespace}/{domain}/index.ts"
barrel_export_file = "packages/be-usecase/src/index.ts"
command_package = "@cocrepo/command"
guard = "UseCase handler는 @CommandHandler/@QueryHandler 기반 application layer이며 workflow orchestration을 담당한다. Command/Query message는 @cocrepo/command에서 import하고, packages/be-usecase에는 handler와 handler array만 둔다. handler/EventHandler/Saga class는 class당 하나의 파일로 분리하고, class 파일 안에 top-level type/helper/mapper를 함께 두지 않는다. core/idp처럼 여러 aggregate root를 포함하는 namespace 폴더에 handler 파일을 평면으로 모으지 않고 provider array 단위의 bounded context 폴더로 묶는다. domain을 넘는 shared type은 @cocrepo/type, pure runtime utility는 @cocrepo/toolkit에 두며 packages/be-usecase/src/common에 공용 계약/빌더를 만들지 않는다. provider array와 barrel export는 domain index.ts에서만 조립한다. Controller는 CommandBus/QueryBus만 호출하고 Service/Repository/Client를 직접 조합하지 않는다"

[rules.command]
package = "@cocrepo/command"
file_layout = "packages/be-command/src/{domain}/{name}.command.ts, packages/be-command/src/{domain}/{name}.query.ts"
barrel_export_file = "packages/be-command/src/index.ts"
provider_export_allowed = false
app_local_cqrs_allowed = false
guard = "프로젝트 전체 Command/Query message는 @cocrepo/command에서 export한다. Command/Query class는 class당 하나의 파일로 두고, params/input/result/type 계약도 파일별로 분리한다. apps/*/api/src/module/**/*.cqrs.ts와 packages/be-usecase/src/**/*.command.ts, packages/be-usecase/src/**/*.query.ts를 신규로 만들지 않는다."

[rules.event]
package = "@cocrepo/event"
file_layout = "packages/be-event/src/{domain}/{domain}.event.ts"
barrel_export_file = "packages/be-event/src/index.ts"
provider_export_allowed = false
handler_package = "@cocrepo/usecase"
guard = "프로젝트 전체 Event message는 @cocrepo/event에서 export한다. Event는 이미 발생한 사실만 표현하고 DTO/Request/Response/Express 객체에 의존하지 않는다. EventHandler와 Saga는 @cocrepo/usecase가 소유하며, EventHandler 안에서 CommandBus를 호출하지 않고 Event -> Command 흐름은 Saga로 분리한다."

[rules.client]
scope = "external system protocol adapter"
package = "@cocrepo/client"
file_layout = "packages/be-client/src/{provider}.client.ts"
barrel_export_file = "packages/be-client/src/index.ts"
guard = "Client는 외부 시스템 하나와의 protocol adapter만 담당한다. 여러 Client 조합과 fallback 판단은 Service 또는 UseCase에서 수행하고, legacy boundary 명칭은 신규로 사용하지 않는다"

[rules.controller]
cqrs_bus_required = true
facade_layer_allowed = false
direct_service_injection_allowed = false
single_root_passthrough_allowed = false
guard = "Controller는 HTTP protocol adapter로 유지하고 CommandBus/QueryBus만 호출한다. Service, Repository, Client, legacy boundary provider, UseCase handler를 Controller에 직접 주입하지 않는다"

[rules.fe_ui]
root_axis_only = true
no_namespace_group_depth = true
guard = "packages/fe-ui/src 아래에는 공개 축만 그룹 폴더로 두고, 그 아래에는 실제 컴포넌트/엔트리만 둔다"

[rules.fe_ui.screen]
folder_required = true
folder_layout = "packages/fe-ui/src/screen/{ScreenName}/{ScreenName}.tsx"
planning_spec_file = "packages/fe-ui/src/screen/{ScreenName}/{ScreenName}.spec.md"
story_file = "packages/fe-ui/src/screen/{ScreenName}/{ScreenName}.stories.tsx"
guard = "screen 계층 planning spec은 시각/props/하위 조합 계약만 소유한다. 실행 순서, backend/foundation 계약, 승인 gate는 service delivery spec이 소유하며 route delivery spec은 해당 화면 실행 slice만 소유한다. story spec은 만들지 않는다"

[rules.component_file]
one_exported_ui_component_per_file = true
filename_matches_exported_component = true
private_jsx_subcomponent_allowed = false
helper_scope = "component props/type/mapper/helper도 별도 파일로 분리한다"
exceptions = ["*.stories.tsx", "*.test.tsx", "compound primitive internals"]
guard = "source file 하나는 하나의 exported UI component만 소유한다. route/page/screen/feature/widget 파일 안에 private JSX subcomponent를 추가하지 말고, 이름 붙일 만한 JSX 조각과 component props/type/mapper/helper는 적절한 계층의 별도 파일로 분리한다"

[rules.component_verification]
storybook_required_for_ui_component = true
unit_test_required_for_behavior_or_state = true
builder_owns_story_and_unit_test = true
qa_owns_gap_and_regression = true
skip_requires_reason = true
guard = "컴포넌트 builder는 신규/수정 UI component와 같은 작업에서 Storybook story와 unit test를 작성/갱신한다. orch-delivery는 story/test 계약을 spec에 먼저 적고, QA role은 누락/실패/contract drift를 검증한다"

[rules.fe_ui.feature]
planning_spec_scope = "feature component only"
allowed_planning_spec = "packages/fe-ui/src/feature/**/{FeatureName}.spec.md"
guard = "feature 계층 planning spec은 Store/API/router 연결 의도, props, 이벤트, 상태별 렌더링 계약만 소유한다. 에이전트 배정 매트릭스, 실행 그래프, backend build order, approval gate는 service delivery spec과 generated route delivery spec에만 둔다"

[rules.fe_mo_ui.screen]
folder_required = true
folder_layout = "packages/fe-mo-ui/src/screen/{ScreenName}/{ScreenName}.tsx"
planning_spec_file = "packages/fe-mo-ui/src/screen/{ScreenName}/{ScreenName}.spec.md"
guard = "모바일 screen planning spec은 visual owner의 props/화면 러프/조합 계약만 소유한다. Expo route/native runtime wiring과 실행 순서는 service delivery spec과 apps/mobile generated route delivery spec이 소유한다"

[rules.fe_mo_ui.widget]
folder_required = true
folder_layout = "packages/fe-mo-ui/src/widget/{WidgetName}/{WidgetName}.tsx"
planning_spec_allowed = false
guard = "모바일 widget 계층은 screen/feature에서 재사용되는 순수 UI 조합이며, 계약은 service delivery spec, generated route delivery spec 또는 screen planning spec에 기록한다"

[rules.fe_mo_ui.feature]
folder_required = true
folder_layout = "packages/fe-mo-ui/src/feature/{FeatureName}/{FeatureName}.tsx"
planning_spec_allowed = true
planning_spec_file = "packages/fe-mo-ui/src/feature/{FeatureName}/{FeatureName}.spec.md"
guard = "모바일 feature planning spec은 interaction composition의 기획/props/state/action 계약만 소유한다. API/router/native wiring과 실행 순서는 service delivery spec과 apps/mobile generated route delivery spec이 소유한다"

[rules.fe_mo_ui.styling]
primary = "uniwind className + tailwind-variants tv({ slots, variants })"
stylesheet_allowed = false
text_component_required = true
style_object_scope = "safe-area inset, navigator option object, third-party native bridge 등 className으로 표현하기 어려운 동적 값에만 제한"
guard = "모바일 앱과 @cocrepo/mo-ui 신규/수정 UI는 StyleSheet/StyleSheet.create를 사용하지 않고 uniwind class props와 tailwind-variants slot/variant로 스타일을 정의한다. 작업 전 https://heroui.com/llms-patterns.txt 를 열어 HeroUI Native Composition/Styling/Provider/Portal 패턴을 확인한다. 사용자 노출 텍스트는 @cocrepo/mo-ui Text primitive를 사용하고 react-native Text 직접 import는 Text primitive 구현 내부에서만 허용한다. compound/action primitive도 문자열 children을 받으면 wrapper 내부에서 Text로 정규화하고 HeroUI Native에 raw string children을 그대로 넘기지 않는다. HeroUI Native compound wrapper는 return-only re-export로 끝내지 않고 field 계열은 upstream TextField/Label/Description/FieldError/InputGroup composition을 우선 사용하며 label/helperText/errorMessage/title/description/items/trigger/actions 같은 의미 있는 기본 조합 props와 dot-slot escape hatch를 함께 제공한다"

[rules.service_delivery_spec]
allowed = [
  "docs/services/**/*.delivery.spec.md",
]
source_of_truth = "서비스 기획과 실행"
required_sections = "서비스 목표, 사용자 / 역할 / 권한, 도메인 모델 / 생명주기, 사용자 여정, 필수 페이지 / 라우트, 백엔드 / API / 기반 계약, DESIGN.md 기반 디자인 방향, 생성된 라우트 Spec, 에이전트 배정 매트릭스, 실행 그래프, QA / 승인 기준, 승인 / 실행 로그"
guard = "service delivery spec이 서비스 전체 설계와 실행의 상위 기준이다. 질문 기반 기획, 모든 web/mobile route 목록, backend/API/foundation 계약, DESIGN.md 기반 디자인 방향, 승인 gate, 실행 순서, QA 기준은 docs/services/**/*.delivery.spec.md에 한글로 기록한다. `agent_type`, operationId, codegen, 파일 경로, 패키지명 같은 고정 기술 식별자만 원문을 유지한다"

[rules.delivery_spec]
allowed = [
  "apps/*/web/src/app/**/page.spec.md",
  "apps/mobile/src/app/**/index.spec.md",
]
source_of_truth = "서비스 delivery spec에서 생성된 실행 slice"
required_sections = "딜리버리, 상위 서비스 Spec, 기획 Spec 참조, 디자인 정렬, 화면 러프, 리듬 / 레이아웃 계약, 컴포넌트 인벤토리, 기반 Slice, Storybook / 테스트 계약, 백엔드 / API Slice, 필수 요소, 에이전트 배정 매트릭스, 실행 그래프, 공유 파일 잠금, QA / 승인 기준, 승인 / 실행 로그"
guard = "route delivery spec은 service delivery spec에서 파생된 page/route 실행 slice다. 화면 계약, route wiring, component inventory, route-local hook/state, E2E, 해당 route가 소비하는 backend/API/foundation slice만 한글로 기록하고, 서비스 전체 설계와 build order는 docs/services/**/*.delivery.spec.md를 따른다"

[rules.planning_spec]
allowed = [
  "packages/fe-ui/src/screen/{ScreenName}/{ScreenName}.spec.md",
  "packages/fe-ui/src/feature/**/{FeatureName}.spec.md",
  "packages/fe-mo-ui/src/screen/{ScreenName}/{ScreenName}.spec.md",
  "packages/fe-mo-ui/src/feature/**/{FeatureName}.spec.md",
]
source_of_truth = "visual/planning contract"
forbidden_sections = "에이전트 배정 매트릭스, 실행 그래프, 백엔드 / API 계약, 기반 계약, 승인 / 실행 로그"
forbidden_specs = "layout/story/test/e2e/barrel/type/hook/toolkit/store/dto/service/repository/controller/entity/vo/script/config spec"
guard = "screen/feature planning spec은 목표, 화면 러프, props/event, rendering/rhythm, 하위 조합, 상태별 렌더링, story/unit test 계약만 한글로 기록한다. 실행 그래프와 build order는 service delivery spec과 generated route delivery spec만 소유한다"

[i18n]
enabled = true
default_locale = "ko-KR"
supported_locales = ["ko-KR", "en-US"]
translation_schema = "packages/be-prisma/schema/translation.prisma"
message_policy = "사용자 노출 텍스트는 하드코딩 대신 번역 키/리소스 기반으로 관리"

[i18n.role_requirements]
planning = [
  "orch-delivery",
]
implementation = [
  "fe-screen-agent",
  "fe-route-agent",
  "fe-columns-agent",
  "fe-feature-agent",
  "fe-widget-agent",
  "fe-display-agent",
  "fe-control-agent",
  "common-schema-builder",
  "be-dto-builder",
  "be-controller-builder",
  "be-module-builder",
]
data = [
  "be-prisma-builder",
  "be-prisma-annotator",
]
qa = [
  "qa-fe-testing",
  "qa-fe-e2e-testing",
  "qa-be-testing",
]

[agents.be-bootstrap-integrator]
description = "AppModule 부트스트랩에 서비스를 통합하는 전문가"
config_file = "agents/be-bootstrap-integrator.toml"

[agents.be-controller-builder]
description = "CommandBus/QueryBus 기준 NestJS REST Controller를 생성하는 전문가"
config_file = "agents/be-controller-builder.toml"

[agents.be-module-builder]
description = "aggregate root 기준 NestJS Module, CqrsModule, provider wiring을 생성하는 전문가"
config_file = "agents/be-module-builder.toml"

[agents.be-database-expert]
description = "PostgreSQL/Prisma 데이터베이스 설계 및 최적화 전문가"
