[features]
multi_agent = true

[agents]
max_threads = 8
max_depth = 3

[project]
multilingual = true

[rules]
repository_scope = "schema-owner"
repository_generation = "one repository per @schema-owner true model"
service_scope = "schema-owner (aggregate root 단위 도메인 로직)"
application_service_scope = "usecase workflow orchestration (Controller의 workflow 진입점)"

[rules.repository]
owner_required = true
aggregate_root_optional = true
guard = "No repository should be missing for a @schema-owner model"

[rules.service]
scope = "schema-owner aggregate root 단위로 service를 구성"
child_mutation = "child entity 수정은 반드시 root aggregate service 경유"
prisma_direct_call = false
folder_layout = "packages/be-service/src/{name}.service/"
code_file = "packages/be-service/src/{name}.service/index.ts"
sidecar_spec_file = "packages/be-service/src/{name}.service/index.spec.md"
barrel_export_file = "packages/be-service/src/index.ts"
guard = "Service는 @cocrepo/repository를 통한 영속성 접근만 수행하고, @schema-owner가 아닌 모델 별도 service를 만들지 않는다"

[rules.application_service]
required_for_orchestration = true
required_for_multi_step = true
required_for_role_or_permission_or_external_integration = true
folder_layout = "packages/be-app/src/{name}.application-service/"
code_file = "packages/be-app/src/{name}.application-service/index.ts"
sidecar_spec_file = "packages/be-app/src/{name}.application-service/index.spec.md"
barrel_export_file = "packages/be-app/src/index.ts"
guard = "ApplicationService는 사용자 과업 workflow orchestration을 담당하고, Controller 경계의 read model shaping/response composition은 Facade로 분리한다"

[rules.facade]
scope = "controller boundary composition + read model shaping + protocol composition"
required_for_multi_service = false
guard = "Facade는 Controller 경계의 조정/조합만 수행하고 Repository 직접 호출을 금지하며, workflow orchestration을 ApplicationService 대신 흡수하지 않는다"

[rules.controller]
app_layer_required = false
facade_layer_allowed = true
single_root_passthrough_allowed = true
guard = "Controller는 각 endpoint마다 하나의 주 진입점을 선택한다. 유즈케이스 workflow면 @cocrepo/app ApplicationService를, 경계 조합/응답 composition이면 @cocrepo/facade Facade를, 단일 aggregate root 전달형이면 동일 aggregate root Service pass-through를 사용하며, 같은 endpoint에서 Facade와 ApplicationService를 기본 패턴으로 함께 직접 조합하지 않는다"

[i18n]
enabled = true
default_locale = "ko-KR"
supported_locales = ["ko-KR", "en-US"]
translation_schema = "packages/be-prisma/schema/translation.prisma"
message_policy = "사용자 노출 텍스트는 하드코딩 대신 번역 키/리소스 기반으로 관리"

[i18n.role_requirements]
planning = [
  "req-context-planner",
  "req-screen-planner",
  "req-page-planner",
  "req-api-planner",
  "req-feature-planner",
  "req-widget-planner",
  "req-primitive-planner",
]
implementation = [
  "fe-page-builder",
  "fe-feature-builder",
  "fe-widget-builder",
  "fe-primitive-component-builder",
  "fe-input-component-builder",
  "common-schema-builder",
  "be-dto-builder",
  "be-controller-builder",
  "be-module-builder",
]
data = [
  "be-prisma-builder",
  "be-prisma-annotator",
]
qa = [
  "qa-fe-testing",
  "qa-fe-e2e-testing",
  "qa-be-testing",
]

