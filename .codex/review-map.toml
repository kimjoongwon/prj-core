version = 1

[[rules]]
id = "docs-exempt"
match = ["*.md", "**/*.md", "docs/**"]
primary_role = "qa-pr-reviewer"
supporting_roles = []
rule_docs = [".codex/agents/qa-pr-reviewer.toml"]
check_keys = ["documentation-only"]
exempt = true

[[rules]]
id = "meta-exempt"
match = ["pnpm-lock.yaml", ".gitignore", ".editorconfig", ".npmrc", ".env*", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
primary_role = "qa-pr-reviewer"
supporting_roles = []
rule_docs = [".codex/agents/qa-pr-reviewer.toml"]
check_keys = ["documentation-only"]
exempt = true

[[rules]]
id = "codex-role-files"
match = [".codex/agents/**/*.toml", ".codex/config.toml", ".codex/review-map.toml"]
primary_role = "qa-pr-reviewer"
supporting_roles = []
rule_docs = [".codex/config.toml", ".codex/agents/README.md", ".codex/config.toml.guide.md"]
check_keys = ["role-registry-sync", "review-map-coverage", "config-contract"]
exempt = false

[[rules]]
id = "workspace-config"
match = [".wt/config.json", "package.json", "apps/*/package.json", "packages/*/package.json", "pnpm-workspace.yaml", "turbo.json", "tsconfig*.json", "**/tsconfig*.json"]
primary_role = "qa-pr-reviewer"
supporting_roles = []
rule_docs = [".codex/agents/qa-pr-reviewer.toml", ".wt/config.json"]
check_keys = ["config-contract", "role-registry-sync"]
exempt = false

[[rules]]
id = "wt-and-ops-scripts"
match = ["scripts/**/*.js", "scripts/**/*.ts", "scripts/**/*.mjs", "scripts/**/*.sh"]
primary_role = "qa-pr-reviewer"
supporting_roles = []
rule_docs = [".codex/agents/qa-pr-reviewer.toml"]
check_keys = ["config-contract", "review-map-coverage"]
exempt = false

