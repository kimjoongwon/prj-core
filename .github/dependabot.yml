# pnpm workspace 루트 lockfile 기준 주간 의존성 업데이트.
# minor/patch는 하나의 PR로 묶고 major는 개별 PR로 분리합니다.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Dockerfile의 tag/digest 조합을 주간 확인해 고정된 베이스 이미지를 갱신합니다.
  - package-ecosystem: "docker"
    directory: "/devops"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # node 베이스 이미지 메이저 범프는 LTS 전환 검증이 필요한 수동 업그레이드 작업으로만 수행한다.
    # (docker.io/library/node 접두사 형태 둘 다 커버)
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "library/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore"
