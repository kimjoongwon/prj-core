schema: spec-driven

context: |
  설명문은 한글로 작성한다. OpenSpec 구조 heading, SHALL/MUST, 명령어와 기술 식별자는 원문을 유지한다.
  OpenSpec은 변경별 요구사항·설계·작업·검증 조건을 선택적으로 기록하는 문서·CLI 도구다. 사용 안내는 openspec/README.md를 참조한다.
  공통 규칙은 AGENTS.md, 역할·ownership 계약은 .codex/agents/*.toml, 패키지 기술 계약은 해당 package owner 문서가 canonical이다. 이번 변경의 사용자 요구사항과 승인된 설계 문서를 참조하고 기존 owner 문서의 내용을 복제하지 않는다.

rules:
  proposal:
    - 이번 변경의 범위와 관련 요구사항·설계·owner 문서 경로를 명시한다.
  specs:
    - 새로 제공하거나 바꾸는 관찰 가능한 동작과 검증 가능한 시나리오를 기록한다.
  tasks:
    - 기존 owner의 구현·검증 항목을 연결하고 실제 확인한 항목만 완료로 표시한다.
