<link rel="icon" type="image/svg+xml" href="./plate-favicon.svg" />
<meta name="theme-color" content="#0E1116" />
<meta name="description" content="PLATE component explorer for internal design ownership." />
<style>
  /* Remove Storybook-related footer area from the sidebar */
  #sidebar-bottom-wrapper {
    display: none !important;
  }

  html[data-plate-auth-pending="true"] body {
    visibility: hidden !important;
  }
</style>
<script>
  (() => {
    const LOGIN_PATH = "/__storybook_auth/login";
    const SESSION_PATH = "/__storybook_auth/session";
    const AUTH_ALIASES = new Set(["/admin/auth/login", "/auth/login"]);
    const html = document.documentElement;

    const redirectToLogin = (returnTo) => {
      const loginUrl = new URL(LOGIN_PATH, window.location.origin);
      loginUrl.searchParams.set("returnTo", returnTo || window.location.href);

      if (window.top) {
        window.top.location.replace(loginUrl.toString());
        return;
      }

      window.location.replace(loginUrl.toString());
    };

    if (!window.location.pathname.startsWith("/__storybook_auth/")) {
      if (AUTH_ALIASES.has(window.location.pathname)) {
        redirectToLogin(document.referrer || `${window.location.origin}/`);
        return;
      }

      html.setAttribute("data-plate-auth-pending", "true");
      fetch(SESSION_PATH, {
        credentials: "include",
        cache: "no-store",
      })
        .then(async (response) => {
          if (response.status === 404) {
            html.removeAttribute("data-plate-auth-pending");
            return;
          }

          const payload = await response.json().catch(() => null);
          if (response.ok && payload?.authenticated) {
            html.removeAttribute("data-plate-auth-pending");
            return;
          }

          redirectToLogin(window.location.href);
        })
        .catch(() => {
          html.removeAttribute("data-plate-auth-pending");
        });
    }

    const normalizeTitle = () => {
      const currentTitle = document.title || "";
      const normalizedTitle = currentTitle
        .replace(/\s*[⋅·]\s*Storybook/gi, "")
        .replace(/Storybook/gi, "PLATE");

      if (normalizedTitle !== currentTitle) {
        document.title = normalizedTitle;
      }
    };

    normalizeTitle();
    const titleNode = document.querySelector("title");
    if (titleNode) {
      new MutationObserver(normalizeTitle).observe(titleNode, { childList: true });
    }
  })();
</script>
