<link rel="icon" type="image/svg+xml" href="./plate-favicon.svg" />
<meta name="theme-color" content="#0E1116" />
<meta name="description" content="PLATE component explorer for internal design ownership." />
<style>
  /* Remove Storybook-related footer area from the sidebar */
  #sidebar-bottom-wrapper {
    display: none !important;
  }
</style>
<script>
  (() => {
    const normalizeTitle = () => {
      const currentTitle = document.title || "";
      const normalizedTitle = currentTitle
        .replace(/\s*[⋅·]\s*Storybook/gi, "")
        .replace(/Storybook/gi, "PLATE");

      if (normalizedTitle !== currentTitle) {
        document.title = normalizedTitle;
      }
    };

    normalizeTitle();
    const titleNode = document.querySelector("title");
    if (titleNode) {
      new MutationObserver(normalizeTitle).observe(titleNode, { childList: true });
    }
  })();
</script>
