<style>
  html[data-plate-auth-pending="true"] body {
    visibility: hidden !important;
  }
</style>
<script>
  (() => {
    const LOGIN_PATH = "/__storybook_auth/login";
    const SESSION_PATH = "/__storybook_auth/session";
    const html = document.documentElement;

    if (window.location.pathname.startsWith("/__storybook_auth/")) {
      return;
    }

    const redirectToLogin = () => {
      const loginUrl = new URL(LOGIN_PATH, window.location.origin);
      const returnTo =
        window.top && window.top !== window
          ? window.top.location.href
          : window.location.href;
      loginUrl.searchParams.set("returnTo", returnTo);

      if (window.top) {
        window.top.location.replace(loginUrl.toString());
        return;
      }

      window.location.replace(loginUrl.toString());
    };

    html.setAttribute("data-plate-auth-pending", "true");
    fetch(SESSION_PATH, {
      credentials: "include",
      cache: "no-store",
    })
      .then(async (response) => {
        if (response.status === 404) {
          html.removeAttribute("data-plate-auth-pending");
          return;
        }

        const payload = await response.json().catch(() => null);
        if (response.ok && payload?.authenticated) {
          html.removeAttribute("data-plate-auth-pending");
          return;
        }

        redirectToLogin();
      })
      .catch(() => {
        html.removeAttribute("data-plate-auth-pending");
      });
  })();
</script>
