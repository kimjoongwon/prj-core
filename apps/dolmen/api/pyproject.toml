[project]
name = "dolmen-api"
version = "0.1.0"
description = "Dolmen — 등록 이력서 근거로 면접관의 질문에 답하는 모모 API"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.45.0,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pypdf>=6.1,<7",
    "langchain-core==1.7.4",
    "langchain-openai==1.7.3",
    "langchain-qdrant==1.1.0",
    "fastembed==0.8.1",
    "qdrant-client==1.19.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
