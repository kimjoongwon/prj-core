[project]
name = "dolmen-api"
version = "0.1.0"
description = "Dolmen — 등록 이력서 근거로 면접관의 질문에 답하는 모모 API"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.109.1,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pypdf>=6.1,<7",
    "hello-agents[all,fastembed,qdrant]>=0.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
